name: B300 HIGH closure row-depth v0.20 research

on:
  push:
    paths:
      - 'src/cpp/probes/factor_highclosure_rowdepth.cpp'
      - 'src/cuda/b300/maskshard_highclosure_rowpack.cuh'
      - 'src/cuda/b300/maskshard_index.cuh'
      - 'src/cuda/b300/oneesan_cuda_gridfp_b300_hbm32_maskshard_blockorbit_compactaux_fullclosure_highrowpack16_lazyblockinit_rowdepthexact_tightlaunch_rowdepthorbit_rowcaplaunch_exacttasks_batch_guarded.cu'
      - 'src/cuda/b300/oneesan_cuda_gridfp_b300_hbm32_maskshard_blockorbit_compactaux_fullclosure_highrowpack16_lazyblockinit_rowdepthexact_tightlaunch_rowdepthorbit_rowcaplaunch_exacttasks_highclosurerowdepth_batch_guarded.cu'
      - 'scripts/bench/b300_maskshard_highclosure_rowdepth_ab.py'
      - '.github/workflows/b300-highclosure-rowdepth-v20.yml'
  pull_request:
    paths:
      - 'src/cpp/probes/factor_highclosure_rowdepth.cpp'
      - 'src/cuda/b300/maskshard_highclosure_rowpack.cuh'
      - 'src/cuda/b300/maskshard_index.cuh'
      - 'src/cuda/b300/oneesan_cuda_gridfp_b300_hbm32_maskshard_blockorbit_compactaux_fullclosure_highrowpack16_lazyblockinit_rowdepthexact_tightlaunch_rowdepthorbit_rowcaplaunch_exacttasks_batch_guarded.cu'
      - 'src/cuda/b300/oneesan_cuda_gridfp_b300_hbm32_maskshard_blockorbit_compactaux_fullclosure_highrowpack16_lazyblockinit_rowdepthexact_tightlaunch_rowdepthorbit_rowcaplaunch_exacttasks_highclosurerowdepth_batch_guarded.cu'
      - 'scripts/bench/b300_maskshard_highclosure_rowdepth_ab.py'
      - '.github/workflows/b300-highclosure-rowdepth-v20.yml'
  workflow_dispatch:

jobs:
  model:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build HIGH closure row-depth model
        run: |
          mkdir -p build
          g++ -O3 -std=c++17 -Wall -Wextra -Werror \
            src/cpp/probes/factor_highclosure_rowdepth.cpp \
            -o build/factor_highclosure_rowdepth
      - name: Verify n27 HIGH closure row-depth model
        run: build/factor_highclosure_rowdepth 28 14 256 16

  cuda-compile:
    runs-on: ubuntu-latest
    container: nvidia/cuda:12.8.1-devel-ubuntu22.04
    strategy:
      matrix:
        include:
          - width: 22
            low: 11
            high: 10
          - width: 28
            low: 14
            high: 13
    steps:
      - uses: actions/checkout@v4
      - name: Compile v0.19
        shell: bash
        run: |
          mkdir -p build
          nvcc -O3 -std=c++17 -lineinfo -arch=sm_80 \
            -DTARGET_W=${{ matrix.width }} \
            -DLOW_LUT_K=${{ matrix.low }} \
            -DHIGH_LUT_K=${{ matrix.high }} \
            src/cuda/b300/oneesan_cuda_gridfp_b300_hbm32_maskshard_blockorbit_compactaux_fullclosure_highrowpack16_lazyblockinit_rowdepthexact_tightlaunch_rowdepthorbit_rowcaplaunch_exacttasks_batch_guarded.cu \
            -o build/b300_maskshard_v19_w${{ matrix.width }}
      - name: Compile v0.20
        shell: bash
        run: |
          nvcc -O3 -std=c++17 -lineinfo -arch=sm_80 \
            -DTARGET_W=${{ matrix.width }} \
            -DLOW_LUT_K=${{ matrix.low }} \
            -DHIGH_LUT_K=${{ matrix.high }} \
            src/cuda/b300/oneesan_cuda_gridfp_b300_hbm32_maskshard_blockorbit_compactaux_fullclosure_highrowpack16_lazyblockinit_rowdepthexact_tightlaunch_rowdepthorbit_rowcaplaunch_exacttasks_highclosurerowdepth_batch_guarded.cu \
            -o build/b300_maskshard_v20_w${{ matrix.width }}

  ab-driver:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax-check v0.19-v0.20 A/B
        run: python3 -m py_compile scripts/bench/b300_maskshard_highclosure_rowdepth_ab.py
      - name: Dry-run v0.19-v0.20 comparison
        run: |
          python3 scripts/bench/b300_maskshard_highclosure_rowdepth_ab.py \
            --dry-run --n 27 --gpus 8 --threads 256 --modulus 4294967291
