name: B300 LOW closure exact launch v0.27 research

on:
  push:
    paths:
      - 'src/cpp/probes/factor_lowclosure_rowdepth_tasks.cpp'
      - 'src/cuda/b300/maskshard_lowclosure.cuh'
      - 'src/cuda/b300/maskshard_lowclosure_rowdepth_compact.cuh'
      - 'src/cuda/b300/maskshard_lowclosure_kernel.cuh'
      - 'src/cuda/b300/oneesan_cuda_gridfp_b300_hbm32_maskshard_fullorbit_batch.cu'
      - 'src/cuda/b300/oneesan_b300_maskshard_v026_lowclosure_exacttasks.cu'
      - 'src/cuda/b300/oneesan_b300_maskshard_v027_lowclosure_exactlaunch.cu'
      - 'scripts/bench/b300_maskshard_lowclosure_exactlaunch_ab.py'
      - '.github/workflows/b300-lowclosure-exactlaunch-v27.yml'
  pull_request:
    paths:
      - 'src/cpp/probes/factor_lowclosure_rowdepth_tasks.cpp'
      - 'src/cuda/b300/maskshard_lowclosure.cuh'
      - 'src/cuda/b300/maskshard_lowclosure_rowdepth_compact.cuh'
      - 'src/cuda/b300/maskshard_lowclosure_kernel.cuh'
      - 'src/cuda/b300/oneesan_cuda_gridfp_b300_hbm32_maskshard_fullorbit_batch.cu'
      - 'src/cuda/b300/oneesan_b300_maskshard_v026_lowclosure_exacttasks.cu'
      - 'src/cuda/b300/oneesan_b300_maskshard_v027_lowclosure_exactlaunch.cu'
      - 'scripts/bench/b300_maskshard_lowclosure_exactlaunch_ab.py'
      - '.github/workflows/b300-lowclosure-exactlaunch-v27.yml'
  workflow_dispatch:

jobs:
  task-model:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build exact LOW closure launch model
        run: |
          mkdir -p build
          g++ -O3 -std=c++17 -Wall -Wextra -Werror \
            src/cpp/probes/factor_lowclosure_rowdepth_tasks.cpp \
            -o build/factor_lowclosure_rowdepth_tasks
      - name: Verify n=27 launch regression
        run: build/factor_lowclosure_rowdepth_tasks 28 14 256

  cuda-compile:
    runs-on: ubuntu-latest
    container: nvidia/cuda:12.8.1-devel-ubuntu22.04
    strategy:
      matrix:
        include:
          - width: 22
            low: 11
            high: 10
          - width: 28
            low: 14
            high: 13
    steps:
      - uses: actions/checkout@v4
      - name: Compile v0.26 exact LOW tasks
        shell: bash
        run: |
          mkdir -p build
          nvcc -O3 -std=c++17 -lineinfo -arch=sm_80 \
            -DTARGET_W=${{ matrix.width }} \
            -DLOW_LUT_K=${{ matrix.low }} \
            -DHIGH_LUT_K=${{ matrix.high }} \
            src/cuda/b300/oneesan_b300_maskshard_v026_lowclosure_exacttasks.cu \
            -o build/b300_maskshard_v26_w${{ matrix.width }}
      - name: Compile v0.27 exact LOW launch
        shell: bash
        run: |
          nvcc -O3 -std=c++17 -lineinfo -arch=sm_80 \
            -DTARGET_W=${{ matrix.width }} \
            -DLOW_LUT_K=${{ matrix.low }} \
            -DHIGH_LUT_K=${{ matrix.high }} \
            src/cuda/b300/oneesan_b300_maskshard_v027_lowclosure_exactlaunch.cu \
            -o build/b300_maskshard_v27_w${{ matrix.width }}

  ab-driver:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax-check v0.26-v0.27 A/B
        run: python3 -m py_compile scripts/bench/b300_maskshard_lowclosure_exactlaunch_ab.py
      - name: Dry-run v0.26-v0.27 comparison
        run: |
          python3 scripts/bench/b300_maskshard_lowclosure_exactlaunch_ab.py \
            --dry-run --n 27 --gpus 8 --threads 256 --modulus 4294967291
