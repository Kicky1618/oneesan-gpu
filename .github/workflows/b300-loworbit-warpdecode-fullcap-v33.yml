name: B300 LOW orbit full-cap warp decode v0.33 research

on:
  push:
    paths:
      - 'src/cpp/probes/factor_loworbit_warpdecode.cpp'
      - 'src/cpp/probes/factor_loworbit_warpdecode_fullcap.cpp'
      - 'src/cuda/b300/maskshard_loworbit_rowdepth_warpdecode.cuh'
      - 'src/cuda/b300/maskshard_lowclosure_kernel.cuh'
      - 'src/cuda/b300/oneesan_b300_maskshard_v032_loworbit_warpdecode.cu'
      - 'src/cuda/b300/oneesan_b300_maskshard_v033_loworbit_warpdecode_fullcap.cu'
      - 'scripts/bench/b300_maskshard_loworbit_warpdecode_fullcap_ab.py'
      - '.github/workflows/b300-loworbit-warpdecode-fullcap-v33.yml'
  pull_request:
    paths:
      - 'src/cpp/probes/factor_loworbit_warpdecode.cpp'
      - 'src/cpp/probes/factor_loworbit_warpdecode_fullcap.cpp'
      - 'src/cuda/b300/maskshard_loworbit_rowdepth_warpdecode.cuh'
      - 'src/cuda/b300/maskshard_lowclosure_kernel.cuh'
      - 'src/cuda/b300/oneesan_b300_maskshard_v032_loworbit_warpdecode.cu'
      - 'src/cuda/b300/oneesan_b300_maskshard_v033_loworbit_warpdecode_fullcap.cu'
      - 'scripts/bench/b300_maskshard_loworbit_warpdecode_fullcap_ab.py'
      - '.github/workflows/b300-loworbit-warpdecode-fullcap-v33.yml'
  workflow_dispatch:

jobs:
  model:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build warp LOW orbit models
        run: |
          mkdir -p build
          g++ -O3 -std=c++17 -Wall -Wextra -Werror \
            src/cpp/probes/factor_loworbit_warpdecode.cpp \
            -o build/factor_loworbit_warpdecode
          g++ -O3 -std=c++17 -Wall -Wextra -Werror \
            src/cpp/probes/factor_loworbit_warpdecode_fullcap.cpp \
            -o build/factor_loworbit_warpdecode_fullcap
      - name: Verify n=27 warp-decode regressions
        run: |
          build/factor_loworbit_warpdecode 28 14 32
          build/factor_loworbit_warpdecode_fullcap 28 14

  cuda-compile:
    runs-on: ubuntu-latest
    container: nvidia/cuda:12.8.1-devel-ubuntu22.04
    strategy:
      matrix:
        include:
          - width: 22
            low: 11
            high: 10
          - width: 28
            low: 14
            high: 13
    steps:
      - uses: actions/checkout@v4
      - name: Compile v0.32 warp LOW orbit decode
        shell: bash
        run: |
          mkdir -p build
          nvcc -O3 -std=c++17 -lineinfo -arch=sm_80 \
            -DTARGET_W=${{ matrix.width }} \
            -DLOW_LUT_K=${{ matrix.low }} \
            -DHIGH_LUT_K=${{ matrix.high }} \
            src/cuda/b300/oneesan_b300_maskshard_v032_loworbit_warpdecode.cu \
            -o build/b300_maskshard_v32_w${{ matrix.width }}
      - name: Compile v0.33 full-cap warp LOW orbit decode
        shell: bash
        run: |
          nvcc -O3 -std=c++17 -lineinfo -arch=sm_80 \
            -DTARGET_W=${{ matrix.width }} \
            -DLOW_LUT_K=${{ matrix.low }} \
            -DHIGH_LUT_K=${{ matrix.high }} \
            src/cuda/b300/oneesan_b300_maskshard_v033_loworbit_warpdecode_fullcap.cu \
            -o build/b300_maskshard_v33_w${{ matrix.width }}

  ab-driver:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax-check v0.32-v0.33 A/B
        run: python3 -m py_compile scripts/bench/b300_maskshard_loworbit_warpdecode_fullcap_ab.py
      - name: Dry-run v0.32-v0.33 comparison
        run: |
          python3 scripts/bench/b300_maskshard_loworbit_warpdecode_fullcap_ab.py \
            --dry-run --n 27 --gpus 8 --threads 256 --modulus 4294967291
