name: B300 lazy BLOCKED init v0.13 research

on:
  push:
    paths:
      - 'src/cpp/probes/factor_rowboundary_blockzero.cpp'
      - 'src/cpp/probes/factor_lazyblock_firsthigh_semantics.cpp'
      - 'src/cuda/b300/maskshard_zero_block_gather.cuh'
      - 'src/cuda/b300/maskshard_lazy_block_init.cuh'
      - 'src/cuda/b300/maskshard_lowclosure_kernel.cuh'
      - 'src/cuda/b300/oneesan_cuda_gridfp_b300_hbm32_maskshard_blockorbit_compactaux_fullclosure_highrowpack16_zeroblockgather_batch_guarded.cu'
      - 'src/cuda/b300/oneesan_cuda_gridfp_b300_hbm32_maskshard_blockorbit_compactaux_fullclosure_highrowpack16_lazyblockinit_batch_guarded.cu'
      - 'scripts/bench/b300_maskshard_lazyblock_ab.py'
      - '.github/workflows/b300-lazyblock-v13.yml'
  pull_request:
    paths:
      - 'src/cpp/probes/factor_rowboundary_blockzero.cpp'
      - 'src/cpp/probes/factor_lazyblock_firsthigh_semantics.cpp'
      - 'src/cuda/b300/maskshard_zero_block_gather.cuh'
      - 'src/cuda/b300/maskshard_lazy_block_init.cuh'
      - 'src/cuda/b300/maskshard_lowclosure_kernel.cuh'
      - 'src/cuda/b300/oneesan_cuda_gridfp_b300_hbm32_maskshard_blockorbit_compactaux_fullclosure_highrowpack16_zeroblockgather_batch_guarded.cu'
      - 'src/cuda/b300/oneesan_cuda_gridfp_b300_hbm32_maskshard_blockorbit_compactaux_fullclosure_highrowpack16_lazyblockinit_batch_guarded.cu'
      - 'scripts/bench/b300_maskshard_lazyblock_ab.py'
      - '.github/workflows/b300-lazyblock-v13.yml'
  workflow_dispatch:

jobs:
  first-high-semantics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build lazy first-HIGH semantics probe
        run: |
          mkdir -p build
          g++ -O3 -std=c++17 -Wall -Wextra -Werror \
            src/cpp/probes/factor_lazyblock_firsthigh_semantics.cpp \
            -o build/factor_lazyblock_firsthigh_semantics
      - name: Poison BLOCKED scratch and compare with canonical transition
        run: build/factor_lazyblock_firsthigh_semantics 12

  cuda-compile:
    runs-on: ubuntu-latest
    container: nvidia/cuda:12.8.1-devel-ubuntu22.04
    strategy:
      matrix:
        include:
          - width: 22
            low: 11
            high: 10
          - width: 28
            low: 14
            high: 13
    steps:
      - uses: actions/checkout@v4
      - name: Compile v0.12 zero BLOCKED gather
        shell: bash
        run: |
          mkdir -p build
          nvcc -O3 -std=c++17 -lineinfo -arch=sm_80 \
            -DTARGET_W=${{ matrix.width }} \
            -DLOW_LUT_K=${{ matrix.low }} \
            -DHIGH_LUT_K=${{ matrix.high }} \
            src/cuda/b300/oneesan_cuda_gridfp_b300_hbm32_maskshard_blockorbit_compactaux_fullclosure_highrowpack16_zeroblockgather_batch_guarded.cu \
            -o build/b300_maskshard_v12_w${{ matrix.width }}
      - name: Compile v0.13 lazy BLOCKED init
        shell: bash
        run: |
          nvcc -O3 -std=c++17 -lineinfo -arch=sm_80 \
            -DTARGET_W=${{ matrix.width }} \
            -DLOW_LUT_K=${{ matrix.low }} \
            -DHIGH_LUT_K=${{ matrix.high }} \
            src/cuda/b300/oneesan_cuda_gridfp_b300_hbm32_maskshard_blockorbit_compactaux_fullclosure_highrowpack16_lazyblockinit_batch_guarded.cu \
            -o build/b300_maskshard_v13_w${{ matrix.width }}

  ab-driver:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax-check lazy BLOCKED A/B entrypoint
        run: python3 -m py_compile scripts/bench/b300_maskshard_lazyblock_ab.py
      - name: Dry-run v0.12-v0.13 comparison
        run: |
          python3 scripts/bench/b300_maskshard_lazyblock_ab.py \
            --dry-run --n 27 --gpus 8 --threads 256 --modulus 4294967291
