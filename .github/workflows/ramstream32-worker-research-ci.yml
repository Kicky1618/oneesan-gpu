  workflow_dispatch:

concurrency:
  group: ramstream32-low-worker-research-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    container: nvidia/cuda:12.8.1-devel-ubuntu22.04
    steps:
      - uses: actions/checkout@v4
      - name: Check research scripts and provenance
        shell: bash
        run: |
          scripts=(
            scripts/build/gridfp-ramstream32-cpu-low-worker-dense-page-plan.sh
            scripts/build/gridfp-ramstream32-cpu-low-worker-dense-compare-plan.sh
            scripts/bench/ramstream32-cpu-low-worker-dense-compare-plan-sweep.sh
            scripts/build/gridfp-ramstream32-cpu-low-domain-worker-multistart-plan.sh
            scripts/bench/ramstream32-cpu-low-domain-worker-multistart-plan-sweep.sh
            scripts/build/gridfp-ramstream32-cpu-low-worker-shared-multistart-plan.sh
            scripts/bench/ramstream32-cpu-low-worker-shared-multistart-plan-sweep.sh
            scripts/build/gridfp-ramstream32-cpu-low-worker-run-plan.sh
            scripts/bench/ramstream32-cpu-low-worker-run-plan-sweep.sh
            scripts/build/gridfp-ramstream32-cpu-low-worker-swap-plan.sh
            scripts/bench/ramstream32-cpu-low-worker-swap-plan-sweep.sh
            scripts/build/gridfp-ramstream32-cpu-low-worker-fixedpoint-plan.sh
            scripts/bench/ramstream32-cpu-low-worker-fixedpoint-plan-sweep.sh
            scripts/build/gridfp-ramstream32-cpu-low-worker-plateau-plan.sh
            scripts/bench/ramstream32-cpu-low-worker-plateau-plan-sweep.sh
            scripts/build/gridfp-ramstream32-cpu-low-worker-augmented-plan.sh
            scripts/bench/ramstream32-cpu-low-worker-augmented-plan-sweep.sh
          )
          for s in "${scripts[@]}"; do bash -n "$s"; done
          grep -Fq 'flat-page-delta-v5.29' src/cuda/gridfp/ramstream32_cpu_low_domain_worker_unique_coalesce.hpp
          grep -Fq 'dense-page-ref-v5.30' src/cuda/gridfp/ramstream32_cpu_low_domain_worker_unique_dense_coalesce.hpp
          grep -Fq 'structural_audit_ok' src/cuda/gridfp/ramstream32_cpu_low_domain_worker_exact_workspace.hpp
          grep -Fq 'shared-dense-page-ref-v5.31' src/cuda/gridfp/ramstream32_cpu_low_domain_worker_unique_shared_coalesce.hpp
          grep -Fq 'bounded-run-global-unique-v5.32-plan' src/cuda/gridfp/ramstream32_cpu_low_domain_worker_unique_run_coalesce.hpp
          grep -Fq 'bounded-swap-global-unique-v5.33-plan' src/cuda/gridfp/ramstream32_cpu_low_domain_worker_unique_swap_coalesce.hpp
          grep -Fq 'alternating-run-swap-v5.34-plan' src/cuda/gridfp/ramstream32_cpu_low_domain_worker_unique_fixedpoint.hpp
          grep -Fq 'exact-neutral-load-descent-v5.35-plan' src/cuda/gridfp/ramstream32_cpu_low_domain_worker_neutral_balance.hpp
          grep -Fq 'exact-neutral-augmented-v5.36-plan' src/cuda/gridfp/ramstream32_cpu_low_domain_worker_augmented_fixedpoint.hpp
      - name: Compile W10 exact selftests
        shell: bash
        run: |
          mkdir -p build
          common=(-O2 -std=c++17 -arch=sm_80 -DTARGET_W=10 -DLOW_LUT_K=5 -DHIGH_LUT_K=4)
          sources=(
            src/cuda/gridfp/probes/ramstream32_cpu_low_worker_flat_delta_selftest.cu
            src/cuda/gridfp/probes/ramstream32_cpu_low_worker_dense_page_selftest.cu
            src/cuda/gridfp/probes/ramstream32_cpu_low_worker_dense_equivalence_selftest.cu
            src/cuda/gridfp/probes/ramstream32_cpu_low_worker_shared_multistart_selftest.cu
            src/cuda/gridfp/probes/ramstream32_cpu_low_worker_run_selftest.cu
            src/cuda/gridfp/probes/ramstream32_cpu_low_worker_swap_selftest.cu
            src/cuda/gridfp/probes/ramstream32_cpu_low_worker_fixedpoint_selftest.cu
            src/cuda/gridfp/probes/ramstream32_cpu_low_worker_plateau_selftest.cu
            src/cuda/gridfp/probes/ramstream32_cpu_low_worker_augmented_selftest.cu
          )
          for src in "${sources[@]}"; do
            out="build/$(basename "${src%.cu}")"
            nvcc "${common[@]}" "$src" -o "$out"
          done
      - name: Compile W10 plan wrappers cheaply
        shell: bash
        run: |
          common=(-O0 -std=c++17 -arch=sm_80 -DTARGET_W=10 -DLOW_LUT_K=5 -DHIGH_LUT_K=4)
          plans=(
            src/cuda/gridfp/probes/ramstream32_cpu_low_worker_dense_page_plan.cu
            src/cuda/gridfp/probes/ramstream32_cpu_low_worker_dense_compare_plan.cu
            src/cuda/gridfp/probes/ramstream32_cpu_low_domain_worker_multistart_plan.cu
            src/cuda/gridfp/probes/ramstream32_cpu_low_worker_shared_multistart_plan.cu
            src/cuda/gridfp/probes/ramstream32_cpu_low_worker_run_plan.cu
            src/cuda/gridfp/probes/ramstream32_cpu_low_worker_swap_plan.cu
            src/cuda/gridfp/probes/ramstream32_cpu_low_worker_fixedpoint_plan.cu
            src/cuda/gridfp/probes/ramstream32_cpu_low_worker_plateau_plan.cu
            src/cuda/gridfp/probes/ramstream32_cpu_low_worker_augmented_plan.cu
          )
          for src in "${plans[@]}"; do
            out="build/$(basename "${src%.cu}")"
            nvcc "${common[@]}" "$src" -o "$out"
          done
      - name: Run W10 representation and scheduling gates
        shell: bash
        run: |
          build/ramstream32_cpu_low_worker_flat_delta_selftest | grep -F 'cpu-low-worker-flat-delta-selftest OK'
          build/ramstream32_cpu_low_worker_dense_page_selftest | grep -F 'cpu-low-worker-dense-page-selftest OK'
          build/ramstream32_cpu_low_worker_dense_equivalence_selftest > /tmp/dense-eq.txt 2> /tmp/dense-eq.log
          grep -Fq 'cpu-low-worker-dense-equivalence-selftest OK' /tmp/dense-eq.txt
          grep -Fq 'exact_generations=2' /tmp/dense-eq.txt
          build/ramstream32_cpu_low_worker_shared_multistart_selftest > /tmp/shared.txt 2> /tmp/shared.log
          grep -Fq 'cpu-low-worker-shared-multistart-selftest OK' /tmp/shared.txt
          grep -Fq 'identical_selector=1' /tmp/shared.txt
          grep -Fq 'exact_generations=2' /tmp/shared.txt
          build/ramstream32_cpu_low_worker_run_selftest > /tmp/run.txt 2> /tmp/run.log
          grep -Fq 'cpu-low-worker-run-selftest OK' /tmp/run.txt
          grep -Fq 'exact_generations=2' /tmp/run.txt
          build/ramstream32_cpu_low_worker_swap_selftest > /tmp/swap.txt 2> /tmp/swap.log
          grep -Fq 'cpu-low-worker-swap-selftest OK' /tmp/swap.txt
          grep -Fq 'exact_generations=2' /tmp/swap.txt
          build/ramstream32_cpu_low_worker_fixedpoint_selftest > /tmp/fixed.txt 2> /tmp/fixed.log
          grep -Fq 'cpu-low-worker-fixedpoint-selftest OK' /tmp/fixed.txt
          grep -Fq 'exact_generations=2' /tmp/fixed.txt
          build/ramstream32_cpu_low_worker_plateau_selftest > /tmp/plateau.txt 2> /tmp/plateau.log
          grep -Fq 'cpu-low-worker-plateau-selftest OK' /tmp/plateau.txt
          grep -Fq 'exact_generations=2' /tmp/plateau.txt
          build/ramstream32_cpu_low_worker_augmented_selftest > /tmp/aug.txt 2> /tmp/aug.log
          grep -Fq 'cpu-low-worker-augmented-selftest OK' /tmp/aug.txt
          grep -Fq 'exact_generations=2' /tmp/aug.txt
      - name: Run W10 plan smoke checks
        shell: bash
        run: |
          build/ramstream32_cpu_low_worker_dense_page_plan 9 | grep -F 'cpu_low_worker_dense_page_plan OK'
          build/ramstream32_cpu_low_worker_dense_compare_plan 9 4 2 | grep -F 'cpu_low_worker_dense_compare_plan OK'
          build/ramstream32_cpu_low_domain_worker_multistart_plan 9 4 2 | grep -F 'cpu_low_domain_worker_multistart_plan OK'
          build/ramstream32_cpu_low_worker_shared_multistart_plan 9 4 2 > /tmp/shared-plan.txt 2> /tmp/shared-plan.log
          grep -Fq 'cpu_low_worker_shared_multistart_plan OK' /tmp/shared-plan.txt
          grep -Fq 'workspace_audit_ok=1' /tmp/shared-plan.txt
          build/ramstream32_cpu_low_worker_run_plan 9 4 2 4 | grep -F 'cpu_low_worker_run_plan OK'
          build/ramstream32_cpu_low_worker_swap_plan 9 4 2 4 4 | grep -F 'cpu_low_worker_swap_plan OK'
          build/ramstream32_cpu_low_worker_fixedpoint_plan 9 4 2 4 4 | grep -F 'cpu_low_worker_fixedpoint_plan OK'
          build/ramstream32_cpu_low_worker_plateau_plan 9 4 2 4 4 | grep -F 'cpu_low_worker_plateau_plan OK'
          build/ramstream32_cpu_low_worker_augmented_plan 9 4 2 4 4 > /tmp/aug-plan.txt 2> /tmp/aug-plan.log
          grep -Fq 'cpu_low_worker_augmented_plan OK' /tmp/aug-plan.txt
          grep -Fq 'limits_clear=1' /tmp/aug-plan.txt
      - name: Check research documentation chain
        shell: bash
        run: |
          grep -Fq 'v5.29' docs/ramstream32-cpu-low-worker-flat-delta.md
          grep -Fq 'v5.30' docs/ramstream32-cpu-low-worker-dense-page.md
          grep -Fq 'v5.31' docs/ramstream32-cpu-low-worker-shared-workspace.md
          grep -Fq 'v5.32' docs/ramstream32-cpu-low-worker-run-coalesce.md
          grep -Fq 'v5.33' docs/ramstream32-cpu-low-worker-swap-coalesce.md
          grep -Fq 'v5.34' docs/ramstream32-cpu-low-worker-fixedpoint.md
          grep -Fq 'v5.35' docs/ramstream32-cpu-low-worker-neutral-plateau.md
          grep -Fq 'v5.36' docs/ramstream32-cpu-low-worker-augmented-fixedpoint.md
