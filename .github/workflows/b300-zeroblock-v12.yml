name: B300 zero BLOCKED gather v0.12 research

on:
  push:
    paths:
      - 'src/cpp/probes/factor_rowboundary_blockzero.cpp'
      - 'src/cuda/b300/maskshard_zero_block_gather.cuh'
      - 'src/cuda/b300/maskshard_lowclosure_kernel.cuh'
      - 'src/cuda/b300/oneesan_cuda_gridfp_b300_hbm32_maskshard_blockorbit_compactaux_fullclosure_highrowpack16_batch_guarded.cu'
      - 'src/cuda/b300/oneesan_cuda_gridfp_b300_hbm32_maskshard_blockorbit_compactaux_fullclosure_highrowpack16_zeroblockgather_batch_guarded.cu'
      - 'scripts/bench/b300_maskshard_zeroblock_ab.py'
      - '.github/workflows/b300-zeroblock-v12.yml'
  pull_request:
    paths:
      - 'src/cpp/probes/factor_rowboundary_blockzero.cpp'
      - 'src/cuda/b300/maskshard_zero_block_gather.cuh'
      - 'src/cuda/b300/maskshard_lowclosure_kernel.cuh'
      - 'src/cuda/b300/oneesan_cuda_gridfp_b300_hbm32_maskshard_blockorbit_compactaux_fullclosure_highrowpack16_batch_guarded.cu'
      - 'src/cuda/b300/oneesan_cuda_gridfp_b300_hbm32_maskshard_blockorbit_compactaux_fullclosure_highrowpack16_zeroblockgather_batch_guarded.cu'
      - 'scripts/bench/b300_maskshard_zeroblock_ab.py'
      - '.github/workflows/b300-zeroblock-v12.yml'
  workflow_dispatch:

jobs:
  row-boundary-proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build row-boundary BLOCKED-zero probe
        run: |
          mkdir -p build
          g++ -O3 -std=c++17 -Wall -Wextra -Werror \
            src/cpp/probes/factor_rowboundary_blockzero.cpp \
            -o build/factor_rowboundary_blockzero
      - name: Verify p=1 zero-BLOCKED invariant and n=27 traffic model
        run: build/factor_rowboundary_blockzero 13

  cuda-compile:
    runs-on: ubuntu-latest
    container: nvidia/cuda:12.8.1-devel-ubuntu22.04
    strategy:
      matrix:
        include:
          - width: 22
            low: 11
            high: 10
          - width: 28
            low: 14
            high: 13
    steps:
      - uses: actions/checkout@v4
      - name: Compile v0.11 baseline
        shell: bash
        run: |
          mkdir -p build
          nvcc -O3 -std=c++17 -lineinfo -arch=sm_80 \
            -DTARGET_W=${{ matrix.width }} \
            -DLOW_LUT_K=${{ matrix.low }} \
            -DHIGH_LUT_K=${{ matrix.high }} \
            src/cuda/b300/oneesan_cuda_gridfp_b300_hbm32_maskshard_blockorbit_compactaux_fullclosure_highrowpack16_batch_guarded.cu \
            -o build/b300_maskshard_v11_w${{ matrix.width }}
      - name: Compile v0.12 zero BLOCKED gather
        shell: bash
        run: |
          nvcc -O3 -std=c++17 -lineinfo -arch=sm_80 \
            -DTARGET_W=${{ matrix.width }} \
            -DLOW_LUT_K=${{ matrix.low }} \
            -DHIGH_LUT_K=${{ matrix.high }} \
            src/cuda/b300/oneesan_cuda_gridfp_b300_hbm32_maskshard_blockorbit_compactaux_fullclosure_highrowpack16_zeroblockgather_batch_guarded.cu \
            -o build/b300_maskshard_v12_w${{ matrix.width }}

  ab-driver:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax-check v0.12 A/B entrypoint
        run: python3 -m py_compile scripts/bench/b300_maskshard_zeroblock_ab.py
      - name: Dry-run v0.11-v0.12 comparison
        run: |
          python3 scripts/bench/b300_maskshard_zeroblock_ab.py \
            --dry-run --n 27 --gpus 8 --threads 256 --modulus 4294967291
