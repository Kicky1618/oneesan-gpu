name: gridfp snake transition validation

on:
  push:
    paths:
      - 'src/common/gridfp_transition.hpp'
      - 'src/common/gridfp_transition_reverse.hpp'
      - 'src/cpp/probes/gridfp_snake_equivalence.cpp'
      - 'src/cuda/b300/probes/bucket_snake_plan.cu'
      - 'src/cuda/b300/gridfp_bucket_transpose.cuh'
      - 'src/cuda/gridfp/ramstream32_bucket_layout.hpp'
      - '.github/workflows/snake-transition-validation.yml'
  pull_request:
    paths:
      - 'src/common/gridfp_transition.hpp'
      - 'src/common/gridfp_transition_reverse.hpp'
      - 'src/cpp/probes/gridfp_snake_equivalence.cpp'
      - 'src/cuda/b300/probes/bucket_snake_plan.cu'
      - 'src/cuda/b300/gridfp_bucket_transpose.cuh'
      - 'src/cuda/gridfp/ramstream32_bucket_layout.hpp'
      - '.github/workflows/snake-transition-validation.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build snake equivalence probe
        shell: bash
        run: |
          mkdir -p build
          g++ -O3 -std=c++17 src/cpp/probes/gridfp_snake_equivalence.cpp \
            -o build/gridfp_snake_equivalence
      - name: Compare forward and snake rows through n=10
        shell: bash
        run: |
          build/gridfp_snake_equivalence 10 | tee /tmp/snake.txt
          grep -Fq 'gridfp-snake-equivalence OK max_n=10' /tmp/snake.txt
          grep -Fq 'reverse_window_occupancy=OK' /tmp/snake.txt
          grep -Fq 'snake-row-equivalence n=7 residue=3381038999' /tmp/snake.txt

  b300-plan:
    runs-on: ubuntu-latest
    container: nvidia/cuda:12.8.1-devel-ubuntu22.04
    steps:
      - uses: actions/checkout@v4
      - name: Compile and run W28 bucket snake plan
        shell: bash
        run: |
          mkdir -p build
          nvcc -O3 -std=c++17 -lineinfo -arch=sm_80 \
            -DTARGET_W=28 -DLOW_LUT_K=14 -DHIGH_LUT_K=13 \
            src/cuda/b300/probes/bucket_snake_plan.cu \
            -o build/bucket_snake_plan_w28
          build/bucket_snake_plan_w28 | tee /tmp/snake-plan.txt
          grep -Fq 'backend=b300-bucket-snake-plan' /tmp/snake-plan.txt
          grep -Fq 'standard_transposes=55' /tmp/snake-plan.txt
          grep -Fq 'snake_transposes=28' /tmp/snake-plan.txt
          grep -Fq 'peer_saving_pct=49.0909' /tmp/snake-plan.txt
