name: ramstream32 benchmark harness CI

on:
  push:
    paths:
      - 'scripts/bench/ramstream32-factorized-ab.sh'
      - 'scripts/bench/ramstream32-hybrid-sparse-v46-v47.sh'
      - 'scripts/bench/ramstream32-cpu-high-sweep.sh'
      - 'scripts/build/gridfp-ramstream32-cpu-high-cost-plan.sh'
      - 'scripts/tools/profile_high_group_transfer.py'
      - 'scripts/tools/analyze_cpu_high_sweep.py'
      - 'scripts/tools/analyze_cpu_high_numa.py'
      - 'scripts/tools/plan_cpu_high_groups.py'
      - 'docs/ramstream32-factorized-ab.md'
      - 'docs/ramstream32-hybrid-sparse.md'
      - 'docs/ramstream32-cpu-high.md'
      - '.github/workflows/ramstream32-bench-script-ci.yml'
  pull_request:
    paths:
      - 'scripts/bench/ramstream32-factorized-ab.sh'
      - 'scripts/bench/ramstream32-hybrid-sparse-v46-v47.sh'
      - 'scripts/bench/ramstream32-cpu-high-sweep.sh'
      - 'scripts/build/gridfp-ramstream32-cpu-high-cost-plan.sh'
      - 'scripts/tools/profile_high_group_transfer.py'
      - 'scripts/tools/analyze_cpu_high_sweep.py'
      - 'scripts/tools/analyze_cpu_high_numa.py'
      - 'scripts/tools/plan_cpu_high_groups.py'
      - 'docs/ramstream32-factorized-ab.md'
      - 'docs/ramstream32-hybrid-sparse.md'
      - 'docs/ramstream32-cpu-high.md'
      - '.github/workflows/ramstream32-bench-script-ci.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check benchmark harness syntax
        shell: bash
        run: |
          bash -n scripts/bench/ramstream32-factorized-ab.sh
          bash -n scripts/bench/ramstream32-hybrid-sparse-v46-v47.sh
          bash -n scripts/bench/ramstream32-cpu-high-sweep.sh
          bash -n scripts/build/gridfp-ramstream32-cpu-high-cost-plan.sh
          python3 -m py_compile scripts/tools/profile_high_group_transfer.py
          python3 -m py_compile scripts/tools/analyze_cpu_high_sweep.py
          python3 -m py_compile scripts/tools/analyze_cpu_high_numa.py
          python3 -m py_compile scripts/tools/plan_cpu_high_groups.py
      - name: Check HIGH transfer profile regression
        shell: bash
        run: |
          python3 scripts/tools/profile_high_group_transfer.py 27 > /tmp/high-profile.txt
          grep -Fq 'main_states=385719506620 blocked_states=135015505407' /tmp/high-profile.txt
          grep -Fq 'high_roundtrip_tib_per_residue=106.087684520' /tmp/high-profile.txt
          grep -Fq 'threshold_mib=256 cpu_groups=12911' /tmp/high-profile.txt
      - name: Check CPU HIGH sweep analyzer
        shell: bash
        run: |
          cat >/tmp/cpu-high.tsv <<'EOF'
          repeat	order	mode	overlap	threshold_mib	residue	wall_s	h2d_s	gpu_kernel_s	d2h_s	cpu_high_wall_s	cpu_high_kernel_sum_s	cpu_low_wall_s	pcie_removed_tib	pcie_remaining_tib	cpu_high_groups	raw
          1	ascending	direct	0	0	1	100	30	10	30	0	0	10	0	100	0	baseline
          1	ascending	direct	0	256	1	80	20	5	20	10	10	10	20	80	1	offload
          EOF
          cat >/tmp/cost.tsv <<'EOF'
          group	mask	roundtrip_bytes	main_states	blocked_states	gpu_state_steps	nn_cells	nrnl_cells	block_closure_cells	cross_closure_cells	total_cells
          0	0	134217728	1	1	1000000000	1000000	1000000	1000000	1000000	4000000
          1	1	536870912	1	1	2000000000	1000000	1000000	1000000	1000000	4000000
          EOF
          python3 scripts/tools/analyze_cpu_high_sweep.py /tmp/cpu-high.tsv \
            --cost-plan /tmp/cost.tsv > /tmp/cpu-high-analysis.txt
          grep -Fq 'best mode=direct overlap=0 threshold_mib=256 mean_wall_s=80.000000000' \
            /tmp/cpu-high-analysis.txt
          grep -Fq 'sequential_margin_s=15.000000000' /tmp/cpu-high-analysis.txt
          grep -Fq 'calibration mode=direct overlap=0 pcie_gib_s=' /tmp/cpu-high-analysis.txt
          grep -Fq 'calibration mode=direct overlap=0 cpu_gcell_s=' /tmp/cpu-high-analysis.txt
          grep -Fq 'calibration mode=direct overlap=0 gpu_gstate_s=' /tmp/cpu-high-analysis.txt
          grep -Fq -- '--gpu-gstate-s ' /tmp/cpu-high-analysis.txt
          grep -Fq 'planner_command ' /tmp/cpu-high-analysis.txt
      - name: Check CPU HIGH group planner
        shell: bash
        run: |
          cat >/tmp/planner-cost.tsv <<'EOF'
          group	mask	roundtrip_bytes	main_states	blocked_states	gpu_state_steps	nn_cells	nrnl_cells	block_closure_cells	cross_closure_cells	total_cells
          0	0	1073741824	1	1	1000000000	250000	250000	250000	250000	1000000
          1	1	1048576	1	1	1000000	250000000	250000000	250000000	250000000	1000000000
          EOF
          python3 scripts/tools/plan_cpu_high_groups.py /tmp/planner-cost.tsv \
            --pcie-gib-s 10 --cpu-gcell-s 1 --gpu-gstate-s 10 \
            > /tmp/groups.txt 2> /tmp/planner.log
          test "$(cat /tmp/groups.txt)" = 0
          grep -Fq 'mode=sequential' /tmp/planner.log
          grep -Fq 'selected=1' /tmp/planner.log
          grep -Fq 'est_gpu_kernel_saved_s=' /tmp/planner.log

          cat >/tmp/overlap-cost.tsv <<'EOF'
          group	mask	roundtrip_bytes	main_states	blocked_states	nn_cells	nrnl_cells	block_closure_cells	cross_closure_cells	total_cells
          0	0	9663676416	1	1	25000000000	25000000000	25000000000	25000000000	100000000000
          1	1	1073741824	1	1	300000000	300000000	300000000	300000000	1200000000
          EOF
          python3 scripts/tools/plan_cpu_high_groups.py /tmp/overlap-cost.tsv \
            --pcie-gib-s 1 --cpu-gcell-s 1 --overlap \
            > /tmp/overlap.groups 2> /tmp/overlap.log
          test "$(cat /tmp/overlap.groups)" = 1
          grep -Fq 'planner mode=overlap' /tmp/overlap.log
          grep -Fq 'critical_s=9.000000' /tmp/overlap.log
      - name: Check CPU HIGH NUMA page analysis
        shell: bash
        run: |
          cat >/tmp/numa-cost.tsv <<'EOF'
          group	mask	roundtrip_bytes	main_states	blocked_states	authoritative_bytes	page4k_boundary_upper_bytes	page2m_boundary_upper_bytes	nn_cells	nrnl_cells	block_closure_cells	cross_closure_cells	total_cells
          0	0	2048	1	1	1024	512	1024	1	1	1	1	4
          1	1	4096	1	1	2048	0	1024	1	1	1	1	4
          EOF
          printf '0\n' >/tmp/numa.groups
          python3 scripts/tools/analyze_cpu_high_numa.py /tmp/numa-cost.tsv \
            --groups-file /tmp/numa.groups > /tmp/numa-analysis.txt
          grep -Fq 'selection=all groups=2' /tmp/numa-analysis.txt
          grep -Fq 'page4k_boundary_upper_fraction=0.166666667' /tmp/numa-analysis.txt
          grep -Fq 'selection=file groups=1' /tmp/numa-analysis.txt
          grep -Fq 'page4k_boundary_upper_fraction=0.500000000' /tmp/numa-analysis.txt
          grep -Fq 'page2m_boundary_upper_fraction=1.000000000' /tmp/numa-analysis.txt
      - name: Check documented entry points
        shell: bash
        run: |
          grep -Fq 'scripts/bench/ramstream32-factorized-ab.sh' \
            docs/ramstream32-factorized-ab.md
          grep -Fq 'scripts/bench/ramstream32-cpu-high-sweep.sh' \
            docs/ramstream32-cpu-high.md
          grep -Fq 'CPU_HIGH_MODE=direct' docs/ramstream32-cpu-high.md
          grep -Fq 'CPU_HIGH_GROUPS_FILE' docs/ramstream32-cpu-high.md
          grep -Fq 'CPU_HIGH_CPU_LIST' docs/ramstream32-cpu-high.md
          grep -Fq 'analyze_cpu_high_numa.py' docs/ramstream32-cpu-high.md
          grep -Fq 'plan_cpu_high_groups.py' docs/ramstream32-cpu-high.md
          grep -Fq -- '--overlap' docs/ramstream32-cpu-high.md
          grep -Fq -- '--gpu-gstate-s' docs/ramstream32-cpu-high.md
          grep -Fq 'c8de8d73af1c44f075aee937bc8f37e8b7b79d27' \
            docs/ramstream32-hybrid-sparse.md
