name: ramstream32 benchmark harness CI

on:
  push:
    paths:
      - 'scripts/bench/ramstream32-factorized-ab.sh'
      - 'scripts/bench/ramstream32-hybrid-sparse-v46-v47.sh'
      - 'scripts/bench/ramstream32-cpu-high-sweep.sh'
      - 'scripts/tools/profile_high_group_transfer.py'
      - 'docs/ramstream32-factorized-ab.md'
      - 'docs/ramstream32-hybrid-sparse.md'
      - 'docs/ramstream32-cpu-high.md'
      - '.github/workflows/ramstream32-bench-script-ci.yml'
  pull_request:
    paths:
      - 'scripts/bench/ramstream32-factorized-ab.sh'
      - 'scripts/bench/ramstream32-hybrid-sparse-v46-v47.sh'
      - 'scripts/bench/ramstream32-cpu-high-sweep.sh'
      - 'scripts/tools/profile_high_group_transfer.py'
      - 'docs/ramstream32-factorized-ab.md'
      - 'docs/ramstream32-hybrid-sparse.md'
      - 'docs/ramstream32-cpu-high.md'
      - '.github/workflows/ramstream32-bench-script-ci.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check benchmark harness syntax
        shell: bash
        run: |
          bash -n scripts/bench/ramstream32-factorized-ab.sh
          bash -n scripts/bench/ramstream32-hybrid-sparse-v46-v47.sh
          bash -n scripts/bench/ramstream32-cpu-high-sweep.sh
          python3 -m py_compile scripts/tools/profile_high_group_transfer.py
      - name: Check HIGH transfer profile regression
        shell: bash
        run: |
          python3 scripts/tools/profile_high_group_transfer.py 27 > /tmp/high-profile.txt
          grep -Fq 'main_states=385719506620 blocked_states=135015505407' /tmp/high-profile.txt
          grep -Fq 'high_roundtrip_tib_per_residue=106.087684520' /tmp/high-profile.txt
          grep -Fq 'threshold_mib=256 cpu_groups=12911' /tmp/high-profile.txt
      - name: Check documented entry points
        shell: bash
        run: |
          grep -Fq 'scripts/bench/ramstream32-factorized-ab.sh' \
            docs/ramstream32-factorized-ab.md
          grep -Fq 'scripts/bench/ramstream32-cpu-high-sweep.sh' \
            docs/ramstream32-cpu-high.md
          grep -Fq 'CPU_HIGH_MODE=direct' docs/ramstream32-cpu-high.md
          grep -Fq 'c8de8d73af1c44f075aee937bc8f37e8b7b79d27' \
            docs/ramstream32-hybrid-sparse.md
