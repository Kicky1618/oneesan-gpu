name: gpu direct atomicfree compile validation

on:
  push:
    paths:
      - 'src/cuda/gridfp/ramstream32_gpu_direct.cuh'
      - 'src/cuda/gridfp/ramstream32_gpu_direct_gather.cuh'
      - 'src/cuda/gridfp/ramstream32_gpu_direct_gather_cross.cuh'
      - 'src/cuda/gridfp/oneesan_cuda_gridfp_gpu_direct_atomicfree.cu'
      - 'src/cuda/gridfp/probes/ramstream32_gpu_direct_atomicfree_selftest.cu'
      - 'scripts/build/gridfp-gpu-direct-atomicfree.sh'
      - '.github/workflows/gpu-direct-atomicfree-compile.yml'
  pull_request:
    paths:
      - 'src/cuda/gridfp/ramstream32_gpu_direct.cuh'
      - 'src/cuda/gridfp/ramstream32_gpu_direct_gather.cuh'
      - 'src/cuda/gridfp/ramstream32_gpu_direct_gather_cross.cuh'
      - 'src/cuda/gridfp/oneesan_cuda_gridfp_gpu_direct_atomicfree.cu'
      - 'src/cuda/gridfp/probes/ramstream32_gpu_direct_atomicfree_selftest.cu'
      - 'scripts/build/gridfp-gpu-direct-atomicfree.sh'
      - '.github/workflows/gpu-direct-atomicfree-compile.yml'
  workflow_dispatch:

jobs:
  compile:
    runs-on: ubuntu-latest
    container: nvidia/cuda:12.8.1-devel-ubuntu22.04
    steps:
      - uses: actions/checkout@v4
      - name: Compile W10 atomic-free exhaustive probe
        shell: bash
        run: |
          mkdir -p build
          nvcc -O3 -std=c++17 -lineinfo -arch=sm_80 \
            -DTARGET_W=10 -DLOW_LUT_K=5 -DHIGH_LUT_K=4 \
            src/cuda/gridfp/probes/ramstream32_gpu_direct_atomicfree_selftest.cu \
            -o build/ramstream32_gpu_direct_atomicfree_selftest_w10
      - name: Compile W22 atomic-free backend
        shell: bash
        run: |
          nvcc -O3 -std=c++17 -lineinfo -arch=sm_80 \
            -DTARGET_W=22 -DLOW_LUT_K=11 -DHIGH_LUT_K=10 \
            src/cuda/gridfp/oneesan_cuda_gridfp_gpu_direct_atomicfree.cu \
            -o build/oneesan_cuda_gridfp_gpu_direct_atomicfree_n21
      - name: Validate W22 atomic-free plan
        shell: bash
        run: |
          build/oneesan_cuda_gridfp_gpu_direct_atomicfree_n21 \
            21 4294967291 256 16 8 --plan-only 2>&1 | tee /tmp/gdx-plan.txt
          grep -Fq 'backend=gridfp-gpu-direct-atomicfree-v0.1-plan' /tmp/gdx-plan.txt
          grep -Fq 'closure_atomic=0' /tmp/gdx-plan.txt
          grep -Fq 'scratch_bytes=0' /tmp/gdx-plan.txt
      - name: Compile W28 atomic-free backend
        shell: bash
        run: |
          nvcc -O3 -std=c++17 -lineinfo -arch=sm_80 \
            -DTARGET_W=28 -DLOW_LUT_K=14 -DHIGH_LUT_K=13 \
            src/cuda/gridfp/oneesan_cuda_gridfp_gpu_direct_atomicfree.cu \
            -o build/oneesan_cuda_gridfp_gpu_direct_atomicfree_n27
      - name: Validate W28 atomic-free plan
        shell: bash
        run: |
          build/oneesan_cuda_gridfp_gpu_direct_atomicfree_n27 \
            27 4294967291 256 16 8 --plan-only 2>&1 | tee /tmp/gdx-plan-n27.txt
          grep -Fq 'low_max_indegree=7' /tmp/gdx-plan-n27.txt
          grep -Fq 'high_max_indegree=7' /tmp/gdx-plan-n27.txt
          grep -Fq 'closure_atomic=0' /tmp/gdx-plan-n27.txt
