name: ramstream32 v6 compile

on:
  pull_request:
    paths:
      - 'src/cuda/gridfp/oneesan_cuda_gridfp_ramstream32_factorized_hybrid_maskmajor_multigpu.cu'
      - 'src/cuda/gridfp/ramstream32_high_rawbatch.cuh'
      - 'src/cuda/gridfp/ramstream32_high_orbit.cuh'
      - 'src/cuda/gridfp/ramstream32_cpu_low_maskmajor.hpp'
      - 'scripts/build/gridfp-ramstream32-factorized-hybrid-maskmajor-multigpu.sh'
      - '.github/workflows/ramstream32-v6-compile.yml'
  workflow_dispatch:

jobs:
  v6:
    runs-on: ubuntu-latest
    container: nvidia/cuda:12.8.1-devel-ubuntu22.04
    strategy:
      matrix:
        include:
          - width: 22
            n: 21
            low: 11
            high: 10
          - width: 28
            n: 27
            low: 14
            high: 13
    steps:
      - uses: actions/checkout@v4
      - name: Compile v6 multi-GPU
        shell: bash
        run: |
          mkdir -p build
          nvcc -O3 -std=c++17 -lineinfo -arch=sm_80 \
            -DTARGET_W=${{ matrix.width }} -DLOW_LUT_K=${{ matrix.low }} -DHIGH_LUT_K=${{ matrix.high }} \
            src/cuda/gridfp/oneesan_cuda_gridfp_ramstream32_factorized_hybrid_maskmajor_multigpu.cu \
            -o build/v6_w${{ matrix.width }}
      - name: Plan v6 x8
        shell: bash
        run: build/v6_w${{ matrix.width }} ${{ matrix.n }} 4294967291 12288 16 8 --plan-only
