name: ramstream32 LOW worker fixedpoint CI

on:
  push:
    paths:
      - 'src/cuda/gridfp/ramstream32_cpu_low_domain_worker_unique_fixedpoint.hpp'
      - 'src/cuda/gridfp/probes/ramstream32_cpu_low_worker_fixedpoint_plan.cu'
      - 'src/cuda/gridfp/probes/ramstream32_cpu_low_worker_fixedpoint_selftest.cu'
      - 'scripts/build/gridfp-ramstream32-cpu-low-worker-fixedpoint-plan.sh'
      - 'scripts/bench/ramstream32-cpu-low-worker-fixedpoint-plan-sweep.sh'
      - 'docs/ramstream32-cpu-low-worker-fixedpoint.md'
      - '.github/workflows/ramstream32-worker-fixedpoint-ci.yml'
  pull_request:
    paths:
      - 'src/cuda/gridfp/ramstream32_cpu_low_domain_worker_unique_fixedpoint.hpp'
      - 'src/cuda/gridfp/probes/ramstream32_cpu_low_worker_fixedpoint_plan.cu'
      - 'src/cuda/gridfp/probes/ramstream32_cpu_low_worker_fixedpoint_selftest.cu'
      - 'scripts/build/gridfp-ramstream32-cpu-low-worker-fixedpoint-plan.sh'
      - 'scripts/bench/ramstream32-cpu-low-worker-fixedpoint-plan-sweep.sh'
      - 'docs/ramstream32-cpu-low-worker-fixedpoint.md'
      - '.github/workflows/ramstream32-worker-fixedpoint-ci.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    container: nvidia/cuda:12.8.1-devel-ubuntu22.04
    steps:
      - uses: actions/checkout@v4
      - name: Check scripts
        shell: bash
        run: |
          bash -n scripts/build/gridfp-ramstream32-cpu-low-worker-fixedpoint-plan.sh
          bash -n scripts/bench/ramstream32-cpu-low-worker-fixedpoint-plan-sweep.sh
          grep -Fq 'alternating-run-swap-v5.34-plan' scripts/bench/ramstream32-cpu-low-worker-fixedpoint-plan-sweep.sh
          grep -Fq 'run_swap_wins' scripts/bench/ramstream32-cpu-low-worker-fixedpoint-plan-sweep.sh
          grep -Fq 'swap_run_wins' scripts/bench/ramstream32-cpu-low-worker-fixedpoint-plan-sweep.sh
      - name: Compile W10 fixedpoint probes
        shell: bash
        run: |
          mkdir -p build
          common=(-O3 -std=c++17 -arch=sm_80 -DTARGET_W=10 -DLOW_LUT_K=5 -DHIGH_LUT_K=4)
          nvcc "${common[@]}" \
            src/cuda/gridfp/probes/ramstream32_cpu_low_worker_fixedpoint_selftest.cu \
            -o build/ramstream32_cpu_low_worker_fixedpoint_selftest
          nvcc "${common[@]}" \
            src/cuda/gridfp/probes/ramstream32_cpu_low_worker_fixedpoint_plan.cu \
            -o build/ramstream32_cpu_low_worker_fixedpoint_plan
      - name: Validate alternating fixedpoint recurrence
        shell: bash
        run: |
          build/ramstream32_cpu_low_worker_fixedpoint_selftest \
            > /tmp/fixedpoint-selftest.txt 2> /tmp/fixedpoint-selftest.log
          grep -Fq 'cpu-low-worker-fixedpoint-selftest OK' /tmp/fixedpoint-selftest.txt
          grep -Fq 'exact_generations=2' /tmp/fixedpoint-selftest.txt
          grep -Fq 'cpu_low_worker_exact_fixedpoint objective=alternating-run-swap-v5.34-plan' /tmp/fixedpoint-selftest.log
      - name: Validate W10 fixedpoint plan
        shell: bash
        run: |
          build/ramstream32_cpu_low_worker_fixedpoint_plan 9 4 2 4 4 \
            > /tmp/fixedpoint-plan.txt 2> /tmp/fixedpoint-plan.log
          grep -Fq 'cpu_low_worker_fixedpoint_plan OK' /tmp/fixedpoint-plan.txt
          grep -Fq 'objective=alternating-run-swap-v5.34-plan' /tmp/fixedpoint-plan.txt
          grep -Fq 'identical_parent_score=1' /tmp/fixedpoint-plan.txt
          grep -Fq 'limits_clear=1' /tmp/fixedpoint-plan.txt
          grep -Eq 'selected_order=(run-swap|swap-run)' /tmp/fixedpoint-plan.txt
      - name: Check documentation
        shell: bash
        run: |
          d=docs/ramstream32-cpu-low-worker-fixedpoint.md
          grep -Fq 'v5.34' "$d"
          grep -Fq 'run_swap_wins' "$d"
          grep -Fq 'swap_run_wins' "$d"
          grep -Fq 'cannot cycle' "$d"
