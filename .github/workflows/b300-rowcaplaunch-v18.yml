name: B300 row-cap launch v0.18 research

on:
  push:
    paths:
      - 'src/cpp/probes/factor_blockorbit_rowcap_launch.cpp'
      - 'src/cuda/b300/oneesan_cuda_gridfp_b300_hbm32_maskshard_fullorbit_batch.cu'
      - 'src/cuda/b300/oneesan_cuda_gridfp_b300_hbm32_maskshard_blockorbit_compactaux_fullclosure_highrowpack16_lazyblockinit_rowdepthexact_tightlaunch_rowdepthorbit_batch_guarded.cu'
      - 'src/cuda/b300/oneesan_cuda_gridfp_b300_hbm32_maskshard_blockorbit_compactaux_fullclosure_highrowpack16_lazyblockinit_rowdepthexact_tightlaunch_rowdepthorbit_rowcaplaunch_batch_guarded.cu'
      - 'scripts/bench/b300_maskshard_rowcaplaunch_ab.py'
      - '.github/workflows/b300-rowcaplaunch-v18.yml'
  pull_request:
    paths:
      - 'src/cpp/probes/factor_blockorbit_rowcap_launch.cpp'
      - 'src/cuda/b300/oneesan_cuda_gridfp_b300_hbm32_maskshard_fullorbit_batch.cu'
      - 'src/cuda/b300/oneesan_cuda_gridfp_b300_hbm32_maskshard_blockorbit_compactaux_fullclosure_highrowpack16_lazyblockinit_rowdepthexact_tightlaunch_rowdepthorbit_batch_guarded.cu'
      - 'src/cuda/b300/oneesan_cuda_gridfp_b300_hbm32_maskshard_blockorbit_compactaux_fullclosure_highrowpack16_lazyblockinit_rowdepthexact_tightlaunch_rowdepthorbit_rowcaplaunch_batch_guarded.cu'
      - 'scripts/bench/b300_maskshard_rowcaplaunch_ab.py'
      - '.github/workflows/b300-rowcaplaunch-v18.yml'
  workflow_dispatch:

jobs:
  model:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build row-cap launch model
        run: |
          mkdir -p build
          g++ -O3 -std=c++17 -Wall -Wextra -Werror \
            src/cpp/probes/factor_blockorbit_rowcap_launch.cpp \
            -o build/factor_blockorbit_rowcap_launch
      - name: Verify n27 launch model
        run: build/factor_blockorbit_rowcap_launch 28 14 256

  cuda-compile:
    runs-on: ubuntu-latest
    container: nvidia/cuda:12.8.1-devel-ubuntu22.04
    strategy:
      matrix:
        include:
          - width: 22
            low: 11
            high: 10
          - width: 28
            low: 14
            high: 13
    steps:
      - uses: actions/checkout@v4
      - name: Compile v0.17
        shell: bash
        run: |
          mkdir -p build
          nvcc -O3 -std=c++17 -lineinfo -arch=sm_80 \
            -DTARGET_W=${{ matrix.width }} \
            -DLOW_LUT_K=${{ matrix.low }} \
            -DHIGH_LUT_K=${{ matrix.high }} \
            src/cuda/b300/oneesan_cuda_gridfp_b300_hbm32_maskshard_blockorbit_compactaux_fullclosure_highrowpack16_lazyblockinit_rowdepthexact_tightlaunch_rowdepthorbit_batch_guarded.cu \
            -o build/b300_maskshard_v17_w${{ matrix.width }}
      - name: Compile v0.18
        shell: bash
        run: |
          nvcc -O3 -std=c++17 -lineinfo -arch=sm_80 \
            -DTARGET_W=${{ matrix.width }} \
            -DLOW_LUT_K=${{ matrix.low }} \
            -DHIGH_LUT_K=${{ matrix.high }} \
            src/cuda/b300/oneesan_cuda_gridfp_b300_hbm32_maskshard_blockorbit_compactaux_fullclosure_highrowpack16_lazyblockinit_rowdepthexact_tightlaunch_rowdepthorbit_rowcaplaunch_batch_guarded.cu \
            -o build/b300_maskshard_v18_w${{ matrix.width }}

  ab-driver:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax-check v0.17-v0.18 A/B
        run: python3 -m py_compile scripts/bench/b300_maskshard_rowcaplaunch_ab.py
      - name: Dry-run v0.17-v0.18 comparison
        run: |
          python3 scripts/bench/b300_maskshard_rowcaplaunch_ab.py \
            --dry-run --n 27 --gpus 8 --threads 256 --modulus 4294967291
