name: ramstream32 CUDA compile

on:
  push:
    paths:
      - 'src/cuda/gridfp/oneesan_cuda_gridfp_ramstream32_factorized_forced2.cu'
      - 'src/cuda/gridfp/ramstream32_factorized_storage.hpp'
      - 'src/cuda/b300/oneesan_cuda_gridfp_b300_hbm32_factorized_batch.cu'
      - 'src/cuda/common/**'
      - 'scripts/build/gridfp-ramstream32-factorized.sh'
      - '.github/workflows/ramstream32-compile.yml'
  pull_request:
    paths:
      - 'src/cuda/gridfp/oneesan_cuda_gridfp_ramstream32_factorized_forced2.cu'
      - 'src/cuda/gridfp/ramstream32_factorized_storage.hpp'
      - 'src/cuda/b300/oneesan_cuda_gridfp_b300_hbm32_factorized_batch.cu'
      - 'src/cuda/common/**'
      - 'scripts/build/gridfp-ramstream32-factorized.sh'
      - '.github/workflows/ramstream32-compile.yml'
  workflow_dispatch:

jobs:
  compile:
    runs-on: ubuntu-latest
    container: nvidia/cuda:12.8.1-devel-ubuntu22.04
    strategy:
      matrix:
        include:
          - width: 22
            low: 11
            high: 10
          - width: 28
            low: 14
            high: 13
    steps:
      - uses: actions/checkout@v4
      - name: Compile factorized RAM backend
        shell: bash
        run: |
          mkdir -p build
          nvcc -O3 -std=c++17 -lineinfo -arch=sm_80 \
            -DTARGET_W=${{ matrix.width }} \
            -DLOW_LUT_K=${{ matrix.low }} \
            -DHIGH_LUT_K=${{ matrix.high }} \
            src/cuda/gridfp/oneesan_cuda_gridfp_ramstream32_factorized_forced2.cu \
            -o build/ramstream32_w${{ matrix.width }}
