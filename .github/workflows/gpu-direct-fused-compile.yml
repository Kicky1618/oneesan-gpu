name: gpu direct fused compile validation

on:
  push:
    paths:
      - 'src/cpp/probes/cross_inverse_selftest.cpp'
      - 'src/cuda/gridfp/ramstream32_gpu_direct.cuh'
      - 'src/cuda/gridfp/ramstream32_gpu_direct_gather.cuh'
      - 'src/cuda/gridfp/ramstream32_gpu_direct_gather_cross.cuh'
      - 'src/cuda/gridfp/ramstream32_gpu_direct_fused.cuh'
      - 'src/cuda/gridfp/oneesan_cuda_gridfp_gpu_direct_fused.cu'
      - 'src/cuda/gridfp/probes/ramstream32_gpu_direct_fused_selftest.cu'
      - 'scripts/build/gridfp-gpu-direct-fused.sh'
      - '.github/workflows/gpu-direct-fused-compile.yml'
  pull_request:
    paths:
      - 'src/cpp/probes/cross_inverse_selftest.cpp'
      - 'src/cuda/gridfp/ramstream32_gpu_direct.cuh'
      - 'src/cuda/gridfp/ramstream32_gpu_direct_gather.cuh'
      - 'src/cuda/gridfp/ramstream32_gpu_direct_gather_cross.cuh'
      - 'src/cuda/gridfp/ramstream32_gpu_direct_fused.cuh'
      - 'src/cuda/gridfp/oneesan_cuda_gridfp_gpu_direct_fused.cu'
      - 'src/cuda/gridfp/probes/ramstream32_gpu_direct_fused_selftest.cu'
      - 'scripts/build/gridfp-gpu-direct-fused.sh'
      - '.github/workflows/gpu-direct-fused-compile.yml'
  workflow_dispatch:

jobs:
  compile:
    runs-on: ubuntu-latest
    container: nvidia/cuda:12.8.1-devel-ubuntu22.04
    steps:
      - uses: actions/checkout@v4
      - name: Validate CROSS inverse
        shell: bash
        run: |
          mkdir -p build
          g++ -O3 -std=c++17 src/cpp/probes/cross_inverse_selftest.cpp -o build/cross_inverse_selftest
          build/cross_inverse_selftest | tee /tmp/cross.txt
          grep -Fq 'cross-inverse-selftest OK' /tmp/cross.txt
      - name: Compile W10 fused exhaustive probe
        shell: bash
        run: |
          nvcc -O3 -std=c++17 -lineinfo -arch=sm_80 \
            -DTARGET_W=10 -DLOW_LUT_K=5 -DHIGH_LUT_K=4 \
            src/cuda/gridfp/probes/ramstream32_gpu_direct_fused_selftest.cu \
            -o build/ramstream32_gpu_direct_fused_selftest_w10
      - name: Compile W22 fused backend
        shell: bash
        run: |
          nvcc -O3 -std=c++17 -lineinfo -arch=sm_80 \
            -DTARGET_W=22 -DLOW_LUT_K=11 -DHIGH_LUT_K=10 \
            src/cuda/gridfp/oneesan_cuda_gridfp_gpu_direct_fused.cu \
            -o build/oneesan_cuda_gridfp_gpu_direct_fused_n21
      - name: Validate W22 fused plan
        shell: bash
        run: |
          build/oneesan_cuda_gridfp_gpu_direct_fused_n21 \
            21 4294967291 256 16 8 --plan-only 2>&1 | tee /tmp/gdf-plan.txt
          grep -Fq 'backend=gridfp-gpu-direct-fused-v0.1-plan' /tmp/gdf-plan.txt
          grep -Fq 'closure_atomic=0' /tmp/gdf-plan.txt
          grep -Fq 'low_launches_per_row=22' /tmp/gdf-plan.txt
          grep -Fq 'high_launches_per_row=20' /tmp/gdf-plan.txt
          grep -Fq 'scratch_bytes=0' /tmp/gdf-plan.txt
      - name: Compile W28 fused backend
        shell: bash
        run: |
          nvcc -O3 -std=c++17 -lineinfo -arch=sm_80 \
            -DTARGET_W=28 -DLOW_LUT_K=14 -DHIGH_LUT_K=13 \
            src/cuda/gridfp/oneesan_cuda_gridfp_gpu_direct_fused.cu \
            -o build/oneesan_cuda_gridfp_gpu_direct_fused_n27
      - name: Validate W28 fused plan
        shell: bash
        run: |
          build/oneesan_cuda_gridfp_gpu_direct_fused_n27 \
            27 4294967291 256 16 8 --plan-only 2>&1 | tee /tmp/gdf-plan-n27.txt
          grep -Fq 'low_max_indegree=7' /tmp/gdf-plan-n27.txt
          grep -Fq 'high_max_indegree=7' /tmp/gdf-plan-n27.txt
          grep -Fq 'low_launches_per_row=28' /tmp/gdf-plan-n27.txt
          grep -Fq 'high_launches_per_row=26' /tmp/gdf-plan-n27.txt
          grep -Fq 'closure_atomic=0' /tmp/gdf-plan-n27.txt
