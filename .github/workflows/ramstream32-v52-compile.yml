name: ramstream32 v5.2 compile

on:
  pull_request:
    paths:
      - 'src/cuda/gridfp/oneesan_cuda_gridfp_ramstream32_factorized_hybrid_maskmajor*.cu'
      - 'src/cuda/gridfp/ramstream32_lowmask_major_storage.hpp'
      - 'src/cuda/gridfp/ramstream32_cpu_low_maskmajor.hpp'
      - 'src/cuda/gridfp/probes/ramstream32_maskmajor_selftest.cu'
      - '.github/workflows/ramstream32-v52-compile.yml'
  workflow_dispatch:

jobs:
  v52:
    runs-on: ubuntu-latest
    container: nvidia/cuda:12.8.1-devel-ubuntu22.04
    strategy:
      matrix:
        include:
          - width: 22
            n: 21
            low: 11
            high: 10
          - width: 28
            n: 27
            low: 14
            high: 13
    steps:
      - uses: actions/checkout@v4
      - name: Compile v5.1
        shell: bash
        run: |
          mkdir -p build
          nvcc -O3 -std=c++17 -lineinfo -arch=sm_80 \
            -DTARGET_W=${{ matrix.width }} -DLOW_LUT_K=${{ matrix.low }} -DHIGH_LUT_K=${{ matrix.high }} \
            src/cuda/gridfp/oneesan_cuda_gridfp_ramstream32_factorized_hybrid_maskmajor.cu \
            -o build/v51_w${{ matrix.width }}
      - name: Plan v5.1
        shell: bash
        run: build/v51_w${{ matrix.width }} ${{ matrix.n }} 4294967291 12288 4 --plan-only
      - name: Compile v5.2 batch
        shell: bash
        run: |
          nvcc -O3 -std=c++17 -lineinfo -arch=sm_80 \
            -DTARGET_W=${{ matrix.width }} -DLOW_LUT_K=${{ matrix.low }} -DHIGH_LUT_K=${{ matrix.high }} \
            src/cuda/gridfp/oneesan_cuda_gridfp_ramstream32_factorized_hybrid_maskmajor_batch.cu \
            -o build/v52_w${{ matrix.width }}
      - name: Plan v5.2 batch
        shell: bash
        run: build/v52_w${{ matrix.width }} ${{ matrix.n }} 4294967291 12288 4 --plan-only
      - name: Validate mask-major CPU semantics
        if: matrix.width == 22
        shell: bash
        run: |
          nvcc -O3 -std=c++17 -arch=sm_80 \
            -DTARGET_W=10 -DLOW_LUT_K=5 -DHIGH_LUT_K=4 \
            src/cuda/gridfp/probes/ramstream32_maskmajor_selftest.cu \
            -o build/maskmajor_selftest
          build/maskmajor_selftest
