name: ramstream32 LOW worker locality CI

on:
  push:
    paths:
      - 'src/cuda/gridfp/ramstream32_cpu_low_domain_worker_locality.hpp'
      - 'src/cuda/gridfp/ramstream32_cpu_low_domain_worker_coalesce.hpp'
      - 'src/cuda/gridfp/probes/ramstream32_cpu_low_domain_worker_locality_selftest.cu'
      - 'src/cuda/gridfp/probes/ramstream32_cpu_low_domain_worker_locality_plan.cu'
      - 'scripts/build/gridfp-ramstream32-cpu-low-domain-worker-locality-plan.sh'
      - 'scripts/bench/ramstream32-cpu-low-domain-worker-locality-plan-sweep.sh'
      - 'docs/ramstream32-cpu-low-worker-locality.md'
      - '.github/workflows/ramstream32-worker-locality-plan-ci.yml'
  pull_request:
    paths:
      - 'src/cuda/gridfp/ramstream32_cpu_low_domain_worker_locality.hpp'
      - 'src/cuda/gridfp/ramstream32_cpu_low_domain_worker_coalesce.hpp'
      - 'src/cuda/gridfp/probes/ramstream32_cpu_low_domain_worker_locality_selftest.cu'
      - 'src/cuda/gridfp/probes/ramstream32_cpu_low_domain_worker_locality_plan.cu'
      - 'scripts/build/gridfp-ramstream32-cpu-low-domain-worker-locality-plan.sh'
      - 'scripts/bench/ramstream32-cpu-low-domain-worker-locality-plan-sweep.sh'
      - 'docs/ramstream32-cpu-low-worker-locality.md'
      - '.github/workflows/ramstream32-worker-locality-plan-ci.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    container: nvidia/cuda:12.8.1-devel-ubuntu22.04
    steps:
      - uses: actions/checkout@v4
      - name: Check scripts
        shell: bash
        run: |
          bash -n scripts/build/gridfp-ramstream32-cpu-low-domain-worker-locality-plan.sh
          bash -n scripts/bench/ramstream32-cpu-low-domain-worker-locality-plan-sweep.sh
          grep -Fq 'neighbor-page-coalesce-under-domain-cap-v5.26-plan' scripts/bench/ramstream32-cpu-low-domain-worker-locality-plan-sweep.sh
          grep -Fq 'contiguous-under-lpt-cap-v5.25-plan' scripts/bench/ramstream32-cpu-low-domain-worker-locality-plan-sweep.sh
          grep -Fq 'worker-coalesce max-worker regression' scripts/bench/ramstream32-cpu-low-domain-worker-locality-plan-sweep.sh
          grep -Fq 'v5.26_cross_worker_2m_delta=' scripts/bench/ramstream32-cpu-low-domain-worker-locality-plan-sweep.sh
      - name: Compile W10 worker locality probes
        shell: bash
        run: |
          mkdir -p build
          common=(-O3 -std=c++17 -arch=sm_80 -DTARGET_W=10 -DLOW_LUT_K=5 -DHIGH_LUT_K=4)
          nvcc "${common[@]}" \
            src/cuda/gridfp/probes/ramstream32_cpu_low_domain_worker_locality_selftest.cu \
            -o build/ramstream32_cpu_low_domain_worker_locality_selftest
          nvcc "${common[@]}" \
            src/cuda/gridfp/probes/ramstream32_cpu_low_domain_worker_locality_plan.cu \
            -o build/ramstream32_cpu_low_domain_worker_locality_plan
      - name: Validate exact two-generation recurrence
        shell: bash
        run: |
          build/ramstream32_cpu_low_domain_worker_locality_selftest \
            > /tmp/worker-locality-selftest.txt 2> /tmp/worker-locality-selftest.log
          grep -Fq 'cpu-low-domain-worker-locality-selftest OK' /tmp/worker-locality-selftest.txt
          grep -Fq 'synthetic_feasible=1 synthetic_fallback=1' /tmp/worker-locality-selftest.txt
          grep -Fq 'synthetic_noncontiguous=1' /tmp/worker-locality-selftest.txt
          grep -Fq 'coalesce_transitions_before=' /tmp/worker-locality-selftest.txt
          grep -Fq 'coalesce_transitions_after=' /tmp/worker-locality-selftest.txt
          grep -Fq 'cpu_low_domain_worker_locality objective=contiguous-under-lpt-cap-v5.25-plan' /tmp/worker-locality-selftest.log
          grep -Fq 'cpu_low_domain_worker_coalesce objective=neighbor-page-coalesce-under-domain-cap-v5.26-plan' /tmp/worker-locality-selftest.log
      - name: Validate structural page plan
        shell: bash
        run: |
          build/ramstream32_cpu_low_domain_worker_locality_plan 9 4 2 \
            > /tmp/worker-locality-plan.txt 2> /tmp/worker-locality-plan.log
          grep -Fq 'cpu_low_domain_worker_locality_plan OK' /tmp/worker-locality-plan.txt
          grep -Fq 'objective=neighbor-page-coalesce-under-domain-cap-v5.26-plan' /tmp/worker-locality-plan.txt
          grep -Fq 'parent_objective=contiguous-under-lpt-cap-v5.25-plan' /tmp/worker-locality-plan.txt
          grep -Fq 'baseline_cross_worker_pages_2m=' /tmp/worker-locality-plan.txt
          grep -Fq 'locality_cross_worker_pages_2m=' /tmp/worker-locality-plan.txt
          grep -Fq 'coalesced_cross_worker_pages_2m=' /tmp/worker-locality-plan.txt
          grep -Fq 'coalesce_candidate_evaluations=' /tmp/worker-locality-plan.txt
          grep -Fq 'cross_domain_pages_2m=' /tmp/worker-locality-plan.txt
          python3 - <<'PY'
          fields = {}
          for token in open('/tmp/worker-locality-plan.txt').readline().split():
              if '=' in token:
                  k, v = token.split('=', 1)
                  fields[k] = v
          base = int(fields['baseline_max_worker_cells'])
          loc = int(fields['locality_max_worker_cells'])
          coal = int(fields['coalesced_max_worker_cells'])
          assert coal <= loc <= base
          p0=(int(fields['coalesce_penalty_2m_before']),
              int(fields['coalesce_penalty_4k_before']),
              int(fields['coalesce_owner_transitions_before']))
          p1=(int(fields['coalesce_penalty_2m_after']),
              int(fields['coalesce_penalty_4k_after']),
              int(fields['coalesce_owner_transitions_after']))
          assert p1 <= p0
          PY
      - name: Check documentation
        shell: bash
        run: |
          d=docs/ramstream32-cpu-low-worker-locality.md
          grep -Fq 'v5.25' "$d"
          grep -Fq 'v5.26' "$d"
          grep -Fq 'contiguous-under-lpt-cap' "$d"
          grep -Fq 'neighbor-page-coalesce-under-domain-cap' "$d"
          grep -Fq 'cross-worker' "$d"
          grep -Fq 'max worker load cannot increase' "$d"
          grep -Fq 'ramstream32-cpu-low-domain-worker-locality-plan-sweep.sh' "$d"
