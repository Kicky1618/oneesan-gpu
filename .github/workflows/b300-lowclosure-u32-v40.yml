name: B300 LOW closure u32 v0.40 research

on:
  push:
    paths:
      - 'src/cpp/probes/factor_lowclosure_rowdepth_u32.cpp'
      - 'src/cuda/b300/maskshard_low_group_packed_closure_u32.cuh'
      - 'src/cuda/b300/maskshard_low_group_sync.cuh'
      - 'src/cuda/b300/oneesan_b300_maskshard_v039_lowgroup_packedcache.cu'
      - 'src/cuda/b300/oneesan_b300_maskshard_v040_lowclosure_u32.cu'
      - 'scripts/bench/b300_maskshard_lowclosure_u32_ab.py'
      - '.github/workflows/b300-lowclosure-u32-v40.yml'
  pull_request:
    paths:
      - 'src/cpp/probes/factor_lowclosure_rowdepth_u32.cpp'
      - 'src/cuda/b300/maskshard_low_group_packed_closure_u32.cuh'
      - 'src/cuda/b300/maskshard_low_group_sync.cuh'
      - 'src/cuda/b300/oneesan_b300_maskshard_v039_lowgroup_packedcache.cu'
      - 'src/cuda/b300/oneesan_b300_maskshard_v040_lowclosure_u32.cu'
      - 'scripts/bench/b300_maskshard_lowclosure_u32_ab.py'
      - '.github/workflows/b300-lowclosure-u32-v40.yml'
  workflow_dispatch:

jobs:
  model:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build LOW closure u32 bound
        run: |
          mkdir -p build
          g++ -O3 -std=c++17 -Wall -Wextra -Werror \
            src/cpp/probes/factor_lowclosure_rowdepth_u32.cpp \
            -o build/factor_lowclosure_rowdepth_u32
      - name: Verify LOW closure u32 bounds
        run: |
          build/factor_lowclosure_rowdepth_u32 22 11
          build/factor_lowclosure_rowdepth_u32 28 14

  cuda-compile:
    runs-on: ubuntu-latest
    container: nvidia/cuda:12.8.1-devel-ubuntu22.04
    strategy:
      matrix:
        include:
          - width: 22
            low: 11
            high: 10
          - width: 28
            low: 14
            high: 13
    steps:
      - uses: actions/checkout@v4
      - name: Compile v0.39 packed cache baseline
        shell: bash
        run: |
          mkdir -p build
          nvcc -O3 -std=c++17 -lineinfo -arch=sm_80 \
            -DTARGET_W=${{ matrix.width }} \
            -DLOW_LUT_K=${{ matrix.low }} \
            -DHIGH_LUT_K=${{ matrix.high }} \
            src/cuda/b300/oneesan_b300_maskshard_v039_lowgroup_packedcache.cu \
            -o build/b300_maskshard_v39_w${{ matrix.width }}
      - name: Compile v0.40 LOW closure u32
        shell: bash
        run: |
          nvcc -O3 -std=c++17 -lineinfo -arch=sm_80 \
            -DTARGET_W=${{ matrix.width }} \
            -DLOW_LUT_K=${{ matrix.low }} \
            -DHIGH_LUT_K=${{ matrix.high }} \
            src/cuda/b300/oneesan_b300_maskshard_v040_lowclosure_u32.cu \
            -o build/b300_maskshard_v40_w${{ matrix.width }}

  ab-driver:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax-check v0.39-v0.40 A/B
        run: python3 -m py_compile scripts/bench/b300_maskshard_lowclosure_u32_ab.py
      - name: Dry-run v0.39-v0.40 comparison
        run: |
          python3 scripts/bench/b300_maskshard_lowclosure_u32_ab.py \
            --dry-run --n 27 --gpus 8 --threads 256 --modulus 4294967291
