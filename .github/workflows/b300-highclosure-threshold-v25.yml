name: B300 HIGH closure threshold v0.25 research

on:
  push:
    paths:
      - 'src/cpp/probes/factor_highclosure_rowdepth.cpp'
      - 'src/cpp/probes/factor_highclosure_rowdepth_threshold.cpp'
      - 'src/cuda/b300/maskshard_highclosure_rowdepth_compact.cuh'
      - 'src/cuda/b300/maskshard_highclosure_rowdepth_compact_launch.cuh'
      - 'src/cuda/b300/maskshard_highclosure_rowpack.cuh'
      - 'src/cuda/b300/oneesan_cuda_gridfp_b300_hbm32_maskshard_fullorbit_batch.cu'
      - 'src/cuda/b300/oneesan_cuda_gridfp_b300_hbm32_maskshard_blockorbit_compactaux_fullclosure_highrowpack16_lazyblockinit_rowdepthexact_tightlaunch_rowdepthorbit_rowcaplaunch_exacttasks_highclosurerowdepth_tasklaunch_exactclosuretasks_exactclosurelaunch_batch_guarded.cu'
      - 'src/cuda/b300/oneesan_cuda_gridfp_b300_hbm32_maskshard_blockorbit_compactaux_fullclosure_highrowpack29_lazyblockinit_rowdepthexact_tightlaunch_rowdepthorbit_rowcaplaunch_exacttasks_highclosurerowdepth_tasklaunch_exactclosuretasks_exactclosurelaunch_v25_batch_guarded.cu'
      - 'scripts/bench/b300_maskshard_highclosure_threshold29_ab.py'
      - '.github/workflows/b300-highclosure-threshold-v25.yml'
  pull_request:
    paths:
      - 'src/cpp/probes/factor_highclosure_rowdepth.cpp'
      - 'src/cpp/probes/factor_highclosure_rowdepth_threshold.cpp'
      - 'src/cuda/b300/maskshard_highclosure_rowdepth_compact.cuh'
      - 'src/cuda/b300/maskshard_highclosure_rowdepth_compact_launch.cuh'
      - 'src/cuda/b300/maskshard_highclosure_rowpack.cuh'
      - 'src/cuda/b300/oneesan_cuda_gridfp_b300_hbm32_maskshard_fullorbit_batch.cu'
      - 'src/cuda/b300/oneesan_cuda_gridfp_b300_hbm32_maskshard_blockorbit_compactaux_fullclosure_highrowpack16_lazyblockinit_rowdepthexact_tightlaunch_rowdepthorbit_rowcaplaunch_exacttasks_highclosurerowdepth_tasklaunch_exactclosuretasks_exactclosurelaunch_batch_guarded.cu'
      - 'src/cuda/b300/oneesan_cuda_gridfp_b300_hbm32_maskshard_blockorbit_compactaux_fullclosure_highrowpack29_lazyblockinit_rowdepthexact_tightlaunch_rowdepthorbit_rowcaplaunch_exacttasks_highclosurerowdepth_tasklaunch_exactclosuretasks_exactclosurelaunch_v25_batch_guarded.cu'
      - 'scripts/bench/b300_maskshard_highclosure_threshold29_ab.py'
      - '.github/workflows/b300-highclosure-threshold-v25.yml'
  workflow_dispatch:

jobs:
  model:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build exact row-depth threshold model
        run: |
          mkdir -p build
          g++ -O3 -std=c++17 -Wall -Wextra -Werror \
            src/cpp/probes/factor_highclosure_rowdepth_threshold.cpp \
            -o build/factor_highclosure_rowdepth_threshold
      - name: Verify threshold-29 n27 regression
        run: build/factor_highclosure_rowdepth_threshold 28 14 256 29

  cuda-compile:
    runs-on: ubuntu-latest
    container: nvidia/cuda:12.8.1-devel-ubuntu22.04
    strategy:
      matrix:
        include:
          - width: 22
            low: 11
            high: 10
          - width: 28
            low: 14
            high: 13
    steps:
      - uses: actions/checkout@v4
      - name: Compile v0.23 threshold-16
        shell: bash
        run: |
          mkdir -p build
          nvcc -O3 -std=c++17 -lineinfo -arch=sm_80 \
            -DTARGET_W=${{ matrix.width }} \
            -DLOW_LUT_K=${{ matrix.low }} \
            -DHIGH_LUT_K=${{ matrix.high }} \
            src/cuda/b300/oneesan_cuda_gridfp_b300_hbm32_maskshard_blockorbit_compactaux_fullclosure_highrowpack16_lazyblockinit_rowdepthexact_tightlaunch_rowdepthorbit_rowcaplaunch_exacttasks_highclosurerowdepth_tasklaunch_exactclosuretasks_exactclosurelaunch_batch_guarded.cu \
            -o build/b300_maskshard_v23_w${{ matrix.width }}
      - name: Compile v0.25 threshold-29
        shell: bash
        run: |
          nvcc -O3 -std=c++17 -lineinfo -arch=sm_80 \
            -DTARGET_W=${{ matrix.width }} \
            -DLOW_LUT_K=${{ matrix.low }} \
            -DHIGH_LUT_K=${{ matrix.high }} \
            src/cuda/b300/oneesan_cuda_gridfp_b300_hbm32_maskshard_blockorbit_compactaux_fullclosure_highrowpack29_lazyblockinit_rowdepthexact_tightlaunch_rowdepthorbit_rowcaplaunch_exacttasks_highclosurerowdepth_tasklaunch_exactclosuretasks_exactclosurelaunch_v25_batch_guarded.cu \
            -o build/b300_maskshard_v25_w${{ matrix.width }}

  ab-driver:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax-check v0.23-v0.25 A/B
        run: python3 -m py_compile scripts/bench/b300_maskshard_highclosure_threshold29_ab.py
      - name: Dry-run v0.23-v0.25 comparison
        run: |
          python3 scripts/bench/b300_maskshard_highclosure_threshold29_ab.py \
            --dry-run --n 27 --gpus 8 --threads 256 --modulus 4294967291
