name: ramstream32 LOW worker dense page CI

on:
  push:
    paths:
      - 'src/cuda/gridfp/ramstream32_cpu_low_domain_worker_dense_page.hpp'
      - 'src/cuda/gridfp/ramstream32_cpu_low_domain_worker_unique_dense_coalesce.hpp'
      - 'src/cuda/gridfp/ramstream32_cpu_low_domain_worker_unique_coalesce.hpp'
      - 'src/cuda/gridfp/probes/ramstream32_cpu_low_worker_dense_page_selftest.cu'
      - 'src/cuda/gridfp/probes/ramstream32_cpu_low_worker_dense_page_plan.cu'
      - 'src/cuda/gridfp/probes/ramstream32_cpu_low_worker_dense_equivalence_selftest.cu'
      - 'src/cuda/gridfp/probes/ramstream32_cpu_low_domain_worker_locality_selftest.cu'
      - 'scripts/build/gridfp-ramstream32-cpu-low-worker-dense-page-plan.sh'
      - 'docs/ramstream32-cpu-low-worker-dense-page.md'
      - '.github/workflows/ramstream32-worker-dense-page-ci.yml'
  pull_request:
    paths:
      - 'src/cuda/gridfp/ramstream32_cpu_low_domain_worker_dense_page.hpp'
      - 'src/cuda/gridfp/ramstream32_cpu_low_domain_worker_unique_dense_coalesce.hpp'
      - 'src/cuda/gridfp/ramstream32_cpu_low_domain_worker_unique_coalesce.hpp'
      - 'src/cuda/gridfp/probes/ramstream32_cpu_low_worker_dense_page_selftest.cu'
      - 'src/cuda/gridfp/probes/ramstream32_cpu_low_worker_dense_page_plan.cu'
      - 'src/cuda/gridfp/probes/ramstream32_cpu_low_worker_dense_equivalence_selftest.cu'
      - 'src/cuda/gridfp/probes/ramstream32_cpu_low_domain_worker_locality_selftest.cu'
      - 'scripts/build/gridfp-ramstream32-cpu-low-worker-dense-page-plan.sh'
      - 'docs/ramstream32-cpu-low-worker-dense-page.md'
      - '.github/workflows/ramstream32-worker-dense-page-ci.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    container: nvidia/cuda:12.8.1-devel-ubuntu22.04
    steps:
      - uses: actions/checkout@v4
      - name: Check build script and provenance
        shell: bash
        run: |
          bash -n scripts/build/gridfp-ramstream32-cpu-low-worker-dense-page-plan.sh
          grep -Fq 'dense-page-id-substrate-v5.30-plan' src/cuda/gridfp/probes/ramstream32_cpu_low_worker_dense_page_plan.cu
          grep -Fq 'implementation=dense-page-ref-v5.30' src/cuda/gridfp/ramstream32_cpu_low_domain_worker_unique_dense_coalesce.hpp
      - name: Compile W10 dense probes
        shell: bash
        run: |
          mkdir -p build
          common=(-O3 -std=c++17 -arch=sm_80 -DTARGET_W=10 -DLOW_LUT_K=5 -DHIGH_LUT_K=4)
          nvcc "${common[@]}" \
            src/cuda/gridfp/probes/ramstream32_cpu_low_worker_dense_page_selftest.cu \
            -o build/ramstream32_cpu_low_worker_dense_page_selftest
          nvcc "${common[@]}" \
            src/cuda/gridfp/probes/ramstream32_cpu_low_worker_dense_page_plan.cu \
            -o build/ramstream32_cpu_low_worker_dense_page_plan
          nvcc "${common[@]}" \
            src/cuda/gridfp/probes/ramstream32_cpu_low_worker_dense_equivalence_selftest.cu \
            -o build/ramstream32_cpu_low_worker_dense_equivalence_selftest
      - name: Validate dense page algebra
        shell: bash
        run: |
          build/ramstream32_cpu_low_worker_dense_page_selftest | tee /tmp/dense-page-selftest.txt
          grep -Fq 'cpu-low-worker-dense-page-selftest OK' /tmp/dense-page-selftest.txt
          grep -Fq 'cancellation=1' /tmp/dense-page-selftest.txt
          grep -Fq 'duplicate_ref=1' /tmp/dense-page-selftest.txt
      - name: Validate W10 dense plan
        shell: bash
        run: |
          build/ramstream32_cpu_low_worker_dense_page_plan 9 > /tmp/dense-page-plan.txt
          grep -Fq 'cpu_low_worker_dense_page_plan OK' /tmp/dense-page-plan.txt
          grep -Fq 'objective=dense-page-id-substrate-v5.30-plan' /tmp/dense-page-plan.txt
          grep -Fq 'dense_ref_mib=' /tmp/dense-page-plan.txt
      - name: Validate v5.29-v5.30 equivalence
        shell: bash
        run: |
          build/ramstream32_cpu_low_worker_dense_equivalence_selftest \
            > /tmp/dense-equivalence.txt 2> /tmp/dense-equivalence.log
          grep -Fq 'cpu-low-worker-dense-equivalence-selftest OK' /tmp/dense-equivalence.txt
          grep -Fq 'identical_schedule=1' /tmp/dense-equivalence.txt
          grep -Fq 'identical_objective=1' /tmp/dense-equivalence.txt
          grep -Fq 'identical_moves=1' /tmp/dense-equivalence.txt
          grep -Fq 'exact_generations=2' /tmp/dense-equivalence.txt
          grep -Fq 'implementation=flat-page-delta-v5.29' /tmp/dense-equivalence.log
          grep -Fq 'implementation=dense-page-ref-v5.30' /tmp/dense-equivalence.log
      - name: Check documentation
        shell: bash
        run: |
          d=docs/ramstream32-cpu-low-worker-dense-page.md
          grep -Fq 'v5.30' "$d"
          grep -Fq 'dense_total_index_mib' "$d"
          grep -Fq 'identical final schedule' "$d"
