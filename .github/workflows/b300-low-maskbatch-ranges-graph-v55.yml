name: B300 LOW mask-batch compact ranges CUDA Graph v0.55 research

on:
  push:
    paths:
      - 'src/cpp/probes/factor_low_maskbatch_graph_launch.cpp'
      - 'src/cuda/b300/maskshard_low_maskbatch_range_executor.cuh'
      - 'src/cuda/b300/oneesan_b300_maskshard_v054_lowmaskbatch_ranges_target65536.cu'
      - 'src/cuda/b300/oneesan_b300_maskshard_v055_lowmaskbatch_ranges_graph.cu'
      - 'scripts/bench/b300_maskshard_lowmaskbatch_ranges_graph_ab.py'
      - '.github/workflows/b300-low-maskbatch-ranges-graph-v55.yml'
  pull_request:
    paths:
      - 'src/cpp/probes/factor_low_maskbatch_graph_launch.cpp'
      - 'src/cuda/b300/maskshard_low_maskbatch_range_executor.cuh'
      - 'src/cuda/b300/oneesan_b300_maskshard_v054_lowmaskbatch_ranges_target65536.cu'
      - 'src/cuda/b300/oneesan_b300_maskshard_v055_lowmaskbatch_ranges_graph.cu'
      - 'scripts/bench/b300_maskshard_lowmaskbatch_ranges_graph_ab.py'
      - '.github/workflows/b300-low-maskbatch-ranges-graph-v55.yml'
  workflow_dispatch:

jobs:
  model:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build CUDA Graph launch model
        run: |
          mkdir -p build
          g++ -O3 -std=c++17 -Wall -Wextra -Werror \
            src/cpp/probes/factor_low_maskbatch_graph_launch.cpp \
            -o build/factor_low_maskbatch_graph_launch
      - name: Verify n=27 host-submit reduction
        run: build/factor_low_maskbatch_graph_launch 28 14 8

  cuda-compile:
    runs-on: ubuntu-latest
    container: nvidia/cuda:12.8.1-devel-ubuntu22.04
    strategy:
      matrix:
        include:
          - {width: 10, low: 5, high: 4}
          - {width: 22, low: 11, high: 10}
          - {width: 28, low: 14, high: 13}
    steps:
      - uses: actions/checkout@v4
      - name: Compile v0.54 compact-range baseline
        shell: bash
        run: |
          mkdir -p build
          nvcc -O3 -std=c++17 -lineinfo -arch=sm_80 \
            -DTARGET_W=${{ matrix.width }} \
            -DLOW_LUT_K=${{ matrix.low }} \
            -DHIGH_LUT_K=${{ matrix.high }} \
            src/cuda/b300/oneesan_b300_maskshard_v054_lowmaskbatch_ranges_target65536.cu \
            -o build/b300_maskshard_v54_w${{ matrix.width }}
      - name: Compile v0.55 CUDA Graph replay
        shell: bash
        run: |
          nvcc -O3 -std=c++17 -lineinfo -arch=sm_80 \
            -DTARGET_W=${{ matrix.width }} \
            -DLOW_LUT_K=${{ matrix.low }} \
            -DHIGH_LUT_K=${{ matrix.high }} \
            src/cuda/b300/oneesan_b300_maskshard_v055_lowmaskbatch_ranges_graph.cu \
            -o build/b300_maskshard_v55_w${{ matrix.width }}

  ab-driver:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax-check v0.54-v0.55 A/B
        run: python3 -m py_compile scripts/bench/b300_maskshard_lowmaskbatch_ranges_graph_ab.py
      - name: Dry-run small-width residue comparison
        run: |
          python3 scripts/bench/b300_maskshard_lowmaskbatch_ranges_graph_ab.py \
            --dry-run --n 9 --gpus 1 --threads 256 --low 5 --high 4 \
            --modulus 4294967291 --modulus 4294967279
      - name: Dry-run n=27 B300x8 comparison
        run: |
          python3 scripts/bench/b300_maskshard_lowmaskbatch_ranges_graph_ab.py \
            --dry-run --n 27 --gpus 8 --threads 256 --low 14 --high 13 \
            --modulus 4294967291
