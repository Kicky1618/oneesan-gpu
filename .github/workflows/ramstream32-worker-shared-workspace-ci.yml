name: ramstream32 LOW worker shared workspace CI

on:
  push:
    paths:
      - 'src/cuda/gridfp/ramstream32_cpu_low_domain_worker_exact_workspace.hpp'
      - 'src/cuda/gridfp/ramstream32_cpu_low_domain_worker_unique_shared_coalesce.hpp'
      - 'src/cuda/gridfp/probes/ramstream32_cpu_low_worker_shared_multistart_plan.cu'
      - 'src/cuda/gridfp/probes/ramstream32_cpu_low_worker_shared_multistart_selftest.cu'
      - 'scripts/build/gridfp-ramstream32-cpu-low-worker-shared-multistart-plan.sh'
      - 'scripts/bench/ramstream32-cpu-low-worker-shared-multistart-plan-sweep.sh'
      - 'docs/ramstream32-cpu-low-worker-shared-workspace.md'
      - '.github/workflows/ramstream32-worker-shared-workspace-ci.yml'
  pull_request:
    paths:
      - 'src/cuda/gridfp/ramstream32_cpu_low_domain_worker_exact_workspace.hpp'
      - 'src/cuda/gridfp/ramstream32_cpu_low_domain_worker_unique_shared_coalesce.hpp'
      - 'src/cuda/gridfp/probes/ramstream32_cpu_low_worker_shared_multistart_plan.cu'
      - 'src/cuda/gridfp/probes/ramstream32_cpu_low_worker_shared_multistart_selftest.cu'
      - 'scripts/build/gridfp-ramstream32-cpu-low-worker-shared-multistart-plan.sh'
      - 'scripts/bench/ramstream32-cpu-low-worker-shared-multistart-plan-sweep.sh'
      - 'docs/ramstream32-cpu-low-worker-shared-workspace.md'
      - '.github/workflows/ramstream32-worker-shared-workspace-ci.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    container: nvidia/cuda:12.8.1-devel-ubuntu22.04
    steps:
      - uses: actions/checkout@v4
      - name: Check scripts and workspace audit
        shell: bash
        run: |
          bash -n scripts/build/gridfp-ramstream32-cpu-low-worker-shared-multistart-plan.sh
          bash -n scripts/bench/ramstream32-cpu-low-worker-shared-multistart-plan-sweep.sh
          grep -Fq 'shared-dense-multistart-v5.31-plan' scripts/bench/ramstream32-cpu-low-worker-shared-multistart-plan-sweep.sh
          grep -Fq 'identical_direct_schedule' scripts/bench/ramstream32-cpu-low-worker-shared-multistart-plan-sweep.sh
          grep -Fq 'shared_vs_legacy_speedup' scripts/bench/ramstream32-cpu-low-worker-shared-multistart-plan-sweep.sh
          w=src/cuda/gridfp/ramstream32_cpu_low_domain_worker_exact_workspace.hpp
          grep -Fq 'structural_audit_ok' "$w"
          grep -Fq 'empty job was indexed' "$w"
          grep -Fq 'cell sum overflow' "$w"
          grep -Fq 'dense boundary invalid' "$w"
      - name: Compile W10 shared probes
        shell: bash
        run: |
          mkdir -p build
          common=(-O3 -std=c++17 -arch=sm_80 -DTARGET_W=10 -DLOW_LUT_K=5 -DHIGH_LUT_K=4)
          nvcc "${common[@]}" \
            src/cuda/gridfp/probes/ramstream32_cpu_low_worker_shared_multistart_selftest.cu \
            -o build/ramstream32_cpu_low_worker_shared_multistart_selftest
          nvcc "${common[@]}" \
            src/cuda/gridfp/probes/ramstream32_cpu_low_worker_shared_multistart_plan.cu \
            -o build/ramstream32_cpu_low_worker_shared_multistart_plan
      - name: Validate shared selected recurrence
        shell: bash
        run: |
          build/ramstream32_cpu_low_worker_shared_multistart_selftest \
            > /tmp/shared-selftest.txt 2> /tmp/shared-selftest.log
          grep -Fq 'cpu-low-worker-shared-multistart-selftest OK' /tmp/shared-selftest.txt
          grep -Fq 'identical_direct_schedule=1' /tmp/shared-selftest.txt
          grep -Fq 'identical_hybrid_schedule=1' /tmp/shared-selftest.txt
          grep -Fq 'identical_selector=1' /tmp/shared-selftest.txt
          grep -Fq 'exact_generations=2' /tmp/shared-selftest.txt
          grep -Fq 'implementation=shared-dense-page-ref-v5.31' /tmp/shared-selftest.log
      - name: Validate shared structural plan
        shell: bash
        run: |
          build/ramstream32_cpu_low_worker_shared_multistart_plan 9 4 2 \
            > /tmp/shared-plan.txt 2> /tmp/shared-plan.log
          grep -Fq 'cpu_low_worker_shared_multistart_plan OK' /tmp/shared-plan.txt
          grep -Fq 'objective=shared-dense-multistart-v5.31-plan' /tmp/shared-plan.txt
          grep -Fq 'identical_direct_schedule=1' /tmp/shared-plan.txt
          grep -Fq 'identical_hybrid_schedule=1' /tmp/shared-plan.txt
          grep -Fq 'identical_selector=1' /tmp/shared-plan.txt
          grep -Fq 'workspace_mib=' /tmp/shared-plan.txt
          grep -Fq 'shared_vs_legacy_speedup=' /tmp/shared-plan.txt
          grep -Fq 'implementation=shared-dense-page-ref-v5.31' /tmp/shared-plan.log
      - name: Check documentation
        shell: bash
        run: |
          d=docs/ramstream32-cpu-low-worker-shared-workspace.md
          grep -Fq 'v5.31' "$d"
          grep -Fq 'shared_total_build_s' "$d"
          grep -Fq 'identical_selector=1' "$d"
