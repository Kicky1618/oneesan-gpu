name: B300 LOW mask-batch CTA target v0.52 research

on:
  push:
    paths:
      - 'src/cpp/probes/factor_low_maskbatch_replica_tune.cpp'
      - 'src/cuda/b300/maskshard_low_maskbatch_executor.cuh'
      - 'src/cuda/b300/oneesan_b300_maskshard_v050_lowmaskbatch_replica1024.cu'
      - 'src/cuda/b300/oneesan_b300_maskshard_v051_lowmaskbatch_target32768.cu'
      - 'src/cuda/b300/oneesan_b300_maskshard_v052_lowmaskbatch_target65536.cu'
      - 'scripts/bench/b300_maskshard_lowmaskbatch_target_ab.py'
      - '.github/workflows/b300-low-maskbatch-target-v52.yml'
  pull_request:
    paths:
      - 'src/cpp/probes/factor_low_maskbatch_replica_tune.cpp'
      - 'src/cuda/b300/maskshard_low_maskbatch_executor.cuh'
      - 'src/cuda/b300/oneesan_b300_maskshard_v050_lowmaskbatch_replica1024.cu'
      - 'src/cuda/b300/oneesan_b300_maskshard_v051_lowmaskbatch_target32768.cu'
      - 'src/cuda/b300/oneesan_b300_maskshard_v052_lowmaskbatch_target65536.cu'
      - 'scripts/bench/b300_maskshard_lowmaskbatch_target_ab.py'
      - '.github/workflows/b300-low-maskbatch-target-v52.yml'
  workflow_dispatch:

jobs:
  model:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build exact LOW batch tuning model
        run: |
          mkdir -p build
          g++ -O3 -std=c++17 -Wall -Wextra -Werror \
            src/cpp/probes/factor_low_maskbatch_replica_tune.cpp \
            -o build/factor_low_maskbatch_replica_tune
      - name: Sweep n=27 CTA work targets
        run: |
          build/factor_low_maskbatch_replica_tune 28 14 8 16384
          build/factor_low_maskbatch_replica_tune 28 14 8 32768
          build/factor_low_maskbatch_replica_tune 28 14 8 65536

  cuda-compile:
    runs-on: ubuntu-latest
    container: nvidia/cuda:12.8.1-devel-ubuntu22.04
    strategy:
      matrix:
        include:
          - {width: 10, low: 5, high: 4}
          - {width: 22, low: 11, high: 10}
          - {width: 28, low: 14, high: 13}
    steps:
      - uses: actions/checkout@v4
      - name: Compile 16K target baseline
        shell: bash
        run: |
          mkdir -p build
          nvcc -O3 -std=c++17 -lineinfo -arch=sm_80 \
            -DTARGET_W=${{ matrix.width }} \
            -DLOW_LUT_K=${{ matrix.low }} \
            -DHIGH_LUT_K=${{ matrix.high }} \
            src/cuda/b300/oneesan_b300_maskshard_v050_lowmaskbatch_replica1024.cu \
            -o build/b300_maskshard_v50_w${{ matrix.width }}
      - name: Compile 32K target
        shell: bash
        run: |
          nvcc -O3 -std=c++17 -lineinfo -arch=sm_80 \
            -DTARGET_W=${{ matrix.width }} \
            -DLOW_LUT_K=${{ matrix.low }} \
            -DHIGH_LUT_K=${{ matrix.high }} \
            src/cuda/b300/oneesan_b300_maskshard_v051_lowmaskbatch_target32768.cu \
            -o build/b300_maskshard_v51_w${{ matrix.width }}
      - name: Compile 64K target
        shell: bash
        run: |
          nvcc -O3 -std=c++17 -lineinfo -arch=sm_80 \
            -DTARGET_W=${{ matrix.width }} \
            -DLOW_LUT_K=${{ matrix.low }} \
            -DHIGH_LUT_K=${{ matrix.high }} \
            src/cuda/b300/oneesan_b300_maskshard_v052_lowmaskbatch_target65536.cu \
            -o build/b300_maskshard_v52_w${{ matrix.width }}

  ab-driver:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax-check target sweep driver
        run: python3 -m py_compile scripts/bench/b300_maskshard_lowmaskbatch_target_ab.py
      - name: Dry-run small-width target sweep
        run: |
          python3 scripts/bench/b300_maskshard_lowmaskbatch_target_ab.py \
            --dry-run --n 9 --gpus 1 --threads 256 --low 5 --high 4 \
            --modulus 4294967291 --modulus 4294967279
      - name: Dry-run n=27 B300x8 target sweep
        run: |
          python3 scripts/bench/b300_maskshard_lowmaskbatch_target_ab.py \
            --dry-run --n 27 --gpus 8 --threads 256 --low 14 --high 13 \
            --modulus 4294967291
