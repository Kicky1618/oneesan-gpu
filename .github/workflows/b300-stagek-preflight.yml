name: B300 Stage K preflight

on:
  push:
    paths:
      - 'scripts/bench/b300-stagek-preflight.sh'
      - 'scripts/bench/b300-grand-stagek-contract-preflight.sh'
      - 'scripts/bench/b300-grand-stagem-contract-preflight.sh'
      - 'scripts/bench/b300-grand-stagem-exact-promotion-preflight.sh'
      - 'scripts/bench/b300-nextgen-hybrid8-mate-evict-sweep.sh'
      - 'scripts/bench/b300-nextgen-hybrid8-mate-evict-staged-calibrate.sh'
      - 'scripts/bench/b300-nextgen-hybrid8-prefetch-guard-staged-calibrate.sh'
      - 'scripts/bench/b300-nextgen-hybrid8-mate-load-policy-sweep.sh'
      - 'scripts/bench/b300-nextgen-hybrid8-mate-load-policy-staged-calibrate.sh'
      - 'scripts/bench/b300-stagem-preflight.sh'
      - 'scripts/bench/b300-mainrec-hybrid8-mate-load-policy-preflight.sh'
      - 'scripts/build/gen-b300-mainrec-hybrid8-mate-load-policy.py'
      - 'scripts/build/gen-b300-grand-selector-stagem.py'
      - 'scripts/build/gen-b300-grand-firstpass-stagem.py'
      - 'scripts/build/b300-forced-nextgen-hybrid8-mate-load-policy.sh'
      - 'scripts/run/b300x8-nextgen-hybrid8-mate-evict-stagek-staged-fullprime-race.sh'
      - 'scripts/run/b300x8-nextgen-hybrid8-prefetch-guard-stagel-staged-fullprime-race.sh'
      - 'scripts/run/b300x8-nextgen-hybrid8-mate-load-stagem-staged-fullprime-race.sh'
      - 'scripts/run/b300x8-joint-nextself-hybrid8-select.sh'
      - 'scripts/run/b300x8-joint-nextself-hybrid8-select-stagem.sh'
      - 'scripts/run/b300x8-grand-firstpass.sh'
      - 'scripts/run/b300x8-grand-firstpass-stagem.sh'
      - 'scripts/run/b300x8-grand-promote-exact-stagem.sh'
      - 'scripts/run/b300x8-grand-stagek-firstpass.sh'
      - 'scripts/run/b300x8-grand-stagek-continue.sh'
      - 'scripts/run/b300x8-nextgen-hybrid8-nextmate-geometry-stagej-staged-fullprime-race.sh'
      - 'scripts/run/b300x8-grand-stagej-firstpass-v2.sh'
      - 'scripts/bench/b300-grand-stagej-v2-contract-preflight.sh'
      - 'scripts/run/b300x8-grand-promote-exact.sh'
      - 'scripts/run/b300x8-grand-verify-exact.sh'
      - 'scripts/bench/b300-grand-exact-promotion-preflight.sh'
      - 'scripts/bench/b300-exact-result-verifier-preflight.py'
      - '.github/workflows/b300-stagek-preflight.yml'
  pull_request:
    paths:
      - 'scripts/bench/b300-stagek-preflight.sh'
      - 'scripts/bench/b300-grand-stagek-contract-preflight.sh'
      - 'scripts/bench/b300-grand-stagem-contract-preflight.sh'
      - 'scripts/bench/b300-grand-stagem-exact-promotion-preflight.sh'
      - 'scripts/bench/b300-nextgen-hybrid8-mate-evict-sweep.sh'
      - 'scripts/bench/b300-nextgen-hybrid8-mate-evict-staged-calibrate.sh'
      - 'scripts/bench/b300-nextgen-hybrid8-prefetch-guard-staged-calibrate.sh'
      - 'scripts/bench/b300-nextgen-hybrid8-mate-load-policy-sweep.sh'
      - 'scripts/bench/b300-nextgen-hybrid8-mate-load-policy-staged-calibrate.sh'
      - 'scripts/bench/b300-stagem-preflight.sh'
      - 'scripts/bench/b300-mainrec-hybrid8-mate-load-policy-preflight.sh'
      - 'scripts/build/gen-b300-mainrec-hybrid8-mate-load-policy.py'
      - 'scripts/build/gen-b300-grand-selector-stagem.py'
      - 'scripts/build/gen-b300-grand-firstpass-stagem.py'
      - 'scripts/build/b300-forced-nextgen-hybrid8-mate-load-policy.sh'
      - 'scripts/run/b300x8-nextgen-hybrid8-mate-evict-stagek-staged-fullprime-race.sh'
      - 'scripts/run/b300x8-nextgen-hybrid8-prefetch-guard-stagel-staged-fullprime-race.sh'
      - 'scripts/run/b300x8-nextgen-hybrid8-mate-load-stagem-staged-fullprime-race.sh'
      - 'scripts/run/b300x8-joint-nextself-hybrid8-select.sh'
      - 'scripts/run/b300x8-joint-nextself-hybrid8-select-stagem.sh'
      - 'scripts/run/b300x8-grand-firstpass.sh'
      - 'scripts/run/b300x8-grand-firstpass-stagem.sh'
      - 'scripts/run/b300x8-grand-promote-exact-stagem.sh'
      - 'scripts/run/b300x8-grand-stagek-firstpass.sh'
      - 'scripts/run/b300x8-grand-stagek-continue.sh'
      - 'scripts/run/b300x8-nextgen-hybrid8-nextmate-geometry-stagej-staged-fullprime-race.sh'
      - 'scripts/run/b300x8-grand-stagej-firstpass-v2.sh'
      - 'scripts/bench/b300-grand-stagej-v2-contract-preflight.sh'
      - 'scripts/run/b300x8-grand-promote-exact.sh'
      - 'scripts/run/b300x8-grand-verify-exact.sh'
      - 'scripts/bench/b300-grand-exact-promotion-preflight.sh'
      - 'scripts/bench/b300-exact-result-verifier-preflight.py'
      - '.github/workflows/b300-stagek-preflight.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate isolated Stage J contract
        run: bash scripts/bench/b300-grand-stagej-v2-contract-preflight.sh
      - name: Validate Stage K mate eviction refinement
        run: bash scripts/bench/b300-stagek-preflight.sh
      - name: Validate canonical integrated Stage K first-pass
        run: bash scripts/bench/b300-grand-stagek-contract-preflight.sh
      - name: Validate Stage M mate load cache-policy transform
        run: |
          python3 -m py_compile scripts/build/gen-b300-mainrec-hybrid8-mate-load-policy.py
          bash -n scripts/build/b300-forced-nextgen-hybrid8-mate-load-policy.sh
          bash scripts/bench/b300-mainrec-hybrid8-mate-load-policy-preflight.sh
      - name: Validate Stage L to Stage M isolation and promotion
        run: bash scripts/bench/b300-stagem-preflight.sh
      - name: Validate generated Stage M grand first-pass
        run: bash scripts/bench/b300-grand-stagem-contract-preflight.sh
      - name: Validate Stage L M exact provenance
        run: bash scripts/bench/b300-grand-stagem-exact-promotion-preflight.sh
      - name: Validate exact promotion and checkpoint compatibility
        run: bash scripts/bench/b300-grand-exact-promotion-preflight.sh
      - name: Validate independent exact CRT verifier
        run: |
          bash -n scripts/run/b300x8-grand-verify-exact.sh
          python3 scripts/bench/b300-exact-result-verifier-preflight.py
