name: B300 HIGH closure exact launch v0.23 research

on:
  push:
    paths:
      - 'src/cpp/probes/factor_highclosure_rowdepth.cpp'
      - 'src/cpp/probes/factor_highclosure_rowdepth_taskmap.cpp'
      - 'src/cuda/b300/maskshard_highclosure_rowdepth_compact.cuh'
      - 'src/cuda/b300/maskshard_highclosure_rowdepth_compact_launch.cuh'
      - 'src/cuda/b300/maskshard_lowclosure_kernel.cuh'
      - 'src/cuda/b300/oneesan_cuda_gridfp_b300_hbm32_maskshard_fullorbit_batch.cu'
      - 'src/cuda/b300/oneesan_cuda_gridfp_b300_hbm32_maskshard_blockorbit_compactaux_fullclosure_highrowpack16_lazyblockinit_rowdepthexact_tightlaunch_rowdepthorbit_rowcaplaunch_exacttasks_highclosurerowdepth_tasklaunch_exactclosuretasks_batch_guarded.cu'
      - 'src/cuda/b300/oneesan_cuda_gridfp_b300_hbm32_maskshard_blockorbit_compactaux_fullclosure_highrowpack16_lazyblockinit_rowdepthexact_tightlaunch_rowdepthorbit_rowcaplaunch_exacttasks_highclosurerowdepth_tasklaunch_exactclosuretasks_exactclosurelaunch_batch_guarded.cu'
      - 'scripts/bench/b300_maskshard_highclosure_exactlaunch_ab.py'
      - '.github/workflows/b300-highclosure-exactlaunch-v23.yml'
  pull_request:
    paths:
      - 'src/cpp/probes/factor_highclosure_rowdepth.cpp'
      - 'src/cpp/probes/factor_highclosure_rowdepth_taskmap.cpp'
      - 'src/cuda/b300/maskshard_highclosure_rowdepth_compact.cuh'
      - 'src/cuda/b300/maskshard_highclosure_rowdepth_compact_launch.cuh'
      - 'src/cuda/b300/maskshard_lowclosure_kernel.cuh'
      - 'src/cuda/b300/oneesan_cuda_gridfp_b300_hbm32_maskshard_fullorbit_batch.cu'
      - 'src/cuda/b300/oneesan_cuda_gridfp_b300_hbm32_maskshard_blockorbit_compactaux_fullclosure_highrowpack16_lazyblockinit_rowdepthexact_tightlaunch_rowdepthorbit_rowcaplaunch_exacttasks_highclosurerowdepth_tasklaunch_exactclosuretasks_batch_guarded.cu'
      - 'src/cuda/b300/oneesan_cuda_gridfp_b300_hbm32_maskshard_blockorbit_compactaux_fullclosure_highrowpack16_lazyblockinit_rowdepthexact_tightlaunch_rowdepthorbit_rowcaplaunch_exacttasks_highclosurerowdepth_tasklaunch_exactclosuretasks_exactclosurelaunch_batch_guarded.cu'
      - 'scripts/bench/b300_maskshard_highclosure_exactlaunch_ab.py'
      - '.github/workflows/b300-highclosure-exactlaunch-v23.yml'
  workflow_dispatch:

jobs:
  model:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build HIGH closure row-depth model
        run: |
          mkdir -p build
          g++ -O3 -std=c++17 -Wall -Wextra -Werror \
            src/cpp/probes/factor_highclosure_rowdepth.cpp \
            -o build/factor_highclosure_rowdepth
      - name: Verify n27 exact launch model
        run: build/factor_highclosure_rowdepth 28 14 256 16

  taskmap:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - width: 10
            low: 5
          - width: 12
            low: 6
    steps:
      - uses: actions/checkout@v4
      - name: Build exact HIGH closure task-map probe
        run: |
          mkdir -p build
          g++ -O3 -std=c++17 -Wall -Wextra -Werror \
            src/cpp/probes/factor_highclosure_rowdepth_taskmap.cpp \
            -o build/factor_highclosure_rowdepth_taskmap
      - name: Verify exact compact task set
        run: build/factor_highclosure_rowdepth_taskmap ${{ matrix.width }} ${{ matrix.low }} 16

  cuda-compile:
    runs-on: ubuntu-latest
    container: nvidia/cuda:12.8.1-devel-ubuntu22.04
    strategy:
      matrix:
        include:
          - width: 22
            low: 11
            high: 10
          - width: 28
            low: 14
            high: 13
    steps:
      - uses: actions/checkout@v4
      - name: Compile v0.22
        shell: bash
        run: |
          mkdir -p build
          nvcc -O3 -std=c++17 -lineinfo -arch=sm_80 \
            -DTARGET_W=${{ matrix.width }} \
            -DLOW_LUT_K=${{ matrix.low }} \
            -DHIGH_LUT_K=${{ matrix.high }} \
            src/cuda/b300/oneesan_cuda_gridfp_b300_hbm32_maskshard_blockorbit_compactaux_fullclosure_highrowpack16_lazyblockinit_rowdepthexact_tightlaunch_rowdepthorbit_rowcaplaunch_exacttasks_highclosurerowdepth_tasklaunch_exactclosuretasks_batch_guarded.cu \
            -o build/b300_maskshard_v22_w${{ matrix.width }}
      - name: Compile v0.23
        shell: bash
        run: |
          nvcc -O3 -std=c++17 -lineinfo -arch=sm_80 \
            -DTARGET_W=${{ matrix.width }} \
            -DLOW_LUT_K=${{ matrix.low }} \
            -DHIGH_LUT_K=${{ matrix.high }} \
            src/cuda/b300/oneesan_cuda_gridfp_b300_hbm32_maskshard_blockorbit_compactaux_fullclosure_highrowpack16_lazyblockinit_rowdepthexact_tightlaunch_rowdepthorbit_rowcaplaunch_exacttasks_highclosurerowdepth_tasklaunch_exactclosuretasks_exactclosurelaunch_batch_guarded.cu \
            -o build/b300_maskshard_v23_w${{ matrix.width }}

  ab-driver:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax-check v0.22-v0.23 A/B
        run: python3 -m py_compile scripts/bench/b300_maskshard_highclosure_exactlaunch_ab.py
      - name: Dry-run v0.22-v0.23 comparison
        run: |
          python3 scripts/bench/b300_maskshard_highclosure_exactlaunch_ab.py \
            --dry-run --n 27 --gpus 8 --threads 256 --modulus 4294967291
