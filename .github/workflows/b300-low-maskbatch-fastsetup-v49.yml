name: B300 LOW mask-batch fast setup v0.49 research

on:
  push:
    paths:
      - 'src/cpp/probes/factor_low_maskbatch_fast_setup.cpp'
      - 'src/cuda/b300/maskshard_low_maskbatch_config.cuh'
      - 'src/cuda/b300/oneesan_b300_maskshard_v048_lowmaskbatch_rebuilddyn.cu'
      - 'src/cuda/b300/oneesan_b300_maskshard_v049_lowmaskbatch_fastsetup.cu'
      - 'scripts/bench/b300_maskshard_lowmaskbatch_fastsetup_ab.py'
      - '.github/workflows/b300-low-maskbatch-fastsetup-v49.yml'
  pull_request:
    paths:
      - 'src/cpp/probes/factor_low_maskbatch_fast_setup.cpp'
      - 'src/cuda/b300/maskshard_low_maskbatch_config.cuh'
      - 'src/cuda/b300/oneesan_b300_maskshard_v048_lowmaskbatch_rebuilddyn.cu'
      - 'src/cuda/b300/oneesan_b300_maskshard_v049_lowmaskbatch_fastsetup.cu'
      - 'scripts/bench/b300_maskshard_lowmaskbatch_fastsetup_ab.py'
      - '.github/workflows/b300-low-maskbatch-fastsetup-v49.yml'
  workflow_dispatch:

jobs:
  model:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build fast-setup model
        run: |
          mkdir -p build
          g++ -O3 -std=c++17 -Wall -Wextra -Werror \
            src/cpp/probes/factor_low_maskbatch_fast_setup.cpp \
            -o build/factor_low_maskbatch_fast_setup
      - name: Verify duplicate setup work removed
        run: |
          build/factor_low_maskbatch_fast_setup 10 5
          build/factor_low_maskbatch_fast_setup 22 11
          build/factor_low_maskbatch_fast_setup 28 14

  cuda-compile:
    runs-on: ubuntu-latest
    container: nvidia/cuda:12.8.1-devel-ubuntu22.04
    strategy:
      matrix:
        include:
          - {width: 10, low: 5, high: 4}
          - {width: 22, low: 11, high: 10}
          - {width: 28, low: 14, high: 13}
    steps:
      - uses: actions/checkout@v4
      - name: Compile v0.48 validated rebuild baseline
        shell: bash
        run: |
          mkdir -p build
          nvcc -O3 -std=c++17 -lineinfo -arch=sm_80 \
            -DTARGET_W=${{ matrix.width }} \
            -DLOW_LUT_K=${{ matrix.low }} \
            -DHIGH_LUT_K=${{ matrix.high }} \
            src/cuda/b300/oneesan_b300_maskshard_v048_lowmaskbatch_rebuilddyn.cu \
            -o build/b300_maskshard_v48_w${{ matrix.width }}
      - name: Compile v0.49 fast rebuild setup
        shell: bash
        run: |
          nvcc -O3 -std=c++17 -lineinfo -arch=sm_80 \
            -DTARGET_W=${{ matrix.width }} \
            -DLOW_LUT_K=${{ matrix.low }} \
            -DHIGH_LUT_K=${{ matrix.high }} \
            src/cuda/b300/oneesan_b300_maskshard_v049_lowmaskbatch_fastsetup.cu \
            -o build/b300_maskshard_v49_w${{ matrix.width }}

  ab-driver:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax-check v0.48-v0.49 A/B
        run: python3 -m py_compile scripts/bench/b300_maskshard_lowmaskbatch_fastsetup_ab.py
      - name: Dry-run small-width residue comparison
        run: |
          python3 scripts/bench/b300_maskshard_lowmaskbatch_fastsetup_ab.py \
            --dry-run --n 9 --gpus 1 --threads 256 --low 5 --high 4 \
            --modulus 4294967291 --modulus 4294967279
      - name: Dry-run n=27 B300x8 comparison
        run: |
          python3 scripts/bench/b300_maskshard_lowmaskbatch_fastsetup_ab.py \
            --dry-run --n 27 --gpus 8 --threads 256 --low 14 --high 13 \
            --modulus 4294967291
