name: B300 row-depth FBlock v0.14 research

on:
  push:
    paths:
      - 'src/cpp/probes/factor_row_depth_fblock.cpp'
      - 'src/cpp/probes/factor_row_depth_fblock_semantics.cpp'
      - 'src/cuda/b300/maskshard_rowdepth_fblock_io.cuh'
      - 'src/cuda/b300/maskshard_lowclosure_kernel.cuh'
      - 'src/cuda/b300/oneesan_cuda_gridfp_b300_hbm32_maskshard_fullorbit_batch.cu'
      - 'src/cuda/b300/oneesan_cuda_gridfp_b300_hbm32_maskshard_blockorbit_compactaux_fullclosure_highrowpack16_lazyblockinit_batch_guarded.cu'
      - 'src/cuda/b300/oneesan_cuda_gridfp_b300_hbm32_maskshard_blockorbit_compactaux_fullclosure_highrowpack16_lazyblockinit_rowdepthfblock_batch_guarded.cu'
      - 'scripts/bench/b300_maskshard_rowdepth_ab.py'
      - '.github/workflows/b300-rowdepth-v14.yml'
  pull_request:
    paths:
      - 'src/cpp/probes/factor_row_depth_fblock.cpp'
      - 'src/cpp/probes/factor_row_depth_fblock_semantics.cpp'
      - 'src/cuda/b300/maskshard_rowdepth_fblock_io.cuh'
      - 'src/cuda/b300/maskshard_lowclosure_kernel.cuh'
      - 'src/cuda/b300/oneesan_cuda_gridfp_b300_hbm32_maskshard_fullorbit_batch.cu'
      - 'src/cuda/b300/oneesan_cuda_gridfp_b300_hbm32_maskshard_blockorbit_compactaux_fullclosure_highrowpack16_lazyblockinit_batch_guarded.cu'
      - 'src/cuda/b300/oneesan_cuda_gridfp_b300_hbm32_maskshard_blockorbit_compactaux_fullclosure_highrowpack16_lazyblockinit_rowdepthfblock_batch_guarded.cu'
      - 'scripts/bench/b300_maskshard_rowdepth_ab.py'
      - '.github/workflows/b300-rowdepth-v14.yml'
  workflow_dispatch:

jobs:
  model:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build FBlock row-depth traffic model
        run: |
          mkdir -p build
          g++ -O3 -std=c++17 -Wall -Wextra -Werror \
            src/cpp/probes/factor_row_depth_fblock.cpp \
            -o build/factor_row_depth_fblock
      - name: Verify n=27 FBlock traffic regression
        run: build/factor_row_depth_fblock 28 14

  semantics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build FBlock row-depth semantic probe
        run: |
          mkdir -p build
          g++ -O3 -std=c++17 -Wall -Wextra -Werror \
            src/cpp/probes/factor_row_depth_fblock_semantics.cpp \
            -o build/factor_row_depth_fblock_semantics
      - name: Compare filtered and canonical DP through W=12
        run: build/factor_row_depth_fblock_semantics 12

  cuda-compile:
    runs-on: ubuntu-latest
    container: nvidia/cuda:12.8.1-devel-ubuntu22.04
    strategy:
      matrix:
        include:
          - width: 22
            low: 11
            high: 10
          - width: 28
            low: 14
            high: 13
    steps:
      - uses: actions/checkout@v4
      - name: Compile v0.13 lazy BLOCKED init
        shell: bash
        run: |
          mkdir -p build
          nvcc -O3 -std=c++17 -lineinfo -arch=sm_80 \
            -DTARGET_W=${{ matrix.width }} \
            -DLOW_LUT_K=${{ matrix.low }} \
            -DHIGH_LUT_K=${{ matrix.high }} \
            src/cuda/b300/oneesan_cuda_gridfp_b300_hbm32_maskshard_blockorbit_compactaux_fullclosure_highrowpack16_lazyblockinit_batch_guarded.cu \
            -o build/b300_maskshard_v13_w${{ matrix.width }}
      - name: Compile v0.14 FBlock row-depth HIGH I/O
        shell: bash
        run: |
          nvcc -O3 -std=c++17 -lineinfo -arch=sm_80 \
            -DTARGET_W=${{ matrix.width }} \
            -DLOW_LUT_K=${{ matrix.low }} \
            -DHIGH_LUT_K=${{ matrix.high }} \
            src/cuda/b300/oneesan_cuda_gridfp_b300_hbm32_maskshard_blockorbit_compactaux_fullclosure_highrowpack16_lazyblockinit_rowdepthfblock_batch_guarded.cu \
            -o build/b300_maskshard_v14_w${{ matrix.width }}

  ab-driver:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax-check row-depth A/B entrypoint
        run: python3 -m py_compile scripts/bench/b300_maskshard_rowdepth_ab.py
      - name: Dry-run v0.13-v0.14 comparison
        run: |
          python3 scripts/bench/b300_maskshard_rowdepth_ab.py \
            --dry-run --n 27 --gpus 8 --threads 256 --modulus 4294967291
