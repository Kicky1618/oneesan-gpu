name: ramstream32 policy A/B harness CI

on:
  push:
    paths:
      - 'scripts/bench/ramstream32-cpu-high-policy-ab.sh'
      - 'docs/ramstream32-cpu-high-policy-ab.md'
      - '.github/workflows/ramstream32-policy-ab-script-ci.yml'
  pull_request:
    paths:
      - 'scripts/bench/ramstream32-cpu-high-policy-ab.sh'
      - 'docs/ramstream32-cpu-high-policy-ab.md'
      - '.github/workflows/ramstream32-policy-ab-script-ci.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check harness syntax
        shell: bash
        run: bash -n scripts/bench/ramstream32-cpu-high-policy-ab.sh
      - name: Check LOW schedule/domain propagation
        shell: bash
        run: |
          f=scripts/bench/ramstream32-cpu-high-policy-ab.sh
          grep -Fq 'CPU_LOW_SCHEDULE="${CPU_LOW_SCHEDULE:-dynamic}"' "$f"
          grep -Fq 'CPU_LOW_DOMAIN_SIZE="${CPU_LOW_DOMAIN_SIZE:-}"' "$f"
          grep -Fq 'CPU_LOW_DOMAIN_REFINE="${CPU_LOW_DOMAIN_REFINE:-1}"' "$f"
          grep -Fq 'CPU_LOW_DOMAIN_PAGE_TIEBREAK="${CPU_LOW_DOMAIN_PAGE_TIEBREAK:-0}"' "$f"
          grep -Fq 'CPU_LOW_DOMAIN_REFINE="$CPU_LOW_DOMAIN_REFINE"' "$f"
          grep -Fq 'CPU_LOW_DOMAIN_PAGE_TIEBREAK="$CPU_LOW_DOMAIN_PAGE_TIEBREAK"' "$f"
          grep -Fq 'cpu_low_domain_size=${CPU_LOW_DOMAIN_SIZE:-none}' "$f"
          grep -Fq 'cpu_low_domain_refine=$CPU_LOW_DOMAIN_REFINE' "$f"
          grep -Fq 'cpu_low_domain_page_tiebreak=$CPU_LOW_DOMAIN_PAGE_TIEBREAK' "$f"
          grep -Fq 'LOW schedule provenance mismatch' "$f"
          grep -Fq 'LOW domain provenance mismatch' "$f"
          grep -Fq 'LOW refine provenance mismatch' "$f"
          grep -Fq 'LOW page provenance mismatch' "$f"
      - name: Check documented entry point
        shell: bash
        run: |
          d=docs/ramstream32-cpu-high-policy-ab.md
          grep -Fq 'scripts/bench/ramstream32-cpu-high-policy-ab.sh' "$d"
          grep -Fq 'GROUPS_FILE=' "$d"
          grep -Fq 'THRESHOLD_MIB=' "$d"
          grep -Fq 'CPU_LOW_SCHEDULE' "$d"
          grep -Fq 'CPU_LOW_DOMAIN_SIZE' "$d"
          grep -Fq 'CPU_LOW_DOMAIN_REFINE' "$d"
          grep -Fq 'CPU_LOW_DOMAIN_PAGE_TIEBREAK' "$d"
          grep -Fq 'policy_speedup' "$d"
