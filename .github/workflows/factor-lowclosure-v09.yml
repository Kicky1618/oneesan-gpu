name: factor LOW closure v0.9 research

on:
  push:
    paths:
      - 'src/cpp/probes/factor_lowclosure_columns.cpp'
      - 'src/cpp/probes/factor_lowclosure_taskmap.cpp'
      - 'src/cpp/probes/factor_v09_memory_delta.cpp'
      - 'src/cuda/b300/maskshard_lowclosure.cuh'
      - 'src/cuda/b300/maskshard_lowclosure_kernel.cuh'
      - 'src/cuda/b300/probes/maskshard_lowclosure_cols_hostplan.cu'
      - 'src/cuda/b300/oneesan_cuda_gridfp_b300_hbm32_maskshard_blockorbit_compactaux_fullclosurerows_batch_guarded.cu'
      - '.github/workflows/factor-lowclosure-v09.yml'
  pull_request:
    paths:
      - 'src/cpp/probes/factor_lowclosure_columns.cpp'
      - 'src/cpp/probes/factor_lowclosure_taskmap.cpp'
      - 'src/cpp/probes/factor_v09_memory_delta.cpp'
      - 'src/cuda/b300/maskshard_lowclosure.cuh'
      - 'src/cuda/b300/maskshard_lowclosure_kernel.cuh'
      - 'src/cuda/b300/probes/maskshard_lowclosure_cols_hostplan.cu'
      - 'src/cuda/b300/oneesan_cuda_gridfp_b300_hbm32_maskshard_blockorbit_compactaux_fullclosurerows_batch_guarded.cu'
      - '.github/workflows/factor-lowclosure-v09.yml'
  workflow_dispatch:

jobs:
  locality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build LOW closure locality probe
        run: |
          mkdir -p build
          g++ -O3 -std=c++17 -Wall -Wextra -Werror \
            src/cpp/probes/factor_lowclosure_columns.cpp \
            -o build/factor_lowclosure_columns
      - name: Quantify n=27 LOW compact-column locality
        run: build/factor_lowclosure_columns 28 14

  taskmap:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - width: 10
            low: 5
          - width: 12
            low: 6
    steps:
      - uses: actions/checkout@v4
      - name: Build LOW closure task-map probe
        run: |
          mkdir -p build
          g++ -O3 -std=c++17 -Wall -Wextra -Werror \
            src/cpp/probes/factor_lowclosure_taskmap.cpp \
            -o build/factor_lowclosure_taskmap
      - name: Verify row-times-compact-column task mapping
        run: build/factor_lowclosure_taskmap ${{ matrix.width }} ${{ matrix.low }}

  memory-delta:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build v0.9 HBM delta probe
        run: |
          mkdir -p build
          g++ -O3 -std=c++17 -Wall -Wextra -Werror \
            src/cpp/probes/factor_v09_memory_delta.cpp \
            -o build/factor_v09_memory_delta
      - name: Verify n=27 v0.9 HBM delta
        run: build/factor_v09_memory_delta 28 14 249.116280202 268.59
