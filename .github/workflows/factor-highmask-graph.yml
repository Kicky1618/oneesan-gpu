name: factor HIGH-mask graph research

on:
  push:
    paths:
      - 'src/cpp/probes/factor_highmask_graph_export.cpp'
      - 'scripts/research/highmask_spectral_partition.py'
      - '.github/workflows/factor-highmask-graph.yml'
  pull_request:
    paths:
      - 'src/cpp/probes/factor_highmask_graph_export.cpp'
      - 'scripts/research/highmask_spectral_partition.py'
      - '.github/workflows/factor-highmask-graph.yml'
  workflow_dispatch:

jobs:
  graph-export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build exact HIGH-mask graph exporter
        run: |
          mkdir -p build
          g++ -O3 -std=c++17 -Wall -Wextra -Werror \
            src/cpp/probes/factor_highmask_graph_export.cpp \
            -o build/factor_highmask_graph_export
      - name: Verify n=27 graph regression counts
        run: build/factor_highmask_graph_export 28 14
      - name: Syntax-check nonlinear partition research script
        run: python3 -m py_compile scripts/research/highmask_spectral_partition.py
