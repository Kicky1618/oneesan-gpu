name: B300 LOW group packed config v0.38 research

on:
  push:
    paths:
      - 'src/cpp/probes/factor_lowgroup_packed_config.cpp'
      - 'src/cuda/b300/maskshard_low_group_packed_config.cuh'
      - 'src/cuda/b300/maskshard_low_group_packed_closure.cuh'
      - 'src/cuda/b300/maskshard_loworbit_warprow_packed.cuh'
      - 'src/cuda/b300/maskshard_low_group_sync.cuh'
      - 'src/cuda/b300/oneesan_b300_maskshard_v037_loworbit_warprow_u32.cu'
      - 'src/cuda/b300/oneesan_b300_maskshard_v038_lowgroup_packedconfig.cu'
      - 'scripts/bench/b300_maskshard_lowgroup_packedconfig_ab.py'
      - '.github/workflows/b300-lowgroup-packedconfig-v38.yml'
  pull_request:
    paths:
      - 'src/cpp/probes/factor_lowgroup_packed_config.cpp'
      - 'src/cuda/b300/maskshard_low_group_packed_config.cuh'
      - 'src/cuda/b300/maskshard_low_group_packed_closure.cuh'
      - 'src/cuda/b300/maskshard_loworbit_warprow_packed.cuh'
      - 'src/cuda/b300/maskshard_low_group_sync.cuh'
      - 'src/cuda/b300/oneesan_b300_maskshard_v037_loworbit_warprow_u32.cu'
      - 'src/cuda/b300/oneesan_b300_maskshard_v038_lowgroup_packedconfig.cu'
      - 'scripts/bench/b300_maskshard_lowgroup_packedconfig_ab.py'
      - '.github/workflows/b300-lowgroup-packedconfig-v38.yml'
  workflow_dispatch:

jobs:
  model:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build packed LOW group config model
        run: |
          mkdir -p build
          g++ -O3 -std=c++17 -Wall -Wextra -Werror \
            src/cpp/probes/factor_lowgroup_packed_config.cpp \
            -o build/factor_lowgroup_packed_config
      - name: Verify n=27 packed config regression
        run: build/factor_lowgroup_packed_config 28 14

  cuda-compile:
    runs-on: ubuntu-latest
    container: nvidia/cuda:12.8.1-devel-ubuntu22.04
    strategy:
      matrix:
        include:
          - width: 22
            low: 11
            high: 10
          - width: 28
            low: 14
            high: 13
    steps:
      - uses: actions/checkout@v4
      - name: Compile v0.37 u32 warp-row baseline
        shell: bash
        run: |
          mkdir -p build
          nvcc -O3 -std=c++17 -lineinfo -arch=sm_80 \
            -DTARGET_W=${{ matrix.width }} \
            -DLOW_LUT_K=${{ matrix.low }} \
            -DHIGH_LUT_K=${{ matrix.high }} \
            src/cuda/b300/oneesan_b300_maskshard_v037_loworbit_warprow_u32.cu \
            -o build/b300_maskshard_v37_w${{ matrix.width }}
      - name: Compile v0.38 packed LOW group config
        shell: bash
        run: |
          nvcc -O3 -std=c++17 -lineinfo -arch=sm_80 \
            -DTARGET_W=${{ matrix.width }} \
            -DLOW_LUT_K=${{ matrix.low }} \
            -DHIGH_LUT_K=${{ matrix.high }} \
            src/cuda/b300/oneesan_b300_maskshard_v038_lowgroup_packedconfig.cu \
            -o build/b300_maskshard_v38_w${{ matrix.width }}

  ab-driver:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax-check v0.37-v0.38 A/B
        run: python3 -m py_compile scripts/bench/b300_maskshard_lowgroup_packedconfig_ab.py
      - name: Dry-run v0.37-v0.38 comparison
        run: |
          python3 scripts/bench/b300_maskshard_lowgroup_packedconfig_ab.py \
            --dry-run --n 27 --gpus 8 --threads 256 --modulus 4294967291
