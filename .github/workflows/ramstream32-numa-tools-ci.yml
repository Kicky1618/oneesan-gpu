name: ramstream32 NUMA diagnostic tools CI

on:
  push:
    paths:
      - 'scripts/bench/ramstream32-numa-sample.sh'
      - 'scripts/tools/analyze_ramstream_numa_samples.py'
      - 'docs/ramstream32-numa-sampling.md'
      - '.github/workflows/ramstream32-numa-tools-ci.yml'
  pull_request:
    paths:
      - 'scripts/bench/ramstream32-numa-sample.sh'
      - 'scripts/tools/analyze_ramstream_numa_samples.py'
      - 'docs/ramstream32-numa-sampling.md'
      - '.github/workflows/ramstream32-numa-tools-ci.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check syntax
        shell: bash
        run: |
          bash -n scripts/bench/ramstream32-numa-sample.sh
          python3 -m py_compile scripts/tools/analyze_ramstream_numa_samples.py
      - name: Check LOW schedule propagation
        shell: bash
        run: |
          f=scripts/bench/ramstream32-numa-sample.sh
          grep -Fq 'CPU_LOW_SCHEDULE="${CPU_LOW_SCHEDULE:-dynamic}"' "$f"
          grep -Fq 'CPU_LOW_DOMAIN_SIZE="${CPU_LOW_DOMAIN_SIZE:-}"' "$f"
          grep -Fq 'CPU_LOW_DOMAIN_REFINE="${CPU_LOW_DOMAIN_REFINE:-1}"' "$f"
          grep -Fq 'CPU_LOW_DOMAIN_PAGE_TIEBREAK="${CPU_LOW_DOMAIN_PAGE_TIEBREAK:-0}"' "$f"
          grep -Fq 'CPU_LOW_DOMAIN_SIZE="$CPU_LOW_DOMAIN_SIZE"' "$f"
          grep -Fq 'CPU_LOW_DOMAIN_REFINE="$CPU_LOW_DOMAIN_REFINE"' "$f"
          grep -Fq 'CPU_LOW_DOMAIN_PAGE_TIEBREAK="$CPU_LOW_DOMAIN_PAGE_TIEBREAK"' "$f"
          grep -Fq 'cpu_low_domain_size=${CPU_LOW_DOMAIN_SIZE:-none}' "$f"
          grep -Fq 'cpu_low_domain_refine=$CPU_LOW_DOMAIN_REFINE' "$f"
          grep -Fq 'cpu_low_domain_page_tiebreak=$CPU_LOW_DOMAIN_PAGE_TIEBREAK' "$f"
          grep -Fq 'LOW domain provenance mismatch' "$f"
          grep -Fq 'LOW refine provenance mismatch' "$f"
          grep -Fq 'LOW page provenance mismatch' "$f"
          grep -Fq 'LOW domain refinement provenance mismatch' "$f"
          grep -Fq 'LOW domain page provenance mismatch' "$f"
      - name: Check NUMA sample analyzer
        shell: bash
        run: |
          cat >/tmp/numa.log <<'EOF'
          numa_sample tag=row1 array=main bytes=1000 requested_spacing_mib=64 actual_spacing_mib=64 samples=100 success=100 N0=70 N1=30
          numa_sample tag=row1 array=block bytes=500 requested_spacing_mib=64 actual_spacing_mib=64 samples=50 success=50 N0=25 N1=25
          numa_sample tag=final array=main bytes=1000 requested_spacing_mib=64 actual_spacing_mib=64 samples=100 success=100 N0=60 N1=40
          numa_sample tag=final array=block bytes=500 requested_spacing_mib=64 actual_spacing_mib=64 samples=50 success=50 N0=25 N1=25
          EOF
          python3 scripts/tools/analyze_ramstream_numa_samples.py /tmp/numa.log > /tmp/numa-analysis.txt
          grep -Fq 'sample tag=row1 array=main' /tmp/numa-analysis.txt
          grep -Fq 'dominant_node=0 dominant_fraction=0.700000000' /tmp/numa-analysis.txt
          grep -Fq 'drift array=main row1_success=100 final_success=100 node_fraction_l1=0.200000000' /tmp/numa-analysis.txt
          grep -Fq 'aggregate tag=final samples=150 success=150' /tmp/numa-analysis.txt
      - name: Check docs
        shell: bash
        run: |
          d=docs/ramstream32-numa-sampling.md
          grep -Fq 'RAMSTREAM_NUMA_SAMPLE_MIB' "$d"
          grep -Fq 'CPU_LOW_SCHEDULE=domain' "$d"
          grep -Fq 'CPU_LOW_DOMAIN_SIZE' "$d"
          grep -Fq 'CPU_LOW_DOMAIN_REFINE' "$d"
          grep -Fq 'CPU_LOW_DOMAIN_PAGE_TIEBREAK' "$d"
          grep -Fq 'ramstream32-numa-sample.sh' "$d"
          grep -Fq 'analyze_ramstream_numa_samples.py' "$d"
