name: gpu direct bucket fused validation

on:
  push:
    paths:
      - 'src/cuda/gridfp/ramstream32_bucket_layout.hpp'
      - 'src/cuda/gridfp/ramstream32_bucket_direct.hpp'
      - 'src/cuda/gridfp/ramstream32_bucket_fused.cuh'
      - 'src/cuda/gridfp/ramstream32_bucket_fused_v2.cuh'
      - 'src/cuda/gridfp/ramstream32_bucket_fused_async.cuh'
      - 'src/cuda/gridfp/probes/ramstream32_bucket_fused_selftest.cu'
      - 'src/cuda/gridfp/probes/ramstream32_bucket_fused_plan.cu'
      - 'src/cuda/b300/gridfp_bucket_transpose.cuh'
      - 'src/cuda/b300/oneesan_cuda_gridfp_b300_bucket_fused.cu'
      - 'scripts/build/b300-bucket-fused.sh'
      - '.github/workflows/gpu-direct-bucket-fused-compile.yml'
  pull_request:
    paths:
      - 'src/cuda/gridfp/ramstream32_bucket_layout.hpp'
      - 'src/cuda/gridfp/ramstream32_bucket_direct.hpp'
      - 'src/cuda/gridfp/ramstream32_bucket_fused.cuh'
      - 'src/cuda/gridfp/ramstream32_bucket_fused_v2.cuh'
      - 'src/cuda/gridfp/ramstream32_bucket_fused_async.cuh'
      - 'src/cuda/gridfp/probes/ramstream32_bucket_fused_selftest.cu'
      - 'src/cuda/gridfp/probes/ramstream32_bucket_fused_plan.cu'
      - 'src/cuda/b300/gridfp_bucket_transpose.cuh'
      - 'src/cuda/b300/oneesan_cuda_gridfp_b300_bucket_fused.cu'
      - 'scripts/build/b300-bucket-fused.sh'
      - '.github/workflows/gpu-direct-bucket-fused-compile.yml'
  workflow_dispatch:

jobs:
  compile:
    runs-on: ubuntu-latest
    container: nvidia/cuda:12.8.1-devel-ubuntu22.04
    steps:
      - uses: actions/checkout@v4
      - name: Compile W10 exhaustive bucket fused probe
        shell: bash
        run: |
          mkdir -p build
          nvcc -O3 -std=c++17 -lineinfo -arch=sm_80 \
            -DTARGET_W=10 -DLOW_LUT_K=5 -DHIGH_LUT_K=4 \
            src/cuda/gridfp/probes/ramstream32_bucket_fused_selftest.cu \
            -o build/ramstream32_bucket_fused_selftest_w10
      - name: Compile and run W22 bucket fused plan
        shell: bash
        run: |
          nvcc -O3 -std=c++17 -lineinfo -arch=sm_80 \
            -DTARGET_W=22 -DLOW_LUT_K=11 -DHIGH_LUT_K=10 \
            src/cuda/gridfp/probes/ramstream32_bucket_fused_plan.cu \
            -o build/ramstream32_bucket_fused_plan_w22
          build/ramstream32_bucket_fused_plan_w22 | tee /tmp/bkf-w22.txt
          grep -Fq 'backend=gridfp-bucket-fused-plan' /tmp/bkf-w22.txt
          grep -Fq 'locator_bits=18' /tmp/bkf-w22.txt
          grep -Fq 'closure_atomic=0' /tmp/bkf-w22.txt
      - name: Compile and run W28 bucket fused plan
        shell: bash
        run: |
          nvcc -O3 -std=c++17 -lineinfo -arch=sm_80 \
            -DTARGET_W=28 -DLOW_LUT_K=14 -DHIGH_LUT_K=13 \
            src/cuda/gridfp/probes/ramstream32_bucket_fused_plan.cu \
            -o build/ramstream32_bucket_fused_plan_w28
          build/ramstream32_bucket_fused_plan_w28 | tee /tmp/bkf-w28.txt
          grep -Fq 'states=520735012027' /tmp/bkf-w28.txt
          grep -Fq 'owner_high_max=19631' /tmp/bkf-w28.txt
          grep -Fq 'owner_low_max=30114' /tmp/bkf-w28.txt
          grep -Fq 'locator_bits=18' /tmp/bkf-w28.txt
          grep -Fq 'closure_atomic=0' /tmp/bkf-w28.txt
      - name: Compile and run W22 B300 bucket driver plan
        shell: bash
        run: |
          nvcc -O3 -std=c++17 -lineinfo -arch=sm_80 \
            -DTARGET_W=22 -DLOW_LUT_K=11 -DHIGH_LUT_K=10 \
            src/cuda/b300/oneesan_cuda_gridfp_b300_bucket_fused.cu \
            -o build/oneesan_cuda_gridfp_b300_bucket_fused_n21
          build/oneesan_cuda_gridfp_b300_bucket_fused_n21 \
            21 4294967291 256 16 8 256 --plan-only 2>&1 | tee /tmp/bkb-w22.txt
          grep -Fq 'backend=gridfp-b300-bucket-fused-v0.1-plan' /tmp/bkb-w22.txt
          grep -Fq 'transposes_per_residue=43' /tmp/bkb-w22.txt
          grep -Fq 'closure_atomic=0' /tmp/bkb-w22.txt
      - name: Compile and run W28 B300 bucket driver plan
        shell: bash
        run: |
          nvcc -O3 -std=c++17 -lineinfo -arch=sm_80 \
            -DTARGET_W=28 -DLOW_LUT_K=14 -DHIGH_LUT_K=13 \
            src/cuda/b300/oneesan_cuda_gridfp_b300_bucket_fused.cu \
            -o build/oneesan_cuda_gridfp_b300_bucket_fused_n27
          build/oneesan_cuda_gridfp_b300_bucket_fused_n27 \
            27 4294967291 256 16 8 4096 --plan-only 2>&1 | tee /tmp/bkb-w28.txt
          grep -Fq 'backend=gridfp-b300-bucket-fused-v0.1-plan' /tmp/bkb-w28.txt
          grep -Fq 'transposes_per_residue=55' /tmp/bkb-w28.txt
          grep -Fq 'locator_bits=18' /tmp/bkb-w28.txt
          grep -Fq 'closure_atomic=0' /tmp/bkb-w28.txt
