name: B300 LOW orbit tight launch v0.29 research

on:
  push:
    paths:
      - 'src/cpp/probes/factor_low_blockorbit_launch_geometry.cpp'
      - 'src/cpp/probes/factor_loworbit_rowdepth_semantics.cpp'
      - 'src/cuda/b300/oneesan_cuda_gridfp_b300_hbm32_maskshard_fullorbit_batch.cu'
      - 'src/cuda/b300/maskshard_loworbit_rowdepth.cuh'
      - 'src/cuda/b300/oneesan_cuda_gridfp_b300_hbm32_maskshard_blockorbit_compactaux_fullclosure_highrowpack29_lazyblockinit_rowdepthexact_tightlaunch_rowdepthorbit_rowcaplaunch_exacttasks_highclosurerowdepth_tasklaunch_exactclosuretasks_exactclosurelaunch_lowclosurerowdepth_exacttasks_loworbitrowdepth_batch_guarded.cu'
      - 'src/cuda/b300/oneesan_b300_maskshard_v029_loworbit_tightlaunch.cu'
      - 'scripts/bench/b300_maskshard_loworbit_tightlaunch_ab.py'
      - '.github/workflows/b300-loworbit-tightlaunch-v29.yml'
  pull_request:
    paths:
      - 'src/cpp/probes/factor_low_blockorbit_launch_geometry.cpp'
      - 'src/cpp/probes/factor_loworbit_rowdepth_semantics.cpp'
      - 'src/cuda/b300/oneesan_cuda_gridfp_b300_hbm32_maskshard_fullorbit_batch.cu'
      - 'src/cuda/b300/maskshard_loworbit_rowdepth.cuh'
      - 'src/cuda/b300/oneesan_cuda_gridfp_b300_hbm32_maskshard_blockorbit_compactaux_fullclosure_highrowpack29_lazyblockinit_rowdepthexact_tightlaunch_rowdepthorbit_rowcaplaunch_exacttasks_highclosurerowdepth_tasklaunch_exactclosuretasks_exactclosurelaunch_lowclosurerowdepth_exacttasks_loworbitrowdepth_batch_guarded.cu'
      - 'src/cuda/b300/oneesan_b300_maskshard_v029_loworbit_tightlaunch.cu'
      - 'scripts/bench/b300_maskshard_loworbit_tightlaunch_ab.py'
      - '.github/workflows/b300-loworbit-tightlaunch-v29.yml'
  workflow_dispatch:

jobs:
  launch-model:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build LOW BLOCKED launch geometry probe
        run: |
          mkdir -p build
          g++ -O3 -std=c++17 -Wall -Wextra -Werror \
            src/cpp/probes/factor_low_blockorbit_launch_geometry.cpp \
            -o build/factor_low_blockorbit_launch_geometry
      - name: Verify n=27 LOW launch model
        run: build/factor_low_blockorbit_launch_geometry 28 14 256

  semantics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build LOW orbit row-depth semantics probe
        run: |
          mkdir -p build
          g++ -O3 -std=c++17 -Wall -Wextra -Werror \
            src/cpp/probes/factor_loworbit_rowdepth_semantics.cpp \
            -o build/factor_loworbit_rowdepth_semantics
      - name: Verify LOW orbit row-depth semantics
        run: build/factor_loworbit_rowdepth_semantics 12

  cuda-compile:
    runs-on: ubuntu-latest
    container: nvidia/cuda:12.8.1-devel-ubuntu22.04
    strategy:
      matrix:
        include:
          - width: 22
            low: 11
            high: 10
          - width: 28
            low: 14
            high: 13
    steps:
      - uses: actions/checkout@v4
      - name: Compile v0.28 LOW orbit row-depth baseline
        shell: bash
        run: |
          mkdir -p build
          nvcc -O3 -std=c++17 -lineinfo -arch=sm_80 \
            -DTARGET_W=${{ matrix.width }} \
            -DLOW_LUT_K=${{ matrix.low }} \
            -DHIGH_LUT_K=${{ matrix.high }} \
            src/cuda/b300/oneesan_cuda_gridfp_b300_hbm32_maskshard_blockorbit_compactaux_fullclosure_highrowpack29_lazyblockinit_rowdepthexact_tightlaunch_rowdepthorbit_rowcaplaunch_exacttasks_highclosurerowdepth_tasklaunch_exactclosuretasks_exactclosurelaunch_lowclosurerowdepth_exacttasks_loworbitrowdepth_batch_guarded.cu \
            -o build/b300_maskshard_v28_w${{ matrix.width }}
      - name: Compile v0.29 tight LOW orbit launch
        shell: bash
        run: |
          nvcc -O3 -std=c++17 -lineinfo -arch=sm_80 \
            -DTARGET_W=${{ matrix.width }} \
            -DLOW_LUT_K=${{ matrix.low }} \
            -DHIGH_LUT_K=${{ matrix.high }} \
            src/cuda/b300/oneesan_b300_maskshard_v029_loworbit_tightlaunch.cu \
            -o build/b300_maskshard_v29_w${{ matrix.width }}

  ab-driver:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax-check v0.28-v0.29 A/B
        run: python3 -m py_compile scripts/bench/b300_maskshard_loworbit_tightlaunch_ab.py
      - name: Dry-run v0.28-v0.29 comparison
        run: |
          python3 scripts/bench/b300_maskshard_loworbit_tightlaunch_ab.py \
            --dry-run --n 27 --gpus 8 --threads 256 --modulus 4294967291
