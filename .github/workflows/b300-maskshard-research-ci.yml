name: B300 mask-shard research CI

on:
  pull_request:
    paths:
      - 'src/cpp/probes/**'
      - 'src/cuda/b300/**'
      - 'scripts/bench/b300_maskshard_*.py'
      - '.github/workflows/b300-maskshard-research-ci.yml'
  workflow_dispatch:
    inputs:
      full_cuda:
        description: 'Compile the latest CUDA backend for W=10,22,28'
        required: false
        type: boolean
        default: false

concurrency:
  group: b300-maskshard-research-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  structural:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build structural probes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          g++ -O3 -std=c++17 -Wall -Wextra -Werror \
            src/cpp/probes/factor_row_depth_support.cpp \
            -o build/factor_row_depth_support
          g++ -O3 -std=c++17 -Wall -Wextra -Werror \
            src/cpp/probes/factor_highclosure_rowdepth_threshold.cpp \
            -o build/factor_highclosure_rowdepth_threshold
          g++ -O3 -std=c++17 -Wall -Wextra -Werror \
            src/cpp/probes/factor_low_maskbatch_replica_tune.cpp \
            -o build/factor_low_maskbatch_replica_tune
          g++ -O3 -std=c++17 -Wall -Wextra -Werror \
            src/cpp/probes/factor_highio_dirty_scatter.cpp \
            -o build/factor_highio_dirty_scatter
          g++ -O3 -std=c++17 -Wall -Wextra -Werror \
            src/cpp/probes/factor_high_group_sync.cpp \
            -o build/factor_high_group_sync
          g++ -O3 -std=c++17 -Wall -Wextra -Werror \
            src/cpp/probes/factor_high_dead_symbol_copies.cpp \
            -o build/factor_high_dead_symbol_copies
          g++ -O3 -std=c++17 -Wall -Wextra -Werror \
            src/cpp/probes/factor_high_fblock_cache.cpp \
            -o build/factor_high_fblock_cache
          g++ -O3 -std=c++17 -Wall -Wextra -Werror \
            src/cpp/probes/factor_high_group_size_cache.cpp \
            -o build/factor_high_group_size_cache
          g++ -O3 -std=c++17 -Wall -Wextra -Werror \
            src/cpp/probes/factor_high_row_batch_async.cpp \
            -o build/factor_high_row_batch_async
          g++ -O3 -std=c++17 -Wall -Wextra -Werror \
            src/cpp/probes/factor_high_pinned_config.cpp \
            -o build/factor_high_pinned_config
          g++ -O3 -std=c++17 -Wall -Wextra -Werror \
            src/cpp/probes/factor_high_nblock_once.cpp \
            -o build/factor_high_nblock_once
          g++ -O3 -std=c++17 -Wall -Wextra -Werror \
            src/cpp/probes/factor_high_fblock_layout_dedup.cpp \
            -o build/factor_high_fblock_layout_dedup
          g++ -O3 -std=c++17 -Wall -Wextra -Werror \
            src/cpp/probes/factor_high_fblock_class_cache.cpp \
            -o build/factor_high_fblock_class_cache
          g++ -O3 -std=c++17 -Wall -Wextra -Werror \
            src/cpp/probes/factor_high_group_size_class_cache.cpp \
            -o build/factor_high_group_size_class_cache
          g++ -O3 -std=c++17 -Wall -Wextra -Werror \
            src/cpp/probes/factor_high_row_plan_class_cache.cpp \
            -o build/factor_high_row_plan_class_cache
          g++ -O3 -std=c++17 -Wall -Wextra -Werror \
            src/cpp/probes/factor_high_row_plan_copy_dedup.cpp \
            -o build/factor_high_row_plan_copy_dedup
          g++ -O3 -std=c++17 -Wall -Wextra -Werror \
            src/cpp/probes/factor_high_compact_count_release.cpp \
            -o build/factor_high_compact_count_release
          g++ -O3 -std=c++17 -Wall -Wextra -Werror \
            src/cpp/probes/factor_high_perthread_stream.cpp \
            -o build/factor_high_perthread_stream
          g++ -O3 -std=c++17 -Wall -Wextra -Werror \
            src/cpp/probes/factor_highclosure_launch_class_cache.cpp \
            -o build/factor_highclosure_launch_class_cache
          python3 -m py_compile \
            scripts/bench/b300_maskshard_highgroupsync_ab.py \
            scripts/bench/b300_maskshard_highdeadcopies_ab.py \
            scripts/bench/b300_maskshard_highfblockcache_ab.py \
            scripts/bench/b300_maskshard_highgroupsizecache_ab.py \
            scripts/bench/b300_maskshard_highrowbatchasync_ab.py \
            scripts/bench/b300_maskshard_highpinnedconfig_ab.py \
            scripts/bench/b300_maskshard_highnblockonce_ab.py \
            scripts/bench/b300_maskshard_highfblockdedup_ab.py \
            scripts/bench/b300_maskshard_highfblockclasscache_ab.py \
            scripts/bench/b300_maskshard_highgroupsizeclass_ab.py \
            scripts/bench/b300_maskshard_highrowplanclass_ab.py \
            scripts/bench/b300_maskshard_highrowplandedup_ab.py \
            scripts/bench/b300_maskshard_highreleasecounts_ab.py \
            scripts/bench/b300_maskshard_highperthreadstream_ab.py \
            scripts/bench/b300_maskshard_highclosureclass_ab.py
      - name: Run structural smoke tests
        shell: bash
        run: |
          set -euo pipefail
          build/factor_row_depth_support 14
          build/factor_highclosure_rowdepth_threshold 28 14 256 29
          build/factor_low_maskbatch_replica_tune 28 14 8 65536
          build/factor_highio_dirty_scatter 28 14
          build/factor_high_group_sync 28 14
          build/factor_high_dead_symbol_copies 28 14
          build/factor_high_fblock_cache 28 14
          build/factor_high_group_size_cache 28 14
          build/factor_high_row_batch_async 28 14 8
          build/factor_high_pinned_config 28 14
          build/factor_high_nblock_once 28 14 8
          build/factor_high_fblock_layout_dedup 28 14 8
          build/factor_high_fblock_class_cache 28 14
          build/factor_high_group_size_class_cache 28 14
          build/factor_high_row_plan_class_cache 28 14
          build/factor_high_row_plan_copy_dedup 28 14 8
          build/factor_high_compact_count_release 28 14 13
          build/factor_high_perthread_stream 28 14 13
          build/factor_highclosure_launch_class_cache 28 14 13

  cuda-compile:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.full_cuda }}
    runs-on: ubuntu-latest
    container: nvidia/cuda:12.8.1-devel-ubuntu22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - {width: 10, low: 5, high: 4}
          - {width: 22, low: 11, high: 10}
          - {width: 28, low: 14, high: 13}
    steps:
      - uses: actions/checkout@v4
      - name: Compile latest HIGH closure-class backend
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          nvcc -O3 -std=c++17 -lineinfo -arch=sm_80 \
            -DTARGET_W=${{ matrix.width }} \
            -DLOW_LUT_K=${{ matrix.low }} \
            -DHIGH_LUT_K=${{ matrix.high }} \
            src/cuda/b300/oneesan_b300_maskshard_v071_highclosureclass.cu \
            -o build/maskshard_v071_w${{ matrix.width }}
