name: B300 Stage T preflight

on:
  push:
    paths:
      - 'scripts/build/gen-b300-mainrec-ilp2-mate-load-policy.py'
      - 'scripts/build/b300-forced-nextgen-hybrid8-staget-ilp2-mate-load-policy.sh'
      - 'scripts/bench/b300-mainrec-ilp2-mate-load-policy-staget-preflight.sh'
      - 'scripts/bench/b300-nextgen-hybrid8-staget-ilp2-mate-load-policy-sweep.sh'
      - 'scripts/bench/b300-nextgen-hybrid8-staget-ilp2-mate-load-policy-staged-calibrate.sh'
      - 'scripts/bench/b300-staget-preflight.sh'
      - '.github/workflows/b300-staget-preflight.yml'
  pull_request:
    paths:
      - 'scripts/build/gen-b300-mainrec-ilp2-mate-load-policy.py'
      - 'scripts/build/b300-forced-nextgen-hybrid8-staget-ilp2-mate-load-policy.sh'
      - 'scripts/bench/b300-mainrec-ilp2-mate-load-policy-staget-preflight.sh'
      - 'scripts/bench/b300-nextgen-hybrid8-staget-ilp2-mate-load-policy-sweep.sh'
      - 'scripts/bench/b300-nextgen-hybrid8-staget-ilp2-mate-load-policy-staged-calibrate.sh'
      - 'scripts/bench/b300-staget-preflight.sh'
      - '.github/workflows/b300-staget-preflight.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate Stage T transform, composition, sweep, and staged contracts
        run: bash scripts/bench/b300-staget-preflight.sh
