name: B300 LOW closure packed metadata v0.42 research

on:
  push:
    paths:
      - 'src/cpp/probes/factor_lowclosure_packed_meta.cpp'
      - 'src/cuda/b300/maskshard_low_group_packed_config.cuh'
      - 'src/cuda/b300/maskshard_loworbit_warprow_packed.cuh'
      - 'src/cuda/b300/maskshard_low_group_packed_closure_prefix.cuh'
      - 'src/cuda/b300/maskshard_low_group_packed_closure_meta.cuh'
      - 'src/cuda/b300/maskshard_low_group_sync.cuh'
      - 'src/cuda/b300/oneesan_b300_maskshard_v041_lowclosure_packedprefix.cu'
      - 'src/cuda/b300/oneesan_b300_maskshard_v042_lowclosure_packedmeta.cu'
      - 'scripts/bench/b300_maskshard_lowclosure_packedmeta_ab.py'
      - '.github/workflows/b300-lowclosure-packedmeta-v42.yml'
  pull_request:
    paths:
      - 'src/cpp/probes/factor_lowclosure_packed_meta.cpp'
      - 'src/cuda/b300/maskshard_low_group_packed_config.cuh'
      - 'src/cuda/b300/maskshard_loworbit_warprow_packed.cuh'
      - 'src/cuda/b300/maskshard_low_group_packed_closure_prefix.cuh'
      - 'src/cuda/b300/maskshard_low_group_packed_closure_meta.cuh'
      - 'src/cuda/b300/maskshard_low_group_sync.cuh'
      - 'src/cuda/b300/oneesan_b300_maskshard_v041_lowclosure_packedprefix.cu'
      - 'src/cuda/b300/oneesan_b300_maskshard_v042_lowclosure_packedmeta.cu'
      - 'scripts/bench/b300_maskshard_lowclosure_packedmeta_ab.py'
      - '.github/workflows/b300-lowclosure-packedmeta-v42.yml'
  workflow_dispatch:

jobs:
  model:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p build
          g++ -O3 -std=c++17 -Wall -Wextra -Werror src/cpp/probes/factor_lowclosure_packed_meta.cpp -o build/factor_lowclosure_packed_meta
          build/factor_lowclosure_packed_meta 22 11
          build/factor_lowclosure_packed_meta 28 14

  cuda-compile:
    runs-on: ubuntu-latest
    container: nvidia/cuda:12.8.1-devel-ubuntu22.04
    strategy:
      matrix:
        include:
          - {width: 22, low: 11, high: 10}
          - {width: 28, low: 14, high: 13}
    steps:
      - uses: actions/checkout@v4
      - name: Compile v0.41 and v0.42
        shell: bash
        run: |
          mkdir -p build
          for v in 041_lowclosure_packedprefix 042_lowclosure_packedmeta; do
            nvcc -O3 -std=c++17 -lineinfo -arch=sm_80 \
              -DTARGET_W=${{ matrix.width }} -DLOW_LUT_K=${{ matrix.low }} -DHIGH_LUT_K=${{ matrix.high }} \
              src/cuda/b300/oneesan_b300_maskshard_v${v}.cu -o build/v${v}_w${{ matrix.width }}
          done

  ab-driver:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m py_compile scripts/bench/b300_maskshard_lowclosure_packedmeta_ab.py
      - run: python3 scripts/bench/b300_maskshard_lowclosure_packedmeta_ab.py --dry-run --n 27 --gpus 8 --threads 256 --modulus 4294967291
