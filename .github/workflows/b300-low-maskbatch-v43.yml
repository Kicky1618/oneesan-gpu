name: B300 LOW mask-batch v0.43 research

on:
  push:
    paths:
      - 'src/cpp/probes/factor_low_maskbatch_launch.cpp'
      - 'src/cpp/probes/factor_low_maskbatch_replica.cpp'
      - 'src/cuda/b300/maskshard_low_maskbatch_plan.hpp'
      - 'src/cuda/b300/maskshard_low_maskbatch_tables.hpp'
      - 'src/cuda/b300/maskshard_low_maskbatch_rowplan.hpp'
      - 'src/cuda/b300/maskshard_low_maskbatch_config.cuh'
      - 'src/cuda/b300/maskshard_low_maskbatch_kernels.cuh'
      - 'src/cuda/b300/maskshard_low_maskbatch_executor.cuh'
      - 'src/cuda/b300/oneesan_b300_maskshard_v043_lowmaskbatch_proto.cu'
      - 'docs/b300-low-mask-batch.md'
      - '.github/workflows/b300-low-maskbatch-v43.yml'
  pull_request:
    paths:
      - 'src/cpp/probes/factor_low_maskbatch_launch.cpp'
      - 'src/cpp/probes/factor_low_maskbatch_replica.cpp'
      - 'src/cuda/b300/maskshard_low_maskbatch_plan.hpp'
      - 'src/cuda/b300/maskshard_low_maskbatch_tables.hpp'
      - 'src/cuda/b300/maskshard_low_maskbatch_rowplan.hpp'
      - 'src/cuda/b300/maskshard_low_maskbatch_config.cuh'
      - 'src/cuda/b300/maskshard_low_maskbatch_kernels.cuh'
      - 'src/cuda/b300/maskshard_low_maskbatch_executor.cuh'
      - 'src/cuda/b300/oneesan_b300_maskshard_v043_lowmaskbatch_proto.cu'
      - 'docs/b300-low-mask-batch.md'
      - '.github/workflows/b300-low-maskbatch-v43.yml'
  workflow_dispatch:

jobs:
  model:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build mask-batch models
        run: |
          mkdir -p build
          g++ -O3 -std=c++17 -Wall -Wextra -Werror src/cpp/probes/factor_low_maskbatch_launch.cpp -o build/factor_low_maskbatch_launch
          g++ -O3 -std=c++17 -Wall -Wextra -Werror src/cpp/probes/factor_low_maskbatch_replica.cpp -o build/factor_low_maskbatch_replica
      - name: Verify launch collapse
        run: |
          build/factor_low_maskbatch_launch 22 11 8 3
          build/factor_low_maskbatch_launch 28 14 8 3
      - name: Verify exact replica task coverage
        run: |
          build/factor_low_maskbatch_replica 257 8 16 4096
          build/factor_low_maskbatch_replica 1024 8 16 16384

  cuda-compile:
    runs-on: ubuntu-latest
    container: nvidia/cuda:12.8.1-devel-ubuntu22.04
    strategy:
      matrix:
        include:
          - {width: 22, low: 11, high: 10}
          - {width: 28, low: 14, high: 13}
    steps:
      - uses: actions/checkout@v4
      - name: Compile resident mask-batch prototype
        shell: bash
        run: |
          mkdir -p build
          nvcc -O3 -std=c++17 -lineinfo -arch=sm_80 \
            -DTARGET_W=${{ matrix.width }} \
            -DLOW_LUT_K=${{ matrix.low }} \
            -DHIGH_LUT_K=${{ matrix.high }} \
            src/cuda/b300/oneesan_b300_maskshard_v043_lowmaskbatch_proto.cu \
            -o build/b300_maskshard_v43_proto_w${{ matrix.width }}
