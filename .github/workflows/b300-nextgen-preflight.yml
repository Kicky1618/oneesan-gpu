name: B300 nextgen preflight

on:
  push:
    paths:
      - 'scripts/build/b300-forced-nextgen.sh'
      - 'scripts/build/gen-b300-main-recurrence-ilp.py'
      - 'scripts/build/gen-b300-main-recurrence-hybrid-ilp8.py'
      - 'scripts/build/gen-b300-mainrec-hybrid8-next-self-prefetch.py'
      - 'scripts/build/gen-b300-mainrec-random-cg.py'
      - 'scripts/build/gen-b300-mainrec-prefetch-l2.py'
      - 'scripts/bench/b300-nextgen-*.sh'
      - 'scripts/bench/b300-main-recurrence-ilp-partition-proof.py'
      - 'scripts/bench/b300-mainrec-hybrid-ilp8-partition-proof.py'
      - 'scripts/bench/b300-mainrec-hybrid-ilp8-transform-preflight.sh'
      - 'scripts/bench/b300-mainrec-hybrid8-nextself-transform-preflight.sh'
      - 'scripts/bench/b300-joint-nextgen-hybrid8-preflight.sh'
      - 'scripts/bench/b300x8-ilp8-nextself-staged-ab.sh'
      - 'scripts/run/b300x8-nextgen-select.sh'
      - 'scripts/run/b300x8-nextgen-hybrid8-staged-fullprime-race.sh'
      - 'scripts/run/b300x8-nextgen-hybrid8-nextself-staged-fullprime-race.sh'
      - 'scripts/run/b300x8-joint-nextgen-hybrid8-select.sh'
      - 'scripts/run/b300x8-joint-nextself-hybrid8-select.sh'
      - 'scripts/run/b300x8-joint-calibrated-select.sh'
      - 'scripts/run/b300x8-ilp8-nextself-staged-fullprime-race.sh'
      - 'scripts/run/b300x8-race-forced-profiled-once.sh'
      - 'scripts/run/b300x8-race-external-forced-profiled-once.sh'
      - 'scripts/run/b300x8-grand-firstpass.sh'
      - '.github/workflows/b300-nextgen-preflight.yml'
  pull_request:
    paths:
      - 'scripts/build/b300-forced-nextgen.sh'
      - 'scripts/build/gen-b300-main-recurrence-ilp.py'
      - 'scripts/build/gen-b300-main-recurrence-hybrid-ilp8.py'
      - 'scripts/build/gen-b300-mainrec-hybrid8-next-self-prefetch.py'
      - 'scripts/build/gen-b300-mainrec-random-cg.py'
      - 'scripts/build/gen-b300-mainrec-prefetch-l2.py'
      - 'scripts/bench/b300-nextgen-*.sh'
      - 'scripts/bench/b300-main-recurrence-ilp-partition-proof.py'
      - 'scripts/bench/b300-mainrec-hybrid-ilp8-partition-proof.py'
      - 'scripts/bench/b300-mainrec-hybrid-ilp8-transform-preflight.sh'
      - 'scripts/bench/b300-mainrec-hybrid8-nextself-transform-preflight.sh'
      - 'scripts/bench/b300-joint-nextgen-hybrid8-preflight.sh'
      - 'scripts/bench/b300x8-ilp8-nextself-staged-ab.sh'
      - 'scripts/run/b300x8-nextgen-select.sh'
      - 'scripts/run/b300x8-nextgen-hybrid8-staged-fullprime-race.sh'
      - 'scripts/run/b300x8-nextgen-hybrid8-nextself-staged-fullprime-race.sh'
      - 'scripts/run/b300x8-joint-nextgen-hybrid8-select.sh'
      - 'scripts/run/b300x8-joint-nextself-hybrid8-select.sh'
      - 'scripts/run/b300x8-joint-calibrated-select.sh'
      - 'scripts/run/b300x8-ilp8-nextself-staged-fullprime-race.sh'
      - 'scripts/run/b300x8-race-forced-profiled-once.sh'
      - 'scripts/run/b300x8-race-external-forced-profiled-once.sh'
      - 'scripts/run/b300x8-grand-firstpass.sh'
      - '.github/workflows/b300-nextgen-preflight.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate nextgen transform chain
        run: bash scripts/bench/b300-nextgen-preflight.sh
      - name: Validate hybrid8 next-self transform composition
        run: bash scripts/bench/b300-mainrec-hybrid8-nextself-transform-preflight.sh
      - name: Validate joint hybrid8 and next-self promotion chain
        run: bash scripts/bench/b300-joint-nextgen-hybrid8-preflight.sh
      - name: Validate grand next-self + hybrid8 selector
        run: bash scripts/bench/b300-nextgen-grand-selector-preflight.sh
