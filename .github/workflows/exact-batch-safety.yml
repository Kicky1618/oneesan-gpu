name: exact batch safety

on:
  push:
    paths:
      - 'scripts/solve/solve_b300_exact_batch.py'
      - 'scripts/solve/test_solve_b300_exact_batch.py'
      - '.github/workflows/exact-batch-safety.yml'
  pull_request:
    paths:
      - 'scripts/solve/solve_b300_exact_batch.py'
      - 'scripts/solve/test_solve_b300_exact_batch.py'
      - '.github/workflows/exact-batch-safety.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run exact batch safety tests
        run: python3 scripts/solve/test_solve_b300_exact_batch.py
