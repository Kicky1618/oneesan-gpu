name: orbit closure fusion validation

on:
  push:
    paths:
      - 'src/cuda/gridfp/ramstream32_bucket_fused.cuh'
      - 'src/cuda/gridfp/ramstream32_bucket_fused_pm.cuh'
      - 'src/cuda/gridfp/ramstream32_bucket_reverse_fused.cuh'
      - 'src/cuda/gridfp/ramstream32_bucket_reverse_fused_pm.cuh'
      - 'src/cuda/gridfp/ramstream32_bucket_orbit_closure_fused.cuh'
      - 'src/cuda/gridfp/ramstream32_bucket_orbit_closure_checked.cuh'
      - 'src/cuda/gridfp/ramstream32_bucket_orbit_closure_preflight.cuh'
      - 'src/cuda/gridfp/probes/ramstream32_orbit_closure_fusion_plan.cu'
      - 'src/cuda/gridfp/probes/ramstream32_orbit_closure_attach_plan.cu'
      - 'src/cuda/gridfp/probes/ramstream32_orbit_closure_ordinal_plan.cu'
      - 'src/cuda/gridfp/probes/ramstream32_bucket_orbit_closure_fused_selftest.cu'
      - 'src/cuda/gridfp/probes/ramstream32_bucket_reverse_orbit_closure_fused_selftest.cu'
      - 'src/cuda/b300/oneesan_cuda_gridfp_b300_bucket_snake_onepass.cu'
      - 'src/cuda/b300/oneesan_cuda_gridfp_b300_bucket_snake_onepass_events.cu'
      - 'src/cuda/b300/oneesan_cuda_gridfp_b300_bucket_snake_onepass_pipeline.cu'
      - 'src/cuda/b300/oneesan_cuda_gridfp_b300_bucket_snake_onepass_batch.cu'
      - 'src/cuda/b300/oneesan_cuda_gridfp_b300_bucket_snake_onepass_batch_events.cu'
      - 'src/cuda/b300/oneesan_cuda_gridfp_b300_bucket_snake_onepass_batch_pipeline.cu'
      - 'scripts/build/b300-bucket-snake.sh'
      - 'scripts/build/b300-bucket-snake-batch.sh'
      - 'scripts/run/b300x8-bucket-snake-exact.sh'
      - '.github/workflows/orbit-closure-fusion-validation.yml'
  pull_request:
    paths:
      - 'src/cuda/gridfp/ramstream32_bucket_fused.cuh'
      - 'src/cuda/gridfp/ramstream32_bucket_fused_pm.cuh'
      - 'src/cuda/gridfp/ramstream32_bucket_reverse_fused.cuh'
      - 'src/cuda/gridfp/ramstream32_bucket_reverse_fused_pm.cuh'
      - 'src/cuda/gridfp/ramstream32_bucket_orbit_closure_fused.cuh'
      - 'src/cuda/gridfp/ramstream32_bucket_orbit_closure_checked.cuh'
      - 'src/cuda/gridfp/ramstream32_bucket_orbit_closure_preflight.cuh'
      - 'src/cuda/gridfp/probes/ramstream32_orbit_closure_fusion_plan.cu'
      - 'src/cuda/gridfp/probes/ramstream32_orbit_closure_attach_plan.cu'
      - 'src/cuda/gridfp/probes/ramstream32_orbit_closure_ordinal_plan.cu'
      - 'src/cuda/gridfp/probes/ramstream32_bucket_orbit_closure_fused_selftest.cu'
      - 'src/cuda/gridfp/probes/ramstream32_bucket_reverse_orbit_closure_fused_selftest.cu'
      - 'src/cuda/b300/oneesan_cuda_gridfp_b300_bucket_snake_onepass.cu'
      - 'src/cuda/b300/oneesan_cuda_gridfp_b300_bucket_snake_onepass_events.cu'
      - 'src/cuda/b300/oneesan_cuda_gridfp_b300_bucket_snake_onepass_pipeline.cu'
      - 'src/cuda/b300/oneesan_cuda_gridfp_b300_bucket_snake_onepass_batch.cu'
      - 'src/cuda/b300/oneesan_cuda_gridfp_b300_bucket_snake_onepass_batch_events.cu'
      - 'src/cuda/b300/oneesan_cuda_gridfp_b300_bucket_snake_onepass_batch_pipeline.cu'
      - 'scripts/build/b300-bucket-snake.sh'
      - 'scripts/build/b300-bucket-snake-batch.sh'
      - 'scripts/run/b300x8-bucket-snake-exact.sh'
      - '.github/workflows/orbit-closure-fusion-validation.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    container: nvidia/cuda:12.8.1-devel-ubuntu22.04
    steps:
      - uses: actions/checkout@v4
      - name: Compile and run W10 host attachment proof
        shell: bash
        run: |
          mkdir -p build
          nvcc -O3 -std=c++17 -lineinfo -arch=sm_80 \
            -DTARGET_W=10 -DLOW_LUT_K=5 -DHIGH_LUT_K=4 \
            src/cuda/gridfp/probes/ramstream32_orbit_closure_attach_plan.cu \
            -o build/orbit_closure_attach_w10
          build/orbit_closure_attach_w10 | tee /tmp/orbit-closure-attach.txt
          grep -Fq 'orbit-closure-attach-plan OK W=10' /tmp/orbit-closure-attach.txt
          grep -Fq 'kernels_per_position=1' /tmp/orbit-closure-attach.txt
          grep -Fq 'source_disjoint=1' /tmp/orbit-closure-attach.txt
      - name: Compile and run W10 closure ordinal profile
        shell: bash
        run: |
          nvcc -O3 -std=c++17 -lineinfo -arch=sm_80 \
            -DTARGET_W=10 -DLOW_LUT_K=5 -DHIGH_LUT_K=4 \
            src/cuda/gridfp/probes/ramstream32_orbit_closure_ordinal_plan.cu \
            -o build/orbit_closure_ordinal_w10
          build/orbit_closure_ordinal_w10 | tee /tmp/orbit-closure-ordinal.txt
          grep -Fq 'orbit-closure-ordinal-plan OK W=10' /tmp/orbit-closure-ordinal.txt
      - name: Compile W10 forward one-pass GPU selftest
        shell: bash
        run: |
          nvcc -O3 -std=c++17 -lineinfo -arch=sm_80 \
            -DTARGET_W=10 -DLOW_LUT_K=5 -DHIGH_LUT_K=4 \
            src/cuda/gridfp/probes/ramstream32_bucket_orbit_closure_fused_selftest.cu \
            -o build/bucket_orbit_closure_w10
          build/bucket_orbit_closure_w10 | tee /tmp/orbit-closure-forward.txt
          grep -Eq 'gpu-bucket-orbit-closure-selftest (OK W=10|SKIP no CUDA device)' /tmp/orbit-closure-forward.txt
      - name: Compile W10 reverse one-pass GPU selftest
        shell: bash
        run: |
          nvcc -O3 -std=c++17 -lineinfo -arch=sm_80 \
            -DTARGET_W=10 -DLOW_LUT_K=5 -DHIGH_LUT_K=4 \
            src/cuda/gridfp/probes/ramstream32_bucket_reverse_orbit_closure_fused_selftest.cu \
            -o build/bucket_reverse_orbit_closure_w10
          build/bucket_reverse_orbit_closure_w10 | tee /tmp/orbit-closure-reverse.txt
          grep -Eq 'bucket-reverse-orbit-closure-selftest (OK W=10|SKIP no CUDA device)' /tmp/orbit-closure-reverse.txt
      - name: Compile PM one-pass variants
        shell: bash
        run: |
          nvcc -O3 -std=c++17 -lineinfo -arch=sm_80 \
            -DTARGET_W=10 -DLOW_LUT_K=5 -DHIGH_LUT_K=4 -DGPU_DIRECT_PM_ACCUM=1 \
            src/cuda/gridfp/probes/ramstream32_bucket_orbit_closure_fused_selftest.cu \
            -o build/bucket_orbit_closure_pm_w10
          nvcc -O3 -std=c++17 -lineinfo -arch=sm_80 \
            -DTARGET_W=10 -DLOW_LUT_K=5 -DHIGH_LUT_K=4 -DGPU_DIRECT_PM_ACCUM=1 \
            src/cuda/gridfp/probes/ramstream32_bucket_reverse_orbit_closure_fused_selftest.cu \
            -o build/bucket_reverse_orbit_closure_pm_w10
      - name: Compile and run W10 one-pass event snake plan
        shell: bash
        run: |
          nvcc -O3 -std=c++17 -lineinfo -arch=sm_80 \
            -DTARGET_W=10 -DLOW_LUT_K=5 -DHIGH_LUT_K=4 \
            src/cuda/b300/oneesan_cuda_gridfp_b300_bucket_snake_onepass_events.cu \
            -o build/snake_onepass_events_w10
          build/snake_onepass_events_w10 9 4294967291 256 4 4 64 --plan-only 2>&1 | tee /tmp/snake-onepass.txt
          grep -Fq 'backend=gridfp-b300-bucket-snake-onepass-v0.1-plan' /tmp/snake-onepass.txt
          grep -Fq 'kernels_per_position=1' /tmp/snake-onepass.txt
          grep -Fq 'transposes_per_residue=10' /tmp/snake-onepass.txt
          grep -Fq 'orbit_main_write_overlap=0 OK' /tmp/snake-onepass.txt
      - name: Compile and run W10 one-pass pipeline batch plan
        shell: bash
        run: |
          nvcc -O3 -std=c++17 -lineinfo -arch=sm_80 \
            -DTARGET_W=10 -DLOW_LUT_K=5 -DHIGH_LUT_K=4 \
            src/cuda/b300/oneesan_cuda_gridfp_b300_bucket_snake_onepass_batch_pipeline.cu \
            -o build/snake_onepass_batch_pipeline_w10
          build/snake_onepass_batch_pipeline_w10 9 64 5 8 --plan-only 2>&1 | tee /tmp/snake-onepass-batch.txt
          grep -Fq 'backend=gridfp-b300-bucket-snake-onepass-batch-v0.1-plan' /tmp/snake-onepass-batch.txt
          grep -Fq 'kernels_per_position=1' /tmp/snake-onepass-batch.txt
          grep -Fq 'transpose_staging_multiplier=2' /tmp/snake-onepass-batch.txt
          grep -Fq 'orbit_main_write_overlap=0 OK' /tmp/snake-onepass-batch.txt
      - name: Compile W28 closure ordinal profile
        shell: bash
        run: |
          nvcc -O3 -std=c++17 -lineinfo -arch=sm_80 \
            -DTARGET_W=28 -DLOW_LUT_K=14 -DHIGH_LUT_K=13 \
            src/cuda/gridfp/probes/ramstream32_orbit_closure_ordinal_plan.cu \
            -o build/orbit_closure_ordinal_w28
      - name: Compile W28 one-pass event production driver
        shell: bash
        run: |
          nvcc -O3 -std=c++17 -lineinfo -arch=sm_80 \
            -DTARGET_W=28 -DLOW_LUT_K=14 -DHIGH_LUT_K=13 \
            src/cuda/b300/oneesan_cuda_gridfp_b300_bucket_snake_onepass_events.cu \
            -o build/snake_onepass_events_w28
      - name: Compile W28 PM one-pass pipeline batch driver
        shell: bash
        run: |
          nvcc -O3 -std=c++17 -lineinfo -arch=sm_80 \
            -DTARGET_W=28 -DLOW_LUT_K=14 -DHIGH_LUT_K=13 -DGPU_DIRECT_PM_ACCUM=1 \
            src/cuda/b300/oneesan_cuda_gridfp_b300_bucket_snake_onepass_batch_pipeline.cu \
            -o build/snake_onepass_batch_pipeline_pm_w28
