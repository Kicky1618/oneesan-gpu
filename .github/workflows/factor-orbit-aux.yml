name: factor orbit aux research

on:
  push:
    paths:
      - 'src/cpp/probes/factor_orbit_aux_semantics.cpp'
      - 'src/cpp/probes/factor_orbitaux_savings.cpp'
      - 'src/cpp/probes/factor_blockorbit_semantics.cpp'
      - 'src/cpp/probes/factor_blockorbit_compactaux_semantics.cpp'
      - 'src/cpp/probes/factor_highclosure_rows.cpp'
      - 'src/cpp/probes/factor_highclosure_rowpack.cpp'
      - 'src/cpp/probes/factor_highclosure_rowpack_taskmap.cpp'
      - 'src/cpp/probes/factor_highclosure_cross.cpp'
      - 'src/cuda/b300/probes/maskshard_orbitaux_hostplan.cu'
      - 'src/cuda/b300/probes/maskshard_blockorbitaux_hostplan.cu'
      - 'src/cuda/b300/probes/maskshard_highclosure_rows_hostplan.cu'
      - 'src/cuda/b300/maskshard_highio.cuh'
      - 'src/cuda/b300/maskshard_highorbit.cuh'
      - 'src/cuda/b300/maskshard_highclosure_rowpack.cuh'
      - 'src/cuda/b300/maskshard_loworbit.cuh'
      - 'src/cuda/b300/maskshard_index.cuh'
      - 'src/cuda/gridfp/ramstream32_highdesc.cuh'
      - 'src/cpp/probes/factor_maskshard_memory.cpp'
      - '.github/workflows/factor-orbit-aux.yml'
  pull_request:
    paths:
      - 'src/cpp/probes/factor_orbit_aux_semantics.cpp'
      - 'src/cpp/probes/factor_orbitaux_savings.cpp'
      - 'src/cpp/probes/factor_blockorbit_semantics.cpp'
      - 'src/cpp/probes/factor_blockorbit_compactaux_semantics.cpp'
      - 'src/cpp/probes/factor_highclosure_rows.cpp'
      - 'src/cpp/probes/factor_highclosure_rowpack.cpp'
      - 'src/cpp/probes/factor_highclosure_rowpack_taskmap.cpp'
      - 'src/cpp/probes/factor_highclosure_cross.cpp'
      - 'src/cuda/b300/probes/maskshard_orbitaux_hostplan.cu'
      - 'src/cuda/b300/probes/maskshard_blockorbitaux_hostplan.cu'
      - 'src/cuda/b300/probes/maskshard_highclosure_rows_hostplan.cu'
      - 'src/cuda/b300/maskshard_highio.cuh'
      - 'src/cuda/b300/maskshard_highorbit.cuh'
      - 'src/cuda/b300/maskshard_highclosure_rowpack.cuh'
      - 'src/cuda/b300/maskshard_loworbit.cuh'
      - 'src/cuda/b300/maskshard_index.cuh'
      - 'src/cuda/gridfp/ramstream32_highdesc.cuh'
      - 'src/cpp/probes/factor_maskshard_memory.cpp'
      - '.github/workflows/factor-orbit-aux.yml'
  workflow_dispatch:

jobs:
  semantics:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - width: 10
            low: 5
          - width: 12
            low: 6
    steps:
      - uses: actions/checkout@v4
      - name: Build orbit aux semantic probe
        run: |
          mkdir -p build
          g++ -O3 -std=c++17 -Wall -Wextra -Werror \
            src/cpp/probes/factor_orbit_aux_semantics.cpp \
            -o build/factor_orbit_aux_semantics
      - name: Verify descriptor plus aux orbit targets
        run: build/factor_orbit_aux_semantics ${{ matrix.width }} ${{ matrix.low }}

  blockorbit-semantics:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        width: [10, 12]
    steps:
      - uses: actions/checkout@v4
      - name: Build blocked-domain orbit semantic probe
        run: |
          mkdir -p build
          g++ -O3 -std=c++17 -Wall -Wextra -Werror \
            src/cpp/probes/factor_blockorbit_semantics.cpp \
            -o build/factor_blockorbit_semantics
      - name: Compare blocked-domain orbit plus closure with canonical update
        run: build/factor_blockorbit_semantics ${{ matrix.width }}

  compact-blockaux-semantics:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        width: [10, 12]
    steps:
      - uses: actions/checkout@v4
      - name: Build compact blocked-coordinate aux probe
        run: |
          mkdir -p build
          g++ -O3 -std=c++17 -Wall -Wextra -Werror \
            src/cpp/probes/factor_blockorbit_compactaux_semantics.cpp \
            -o build/factor_blockorbit_compactaux_semantics
      - name: Verify one-word compact aux reproduces canonical update
        run: build/factor_blockorbit_compactaux_semantics ${{ matrix.width }}

  highclosure-rows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build HIGH closure row work-model probe
        run: |
          mkdir -p build
          g++ -O3 -std=c++17 -Wall -Wextra -Werror \
            src/cpp/probes/factor_highclosure_rows.cpp \
            -o build/factor_highclosure_rows
      - name: Quantify n=27 HIGH row traversal and launch grids
        run: build/factor_highclosure_rows 28 14 256

  highclosure-rowpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build HIGH closure row-packing probe
        run: |
          mkdir -p build
          g++ -O3 -std=c++17 -Wall -Wextra -Werror \
            src/cpp/probes/factor_highclosure_rowpack.cpp \
            -o build/factor_highclosure_rowpack
      - name: Quantify n=27 packed HIGH closure work
        run: build/factor_highclosure_rowpack 28 14 256

  highclosure-rowpack-taskmap:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - width: 10
            low: 5
          - width: 12
            low: 6
    steps:
      - uses: actions/checkout@v4
      - name: Build packed HIGH closure task-map probe
        run: |
          mkdir -p build
          g++ -O3 -std=c++17 -Wall -Wextra -Werror \
            src/cpp/probes/factor_highclosure_rowpack_taskmap.cpp \
            -o build/factor_highclosure_rowpack_taskmap
      - name: Compare packed and row-wise HIGH closure source maps
        run: build/factor_highclosure_rowpack_taskmap ${{ matrix.width }} ${{ matrix.low }}

  highclosure-cross:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build HIGH closure CROSS probe
        run: |
          mkdir -p build
          g++ -O3 -std=c++17 -Wall -Wextra -Werror \
            src/cpp/probes/factor_highclosure_cross.cpp \
            -o build/factor_highclosure_cross
      - name: Quantify n=27 CROSS depths and target-table options
        run: build/factor_highclosure_cross 28 14

  savings:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build orbit-aux savings probe
        run: |
          mkdir -p build
          g++ -O3 -std=c++17 -Wall -Wextra -Werror \
            src/cpp/probes/factor_orbitaux_savings.cpp \
            -o build/factor_orbitaux_savings
      - name: Verify delete-N bijection and n=27 lookup count
        run: build/factor_orbitaux_savings 28 14

  memory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build HBM budget probe
        run: |
          mkdir -p build
          g++ -O3 -std=c++17 -Wall -Wextra -Werror \
            src/cpp/probes/factor_maskshard_memory.cpp \
            -o build/factor_maskshard_memory
      - name: Verify n=27 v0.8 HBM budget
        run: build/factor_maskshard_memory 28 14 8 268.59
