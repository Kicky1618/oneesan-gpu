name: B300 mask-shard compile

on:
  push:
    paths:
      - 'src/cuda/b300/oneesan_cuda_gridfp_b300_hbm32_maskshard.cu'
      - 'src/cuda/b300/oneesan_cuda_gridfp_b300_hbm32_maskshard_highdesc.cu'
      - 'src/cuda/b300/oneesan_cuda_gridfp_b300_hbm32_maskshard_highorbit.cu'
      - 'src/cuda/b300/oneesan_cuda_gridfp_b300_hbm32_maskshard_fullorbit.cu'
      - 'src/cuda/b300/oneesan_cuda_gridfp_b300_hbm32_maskshard_fullorbit_batch.cu'
      - 'src/cuda/b300/oneesan_cuda_gridfp_b300_hbm32_maskshard_plan.cu'
      - 'src/cuda/b300/maskshard_headers_compile.cu'
      - 'src/cuda/b300/maskshard_address_selftest.cu'
      - 'src/cuda/b300/maskshard_layout.hpp'
      - 'src/cuda/b300/maskshard_lowlocal.cuh'
      - 'src/cuda/b300/maskshard_highio.cuh'
      - 'src/cuda/b300/maskshard_highorbit.cuh'
      - 'src/cuda/b300/maskshard_loworbit.cuh'
      - 'src/cuda/gridfp/ramstream32_factorized_storage.hpp'
      - 'src/cuda/gridfp/ramstream32_highdesc.cuh'
      - 'src/cuda/gridfp/ramstream32_lowdesc.cuh'
      - 'src/cuda/b300/oneesan_cuda_gridfp_b300_hbm32_factorized_batch.cu'
      - '.github/workflows/b300-maskshard-compile.yml'
  pull_request:
    paths:
      - 'src/cuda/b300/oneesan_cuda_gridfp_b300_hbm32_maskshard.cu'
      - 'src/cuda/b300/oneesan_cuda_gridfp_b300_hbm32_maskshard_highdesc.cu'
      - 'src/cuda/b300/oneesan_cuda_gridfp_b300_hbm32_maskshard_highorbit.cu'
      - 'src/cuda/b300/oneesan_cuda_gridfp_b300_hbm32_maskshard_fullorbit.cu'
      - 'src/cuda/b300/oneesan_cuda_gridfp_b300_hbm32_maskshard_fullorbit_batch.cu'
      - 'src/cuda/b300/oneesan_cuda_gridfp_b300_hbm32_maskshard_plan.cu'
      - 'src/cuda/b300/maskshard_headers_compile.cu'
      - 'src/cuda/b300/maskshard_address_selftest.cu'
      - 'src/cuda/b300/maskshard_layout.hpp'
      - 'src/cuda/b300/maskshard_lowlocal.cuh'
      - 'src/cuda/b300/maskshard_highio.cuh'
      - 'src/cuda/b300/maskshard_highorbit.cuh'
      - 'src/cuda/b300/maskshard_loworbit.cuh'
      - 'src/cuda/gridfp/ramstream32_factorized_storage.hpp'
      - 'src/cuda/gridfp/ramstream32_highdesc.cuh'
      - 'src/cuda/gridfp/ramstream32_lowdesc.cuh'
      - 'src/cuda/b300/oneesan_cuda_gridfp_b300_hbm32_factorized_batch.cu'
      - '.github/workflows/b300-maskshard-compile.yml'
  workflow_dispatch:

jobs:
  address-selftest:
    runs-on: ubuntu-latest
    container: nvidia/cuda:12.8.1-devel-ubuntu22.04
    steps:
      - uses: actions/checkout@v4
      - name: Build exhaustive address selftest
        shell: bash
        run: |
          mkdir -p build
          nvcc -O3 -std=c++17 -lineinfo -arch=sm_80 \
            -DTARGET_W=10 -DLOW_LUT_K=5 -DHIGH_LUT_K=4 \
            src/cuda/b300/maskshard_address_selftest.cu \
            -o build/maskshard_address_selftest
      - name: Verify authoritative and HIGH-I/O bijections
        shell: bash
        run: build/maskshard_address_selftest

  plan:
    runs-on: ubuntu-latest
    container: nvidia/cuda:12.8.1-devel-ubuntu22.04
    strategy:
      matrix:
        include:
          - width: 22
            n: 21
            low: 11
            high: 10
          - width: 28
            n: 27
            low: 14
            high: 13
    steps:
      - uses: actions/checkout@v4
      - name: Compile mask-shard CUDA headers
        shell: bash
        run: |
          mkdir -p build
          nvcc -O3 -std=c++17 -lineinfo -arch=sm_80 \
            -DTARGET_W=${{ matrix.width }} \
            -DLOW_LUT_K=${{ matrix.low }} \
            -DHIGH_LUT_K=${{ matrix.high }} \
            src/cuda/b300/maskshard_headers_compile.cu \
            -o build/b300_maskshard_headers_w${{ matrix.width }}
      - name: Compile end-to-end mask-shard solver
        shell: bash
        run: |
          nvcc -O3 -std=c++17 -lineinfo -arch=sm_80 \
            -DTARGET_W=${{ matrix.width }} \
            -DLOW_LUT_K=${{ matrix.low }} \
            -DHIGH_LUT_K=${{ matrix.high }} \
            src/cuda/b300/oneesan_cuda_gridfp_b300_hbm32_maskshard.cu \
            -o build/b300_maskshard_w${{ matrix.width }}
      - name: Compile HIGH-descriptor mask-shard solver
        shell: bash
        run: |
          nvcc -O3 -std=c++17 -lineinfo -arch=sm_80 \
            -DTARGET_W=${{ matrix.width }} \
            -DLOW_LUT_K=${{ matrix.low }} \
            -DHIGH_LUT_K=${{ matrix.high }} \
            src/cuda/b300/oneesan_cuda_gridfp_b300_hbm32_maskshard_highdesc.cu \
            -o build/b300_maskshard_highdesc_w${{ matrix.width }}
      - name: Compile in-place HIGH-orbit mask-shard solver
        shell: bash
        run: |
          nvcc -O3 -std=c++17 -lineinfo -arch=sm_80 \
            -DTARGET_W=${{ matrix.width }} \
            -DLOW_LUT_K=${{ matrix.low }} \
            -DHIGH_LUT_K=${{ matrix.high }} \
            src/cuda/b300/oneesan_cuda_gridfp_b300_hbm32_maskshard_highorbit.cu \
            -o build/b300_maskshard_highorbit_w${{ matrix.width }}
      - name: Compile full in-place orbit mask-shard solver
        shell: bash
        run: |
          nvcc -O3 -std=c++17 -lineinfo -arch=sm_80 \
            -DTARGET_W=${{ matrix.width }} \
            -DLOW_LUT_K=${{ matrix.low }} \
            -DHIGH_LUT_K=${{ matrix.high }} \
            src/cuda/b300/oneesan_cuda_gridfp_b300_hbm32_maskshard_fullorbit.cu \
            -o build/b300_maskshard_fullorbit_w${{ matrix.width }}
      - name: Compile full-orbit batch solver
        shell: bash
        run: |
          nvcc -O3 -std=c++17 -lineinfo -arch=sm_80 \
            -DTARGET_W=${{ matrix.width }} \
            -DLOW_LUT_K=${{ matrix.low }} \
            -DHIGH_LUT_K=${{ matrix.high }} \
            src/cuda/b300/oneesan_cuda_gridfp_b300_hbm32_maskshard_fullorbit_batch.cu \
            -o build/b300_maskshard_fullorbit_batch_w${{ matrix.width }}
      - name: Compile mask-shard layout plan
        shell: bash
        run: |
          nvcc -O3 -std=c++17 -lineinfo -arch=sm_80 \
            -DTARGET_W=${{ matrix.width }} \
            -DLOW_LUT_K=${{ matrix.low }} \
            -DHIGH_LUT_K=${{ matrix.high }} \
            src/cuda/b300/oneesan_cuda_gridfp_b300_hbm32_maskshard_plan.cu \
            -o build/b300_maskshard_plan_w${{ matrix.width }}
      - name: Validate host layout plan
        shell: bash
        run: |
          build/b300_maskshard_plan_w${{ matrix.width }} ${{ matrix.n }} 8
