name: factor row-depth structural sparsity

on:
  push:
    paths:
      - 'src/cpp/probes/factor_row_depth_support.cpp'
      - 'docs/b300-row-depth-sparsity.md'
      - '.github/workflows/factor-row-depth-support.yml'
  pull_request:
    paths:
      - 'src/cpp/probes/factor_row_depth_support.cpp'
      - 'docs/b300-row-depth-sparsity.md'
      - '.github/workflows/factor-row-depth-support.yml'
  workflow_dispatch:

jobs:
  support:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build row-depth support probe
        run: |
          mkdir -p build
          g++ -O3 -std=c++17 -Wall -Wextra -Werror \
            src/cpp/probes/factor_row_depth_support.cpp \
            -o build/factor_row_depth_support
      - name: Verify W<=14 reachability and n=27 traffic cap
        run: build/factor_row_depth_support 14
