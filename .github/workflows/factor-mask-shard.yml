name: factor mask shard research

on:
  push:
    paths:
      - 'src/cpp/probes/factor_mask_shard_balance.cpp'
      - 'src/cpp/probes/factor_highmask_closure.cpp'
      - 'src/cpp/probes/factor_highmask_edge_cut.cpp'
      - 'src/cpp/probes/factor_maskshard_bijection.cpp'
      - 'src/cpp/probes/factor_highdesc_semantics.cpp'
      - 'src/cpp/probes/factor_highorbit_semantics.cpp'
      - 'src/cpp/probes/factor_loworbit_semantics.cpp'
      - 'src/cpp/probes/factor_orbit_racefree.cpp'
      - 'src/cpp/probes/factor_fullorbit_schedule_equiv.cpp'
      - 'src/cpp/probes/factor_low_storage_contiguous.cpp'
      - 'src/cpp/probes/factor_maskshard_memory.cpp'
      - 'src/common/gridfp_transition.hpp'
      - '.github/workflows/factor-mask-shard.yml'
  pull_request:
    paths:
      - 'src/cpp/probes/factor_mask_shard_balance.cpp'
      - 'src/cpp/probes/factor_highmask_closure.cpp'
      - 'src/cpp/probes/factor_highmask_edge_cut.cpp'
      - 'src/cpp/probes/factor_maskshard_bijection.cpp'
      - 'src/cpp/probes/factor_highdesc_semantics.cpp'
      - 'src/cpp/probes/factor_highorbit_semantics.cpp'
      - 'src/cpp/probes/factor_loworbit_semantics.cpp'
      - 'src/cpp/probes/factor_orbit_racefree.cpp'
      - 'src/cpp/probes/factor_fullorbit_schedule_equiv.cpp'
      - 'src/cpp/probes/factor_low_storage_contiguous.cpp'
      - 'src/cpp/probes/factor_maskshard_memory.cpp'
      - 'src/common/gridfp_transition.hpp'
      - '.github/workflows/factor-mask-shard.yml'
  workflow_dispatch:

jobs:
  balance:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - width: 22
            low: 11
            gpus: 8
          - width: 28
            low: 14
            gpus: 8
    steps:
      - uses: actions/checkout@v4
      - name: Build balance probe
        run: |
          mkdir -p build
          g++ -O3 -std=c++17 -Wall -Wextra -Werror src/cpp/probes/factor_mask_shard_balance.cpp -o build/factor_mask_shard_balance
      - name: Run balance probe
        run: build/factor_mask_shard_balance ${{ matrix.width }} ${{ matrix.low }} ${{ matrix.gpus }}

  memory:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - width: 22
            low: 11
            gpus: 8
            usable: 268.59
          - width: 28
            low: 14
            gpus: 8
            usable: 268.59
    steps:
      - uses: actions/checkout@v4
      - name: Build mask-shard HBM budget probe
        run: |
          mkdir -p build
          g++ -O3 -std=c++17 -Wall -Wextra -Werror src/cpp/probes/factor_maskshard_memory.cpp -o build/factor_maskshard_memory
      - name: Verify v0.4 HBM budget
        run: build/factor_maskshard_memory ${{ matrix.width }} ${{ matrix.low }} ${{ matrix.gpus }} ${{ matrix.usable }}

  low-storage-contiguous:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build LOW storage contiguity probe
        run: |
          mkdir -p build
          g++ -O3 -std=c++17 -Wall -Wextra -Werror src/cpp/probes/factor_low_storage_contiguous.cpp -o build/factor_low_storage_contiguous
      - name: Verify all LOW=14 occupancy-major intervals
        run: build/factor_low_storage_contiguous 14

  closure:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - width: 10
            low: 5
          - width: 12
            low: 6
    steps:
      - uses: actions/checkout@v4
      - name: Build HIGH-mask closure probe
        run: |
          mkdir -p build
          g++ -O3 -std=c++17 -Wall -Wextra -Werror src/cpp/probes/factor_highmask_closure.cpp -o build/factor_highmask_closure
      - name: Exhaustively verify LOW-window closure
        run: build/factor_highmask_closure ${{ matrix.width }} ${{ matrix.low }}

  bijection:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build independent mask-shard bijection probe
        run: |
          mkdir -p build
          g++ -O3 -std=c++17 -Wall -Wextra -Werror src/cpp/probes/factor_maskshard_bijection.cpp -o build/factor_maskshard_bijection
      - name: Verify LOW direct and HIGH route layouts
        run: build/factor_maskshard_bijection 10 5 8

  highdesc-semantics:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - width: 10
            low: 5
          - width: 12
            low: 6
    steps:
      - uses: actions/checkout@v4
      - name: Build HIGH descriptor semantic probe
        run: |
          mkdir -p build
          g++ -O3 -std=c++17 -Wall -Wextra -Werror src/cpp/probes/factor_highdesc_semantics.cpp -o build/factor_highdesc_semantics
      - name: Exhaustively compare descriptors with Grid-FP transitions
        run: build/factor_highdesc_semantics ${{ matrix.width }} ${{ matrix.low }}

  highorbit-semantics:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - width: 10
            low: 5
          - width: 12
            low: 6
    steps:
      - uses: actions/checkout@v4
      - name: Build in-place HIGH orbit semantic probe
        run: |
          mkdir -p build
          g++ -O3 -std=c++17 -Wall -Wextra -Werror src/cpp/probes/factor_highorbit_semantics.cpp -o build/factor_highorbit_semantics
      - name: Compare HIGH orbit plus closure with out-of-place update
        run: build/factor_highorbit_semantics ${{ matrix.width }} ${{ matrix.low }}

  loworbit-semantics:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - width: 10
            low: 5
          - width: 12
            low: 6
    steps:
      - uses: actions/checkout@v4
      - name: Build in-place LOW orbit semantic probe
        run: |
          mkdir -p build
          g++ -O3 -std=c++17 -Wall -Wextra -Werror src/cpp/probes/factor_loworbit_semantics.cpp -o build/factor_loworbit_semantics
      - name: Compare LOW orbit plus closure with out-of-place update
        run: build/factor_loworbit_semantics ${{ matrix.width }} ${{ matrix.low }}

  racefree:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - width: 10
            low: 5
          - width: 12
            low: 6
    steps:
      - uses: actions/checkout@v4
      - name: Build orbit race-freedom probe
        run: |
          mkdir -p build
          g++ -O3 -std=c++17 -Wall -Wextra -Werror src/cpp/probes/factor_orbit_racefree.cpp -o build/factor_orbit_racefree
      - name: Verify non-atomic orbit footprints and closure non-cascade
        run: build/factor_orbit_racefree ${{ matrix.width }} ${{ matrix.low }}

  fullorbit-schedule:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - width: 10
            low: 5
            rows: 10
          - width: 12
            low: 6
            rows: 12
    steps:
      - uses: actions/checkout@v4
      - name: Build full-orbit schedule equivalence probe
        run: |
          mkdir -p build
          g++ -O3 -std=c++17 -Wall -Wextra -Werror src/cpp/probes/factor_fullorbit_schedule_equiv.cpp -o build/factor_fullorbit_schedule_equiv
      - name: Compare grouped full-orbit schedule with canonical DP
        run: build/factor_fullorbit_schedule_equiv ${{ matrix.width }} ${{ matrix.low }} ${{ matrix.rows }}

  edge-cut:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build HIGH-mask edge-cut probe
        run: |
          mkdir -p build
          g++ -O3 -std=c++17 -Wall -Wextra -Werror src/cpp/probes/factor_highmask_edge_cut.cpp -o build/factor_highmask_edge_cut
      - name: Search balanced linear shard functions
        run: build/factor_highmask_edge_cut 28 14 10000 1.025
