name: ramstream32 global LOW page plan CI

on:
  push:
    paths:
      - 'src/cuda/gridfp/ramstream32_cpu_low_domain_page.hpp'
      - 'src/cuda/gridfp/ramstream32_cpu_low_domain_page_global.hpp'
      - 'src/cuda/gridfp/probes/ramstream32_cpu_low_global_page_plan.cu'
      - 'src/cuda/gridfp/probes/ramstream32_cpu_low_global_page_selftest.cu'
      - 'scripts/build/gridfp-ramstream32-cpu-low-global-page-plan.sh'
      - 'scripts/bench/ramstream32-cpu-low-global-page-plan-sweep.sh'
      - 'docs/ramstream32-cpu-low-scheduling.md'
      - 'docs/ramstream32-cpu-low-page-aware.md'
      - '.github/workflows/ramstream32-global-page-plan-ci.yml'
  pull_request:
    paths:
      - 'src/cuda/gridfp/ramstream32_cpu_low_domain_page.hpp'
      - 'src/cuda/gridfp/ramstream32_cpu_low_domain_page_global.hpp'
      - 'src/cuda/gridfp/probes/ramstream32_cpu_low_global_page_plan.cu'
      - 'src/cuda/gridfp/probes/ramstream32_cpu_low_global_page_selftest.cu'
      - 'scripts/build/gridfp-ramstream32-cpu-low-global-page-plan.sh'
      - 'scripts/bench/ramstream32-cpu-low-global-page-plan-sweep.sh'
      - 'docs/ramstream32-cpu-low-scheduling.md'
      - 'docs/ramstream32-cpu-low-page-aware.md'
      - '.github/workflows/ramstream32-global-page-plan-ci.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    container: nvidia/cuda:12.8.1-devel-ubuntu22.04
    steps:
      - uses: actions/checkout@v4
      - name: Check scripts
        shell: bash
        run: |
          bash -n scripts/build/gridfp-ramstream32-cpu-low-global-page-plan.sh
          bash -n scripts/bench/ramstream32-cpu-low-global-page-plan-sweep.sh
          grep -Fq 'global-unique-max-guard-page-sum-v5.24-plan' scripts/bench/ramstream32-cpu-low-global-page-plan-sweep.sh
          grep -Fq 'global unique page regression' scripts/bench/ramstream32-cpu-low-global-page-plan-sweep.sh
          grep -Fq 'classification=global_beats_local' scripts/bench/ramstream32-cpu-low-global-page-plan-sweep.sh
      - name: Compile W10 global page probes
        shell: bash
        run: |
          mkdir -p build
          common=(-O3 -std=c++17 -arch=sm_80 -DTARGET_W=10 -DLOW_LUT_K=5 -DHIGH_LUT_K=4)
          nvcc "${common[@]}" \
            src/cuda/gridfp/probes/ramstream32_cpu_low_global_page_plan.cu \
            -o build/ramstream32_cpu_low_global_page_plan
          nvcc "${common[@]}" \
            src/cuda/gridfp/probes/ramstream32_cpu_low_global_page_selftest.cu \
            -o build/ramstream32_cpu_low_global_page_selftest
      - name: Validate synthetic global unique semantics
        shell: bash
        run: |
          build/ramstream32_cpu_low_global_page_selftest | tee /tmp/global-page-selftest.txt
          grep -Fq 'cpu-low-global-page-selftest OK' /tmp/global-page-selftest.txt
          grep -Fq 'local_sum_example=4' /tmp/global-page-selftest.txt
          grep -Fq 'global_unique_example=3' /tmp/global-page-selftest.txt
          grep -Fq 'global_improved_example=2' /tmp/global-page-selftest.txt
      - name: Validate four-domain global unique plan
        shell: bash
        run: |
          build/ramstream32_cpu_low_global_page_plan 9 4 1 \
            > /tmp/global-page-plan.txt 2> /tmp/global-page-plan.log
          grep -Fq 'cpu_low_global_page_plan OK' /tmp/global-page-plan.txt
          grep -Fq 'objective=global-unique-max-guard-page-sum-v5.24-plan' /tmp/global-page-plan.txt
          grep -Fq 'refined_max_worker_cells=' /tmp/global-page-plan.txt
          grep -Fq 'local_max_worker_cells=' /tmp/global-page-plan.txt
          grep -Fq 'global_max_worker_cells=' /tmp/global-page-plan.txt
          grep -Fq 'local_global_pages_2m=' /tmp/global-page-plan.txt
          grep -Fq 'global_pages_2m=' /tmp/global-page-plan.txt
          grep -Fq 'global_candidate_evaluations=' /tmp/global-page-plan.txt
          grep -Fq 'cpu_low_domain_page_tiebreak objective=max_guard-page-sum-v5.23' /tmp/global-page-plan.log
          grep -Fq 'cpu_low_domain_global_page_tiebreak objective=global-unique-max-guard-page-sum-v5.24-plan' /tmp/global-page-plan.log
          python3 - <<'PY'
          fields = {}
          for token in open('/tmp/global-page-plan.txt').readline().split():
              if '=' in token:
                  k, v = token.split('=', 1)
                  fields[k] = v
          refined = int(fields['refined_max_worker_cells'])
          local = int(fields['local_max_worker_cells'])
          glob = int(fields['global_max_worker_cells'])
          assert local <= refined
          assert glob <= local
          lp = (int(fields['local_global_pages_2m']), int(fields['local_global_pages_4k']))
          gp = (int(fields['global_pages_2m']), int(fields['global_pages_4k']))
          assert gp <= lp
          PY
      - name: Check documentation
        shell: bash
        run: |
          p=docs/ramstream32-cpu-low-page-aware.md
          grep -Fq 'v5.24 global-unique research optimizer' "$p"
          grep -Fq 'gridfp-ramstream32-cpu-low-global-page-plan.sh' "$p"
          grep -Fq 'ramstream32-cpu-low-global-page-plan-sweep.sh' "$p"
          grep -Fq 'global_beats_local' "$p"
          grep -Fq 'page_improve_sum_increase_moves' "$p"
