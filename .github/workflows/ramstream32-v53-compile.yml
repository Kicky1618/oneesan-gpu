name: ramstream32 v5.3 compile

on:
  pull_request:
    paths:
      - 'src/cuda/gridfp/oneesan_cuda_gridfp_ramstream32_factorized_hybrid_maskmajor_orbit.cu'
      - 'src/cuda/gridfp/ramstream32_high_orbit.cuh'
      - 'src/cuda/gridfp/ramstream32_cpu_low_maskmajor.hpp'
      - 'src/cuda/gridfp/probes/ramstream32_high_orbit_selftest.cu'
      - 'scripts/build/gridfp-ramstream32-factorized-hybrid-maskmajor-orbit.sh'
      - '.github/workflows/ramstream32-v53-compile.yml'
  workflow_dispatch:

jobs:
  v53:
    runs-on: ubuntu-latest
    container: nvidia/cuda:12.8.1-devel-ubuntu22.04
    strategy:
      matrix:
        include:
          - width: 22
            n: 21
            low: 11
            high: 10
          - width: 28
            n: 27
            low: 14
            high: 13
    steps:
      - uses: actions/checkout@v4
      - name: Compile v5.3 orbit
        shell: bash
        run: |
          mkdir -p build
          nvcc -O3 -std=c++17 -lineinfo -arch=sm_80 \
            -DTARGET_W=${{ matrix.width }} -DLOW_LUT_K=${{ matrix.low }} -DHIGH_LUT_K=${{ matrix.high }} \
            src/cuda/gridfp/oneesan_cuda_gridfp_ramstream32_factorized_hybrid_maskmajor_orbit.cu \
            -o build/v53_w${{ matrix.width }}
      - name: Plan v5.3 orbit
        shell: bash
        run: build/v53_w${{ matrix.width }} ${{ matrix.n }} 4294967291 12288 4 --plan-only
      - name: Validate HIGH orbit in-place equivalence
        if: matrix.width == 22
        shell: bash
        run: |
          nvcc -O3 -std=c++17 -arch=sm_80 \
            -DTARGET_W=10 -DLOW_LUT_K=5 -DHIGH_LUT_K=4 \
            src/cuda/gridfp/probes/ramstream32_high_orbit_selftest.cu \
            -o build/high_orbit_selftest
          build/high_orbit_selftest
