[project]
name = "manimations"
version = "0.1.0"
description = "Manim animations for the GPU counting-oneesan project"
readme = "README.md"
authors = [
    { name = "kicky1618", email = "69379510+Kicky1618@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "manim>=0.19.0,<0.20",
]

[project.scripts]
manimations = "manimations:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
